<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comic Book Page Generator — Round 2 (P2)</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1c2024;
    --muted: #626b76;
    --line: #dfe3e8;
    --accent: #2f6fed;
    --accent-soft: #e8f0ff;
    --ok: #17864a;
    --ok-soft: #e3f6ec;
    --warn: #b7791f;
    --warn-soft: #fdf3dd;
    --bad: #c0392b;
    --bad-soft: #fdecea;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #1f2228;
      --ink: #e9ecf1;
      --muted: #9aa4b1;
      --line: #333a43;
      --accent: #6f9dff;
      --accent-soft: #1d2b45;
      --ok: #4ec27f;
      --ok-soft: #17301f;
      --warn: #e0b24d;
      --warn-soft: #33290f;
      --bad: #ff8a75;
      --bad-soft: #3a1c18;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px 14px 140px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  header.page h1 { margin: 0 0 6px; font-size: 1.32rem; line-height: 1.25; }
  header.page p { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; font-size: 0.82rem; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  h2.group {
    font-size: 1.02rem; margin: 26px 0 6px; padding-bottom: 6px;
    border-bottom: 2px solid var(--accent); display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
  }
  .group-sub { color: var(--muted); font-size: 0.82rem; font-weight: 400; margin: 0 0 12px; }
  section.q {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  }
  section.q.answered { border-left-color: var(--ok); }
  .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
  .q-id { flex: 0 0 auto; font-weight: 700; font-size: 0.78rem; background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 6px; margin-top: 2px; }
  .q-text { font-weight: 600; }
  select, textarea, input[type=text], input[type=password], input[type=number] {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  }
  select { min-height: 42px; }
  textarea { resize: vertical; min-height: 62px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  label.opt { display: flex; gap: 9px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; font-size: 0.94rem; }
  label.opt:hover { border-color: var(--accent); }
  label.opt input { margin: 2px 0 0; flex: 0 0 auto; width: 17px; height: 17px; }
  .note-label { display: block; margin: 10px 0 4px; font-size: 0.8rem; color: var(--muted); }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 0.86rem; color: var(--muted); cursor: pointer; }
  label.chk input { width: 16px; height: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 10px; }
  .field { flex: 1 1 180px; min-width: 140px; }
  .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  .targets { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .setting-help { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .setting-help code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 0.9em; }
  details.gh { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); margin-bottom: 16px; }
  details.gh > summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  details.gh > summary::-webkit-details-marker { display: none; }
  details.gh > summary::before { content: "▸"; color: var(--muted); }
  details.gh[open] > summary::before { content: "▾"; }
  details.gh .gh-body { padding: 0 18px 18px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 14px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 10px 16px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.small { padding: 7px 12px; font-size: 0.86rem; }
  button:disabled { opacity: 0.55; cursor: default; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding: 12px 14px; box-shadow: 0 -6px 20px rgba(0,0,0,0.08); }
  .bar-inner { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .bar-status { font-size: 0.85rem; color: var(--muted); }
  .bar-status.done { color: var(--ok); font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--bg); font-weight: 600; font-size: 0.88rem; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 30; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .fallback { margin-top: 10px; display: none; }
  .fallback.show { display: block; }
  #resultsEl { display: none; }
  #resultsEl.show { display: block; }
  .res-line { display: flex; gap: 8px; align-items: baseline; margin: 6px 0; font-size: 0.9rem; flex-wrap: wrap; }
  .res-line a { color: var(--accent); word-break: break-all; }
  .res-err { color: var(--bad); font-size: 0.84rem; }
  .steps { margin: 8px 0 0 18px; padding: 0; font-size: 0.86rem; color: var(--muted); }
  .steps li { margin: 4px 0; }
  details.preview { margin-top: 8px; }
  details.preview summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); }
  details.preview pre { white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0 0; max-height: 320px; overflow: auto; }
  @media (max-width: 560px) {
    body { padding: 14px 10px 170px; }
    .card, details.gh > summary { padding-left: 14px; padding-right: 14px; }
    .q-head { flex-direction: column; gap: 6px; }
    .q-text { font-size: 0.97rem; }
    .btns { width: 100%; }
    .btns button.primary { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page card">
    <h1 id="pageTitle"></h1>
    <p id="pageIntro"></p>
    <div class="meta-row">
      <span id="pageVersion" class="pill"></span>
      <span id="pageTickets"></span>
      <span id="pageState"></span>
    </div>
  </header>

  <div id="resultsEl" class="card"></div>

  <details class="gh" id="ghCard">
    <summary>
      <span>GitHub tickets</span>
      <span id="ghBadge" class="pill warn">not connected</span>
      <span id="ghWhere" class="pill">—</span>
    </summary>
    <div class="gh-body">
      <div class="row">
        <div class="field"><label for="ghOwner">Owner</label><input type="text" id="ghOwner" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="ghRepo">Repository</label><input type="text" id="ghRepo" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="ghBranch">Branch</label><input type="text" id="ghBranch" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="ghFolder">Tickets folder</label><input type="text" id="ghFolder" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1 1 320px;"><label for="ghToken">GitHub token (fine-grained PAT, Contents: read + write)</label><input type="password" id="ghToken" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></div>
      </div>
      <div class="row">
        <button type="button" class="small" id="ghTestBtn">🔍 Test connection</button>
        <button type="button" class="small" id="ghSaveBtn">💾 Remember in this browser</button>
        <button type="button" class="small" id="ghForgetBtn">Forget token</button>
        <label class="chk" style="margin-left:auto;"><input type="checkbox" id="ghQuiet"> quiet mode — only write ticket files</label>
      </div>
      <div class="targets">
        <label class="opt"><input type="radio" name="target" value="files" checked><span><b>Ticket files</b> — one markdown file per ticket in the tickets folder, plus an index. Works with the token you already have (Contents read + write).</span></label>
        <label class="opt"><input type="radio" name="target" value="issues"><span><b>GitHub Issues</b> — one issue per ticket. Needs the token to also have <code>Issues: read and write</code>; if that fails it falls back to ticket files automatically.</span></label>
      </div>
      <p class="setting-help" id="ghHelp"></p>
    </div>
  </details>

  <main id="formRoot"></main>
</div>

<div class="bar">
  <div class="bar-inner">
    <div>
      <div id="statusEl" class="bar-status"></div>
      <details class="preview" id="previewDetails">
        <summary>Preview the text that will be copied / sent</summary>
        <pre id="previewEl"></pre>
      </details>
    </div>
    <div class="btns">
      <button id="recommendBtn" type="button">✨ Use the recommended answers</button>
      <button id="clearBtn" type="button">Clear answers</button>
      <button id="copyBtn" type="button">📋 Copy answers</button>
      <button id="sendBtn" type="button" class="primary">📤 Send answers</button>
    </div>
  </div>
  <div class="fallback" id="fallbackEl">
    <label class="note-label">Clipboard was blocked — select all of this and copy it manually (Ctrl/Cmd+C):</label>
    <textarea id="fallbackText" rows="7" readonly></textarea>
  </div>
</div>
<div class="toast" id="toastEl"></div>

<script>
"use strict";

const FORM_META = {
  id: "yacbpg-round2-2026-09-26",
  version: "2026-09-26",
  title: "Comic Book Page Generator — Round 2: the state layer (P2)",
  intro: "Round 1 settled what the refactor is for and where the data should live. This round settles what P2 has to know before it can be built. P2 gives every panel an id, writes core/schema.js and state/store.js, and makes the project own its own library and its kept images — all of it invisible, because the DOM keeps driving the app until P3. These are the questions I cannot answer from the code. BUG-01 is the leftover from your 2026-09-22 error-dialog report (it needs one line from your browser console). Every choice marked “recommended” is what I would pick if you just say “all defaults”; every question takes a note; answers are written to the repo’s tickets/ folder as markdown, exactly like round 1."
};

const GH_DEFAULTS = {
  owner: "cgoodwin97124",
  repo: "yacbpg-backup",
  branch: "main",
  folder: "tickets"
};

const TICKETS = [
  {
    id: "BUG-01",
    slug: "BUG-01-perchance-error-dialog-follow-up",
    kind: "bug",
    title: "The perchance “An error occurred” dialog (your report, 2026-09-22) — the last piece I need",
    request: "You sent a screenshot of a perchance error dialog whose only stack line was interactionPointerMoveHandler@…:34:3414. Recon (2026-09-22) says that frame is inside the platform's own page-bootstrap script — its bot-detection pointer handler — not our code, and that the dialog deliberately hides the real exception text, which is why the questions below ask for one line from your console. A platform bug report is already filed (id 923578bb). As far as I can tell nothing in the generator is broken; your console line is what would turn this into a platform follow-up with evidence, or into a real fix.",
    questions: [
      {
        id: "1a",
        text: "Does the generator actually misbehave when the dialog appears — does anything stop working — or is the dialog the only symptom? (The dialog itself says you can likely ignore it if the page works.)",
        type: "text"
      },
      {
        id: "1b",
        text: "Please open the browser console (Ctrl+Shift+J — Cmd+Option+J on Mac), move the mouse again, and paste the RED error line here: the exception type, its message and the full stack. That single line pins the cause.",
        type: "text"
      },
      {
        id: "1c",
        text: "How often does it appear, and where?",
        type: "select",
        options: [
          "Once — and I have not seen it since",
          "Every time I move the mouse after it first appears",
          "In the editor/preview only",
          "On the saved/public page too",
          "Not sure yet — I will watch for it and tell you"
        ]
      },
      {
        id: "1d",
        text: "Which browser and operating system, and does it still happen with extensions disabled / in a private window / in a second browser? (If it disappears there, it is an extension, and there is nothing for the generator to fix.)",
        type: "text"
      },
      {
        id: "1e",
        text: "Is there anything you want changed in the generator for this?",
        type: "select",
        options: [
          "Nothing — ignore it as long as the app works (recommended)",
          "Keep tracking it and tell me if the platform fixes it",
          "I want the generator to try to work around it"
        ]
      }
    ]
  },
  {
    id: "P2-01",
    slug: "P2-01-projects-become-first-class",
    kind: "plan",
    title: "Several projects, and how the app opens them",
    request: "P2 introduces state/store.js — the point at which the app can finally know which project it is holding, instead of the browser holding one working state plus a Recent list. None of this changes the app yet; it decides what P2 is aimed at.",
    questions: [
      {
        id: "1a",
        text: "You open a Recent entry (or import a file) while the current project has unsaved changes. What should happen?",
        type: "select",
        options: [
          "Save the current one to Recent first, then switch — no prompt (recommended)",
          "Ask first: Save & switch / Discard & switch / Cancel",
          "Switch, and keep the old one only if it had been backed up to GitHub",
          "Never switch without me explicitly saving the current project"
        ]
      },
      {
        id: "1b",
        text: "When you load the generator, what should it open?",
        type: "select",
        options: [
          "The project I had open last time (today's behaviour — recommended)",
          "A project picker: Recent list + New + Import",
          "The last project, and show the Recent list only if it fails to load"
        ]
      },
      {
        id: "1c",
        text: "What should a Recent entry remember, beyond the project data itself?",
        type: "checkboxes",
        options: [
          "Which page/panel was selected",
          "The active view (Grid / Storyboard / Focus / Analysis / JSON)",
          "Scroll position",
          "Whether the library panel was open",
          "Nothing extra — the project data only (recommended)"
        ]
      }
    ]
  },
  {
    id: "P2-02",
    slug: "P2-02-project-library-and-the-catalogue",
    kind: "technical",
    title: "The project's own library, and the browser catalogue",
    request: "Round 1 decided: the project owns its library, and the browser-wide library becomes a catalogue you copy from. core/library-core.js (the lib:<type>:<id> parsing, reference counting, extractLibraryItems) is the same work either way — these questions shape the screens and the import path around it.",
    questions: [
      {
        id: "2a",
        text: "In the library UI, how should the project's objects and the catalogue's objects appear together?",
        type: "select",
        options: [
          "One list, with catalogue entries badged “catalogue” (recommended)",
          "Two sections: “This project” then “My catalogue”",
          "One list, project objects sorted to the top",
          "A tab switch between the two"
        ]
      },
      {
        id: "2b",
        text: "You import someone else's project file. What should happen to your catalogue?",
        type: "select",
        options: [
          "Offer to copy the file's objects in — my choice each time (recommended)",
          "Always copy them in, merged by id, never overwriting mine",
          "Always replace the catalogue with the file's objects",
          "Never touch the catalogue — that file's objects stay in that project only"
        ]
      },
      {
        id: "2c",
        text: "You delete a library object that panels still reference. What should happen?",
        type: "select",
        options: [
          "Block the delete and show me which panels use it (recommended)",
          "Delete it and clear the references, with a warning",
          "Delete it and leave the references as plain text",
          "Tell me what it does today and I will decide"
        ]
      },
      {
        id: "2d",
        text: "Anything else about the library you want changed while the ownership moves to the project?",
        type: "text"
      }
    ]
  },
  {
    id: "P2-03",
    slug: "P2-03-kept-images-in-the-project-file",
    kind: "technical",
    title: "Kept images live in the project file — what that costs",
    request: "Round 1 decided the kept images travel inside the project file (and that big exports are fine). This ticket is about the trade-offs that decision creates: file size, whether the browser keeps its own copy, and what happens when someone else's file arrives with images in it.",
    questions: [
      {
        id: "3a",
        text: "Export: one file with everything in it, or a second, lighter option?",
        type: "select",
        options: [
          "One file with everything in it — simplest (recommended)",
          "Two buttons: full export, plus “compact (no kept images)”",
          "Full export, plus a separate export that is only the images"
        ]
      },
      {
        id: "3b",
        text: "Should the browser keep its own copy of a project's kept images, so the pictures are still there even if the file is lost?",
        type: "select",
        options: [
          "Yes — the browser keeps them too (safest; uses more storage) (recommended)",
          "No — the file is the only home for kept images",
          "Keep thumbnails only, not the originals"
        ]
      },
      {
        id: "3c",
        text: "A project with many kept images can get large. At roughly what export size would you want a warning (e.g. “this export is 40 MB”)?",
        type: "text"
      }
    ]
  },
  {
    id: "P2-04",
    slug: "P2-04-old-files-versions-and-the-upgrader",
    kind: "plan",
    title: "Old files, version stamps, and the upgrader",
    request: "Your R-04 answers: stamp exports with a format + app version, keep a migration ladder for recent shapes, and give an older file a clear “run it through the upgrader” message instead of a best-effort guess. These are the details I need to build that, and to decide how much the JSON editor should own once the store owns the state.",
    questions: [
      {
        id: "4a",
        text: "How far back should the automatic migration ladder reach?",
        type: "select",
        options: [
          "Only shapes from the v2 format onward (the last few weeks) — anything older goes to the upgrader (recommended)",
          "Everything back to the first format, if it can be done safely",
          "Only the immediately previous shape; everything else goes to the upgrader"
        ]
      },
      {
        id: "4b",
        text: "The upgrader page — it opens an old file, converts it in memory (nothing is uploaded), and hands you the result:",
        type: "select",
        options: [
          "Convert it and give me the new file to download (recommended)",
          "Convert it and import it straight into the app",
          "Convert it, show me what changed, then let me download"
        ]
      },
      {
        id: "4c",
        text: "The JSON editor, once the store owns the state:",
        type: "select",
        options: [
          "Keep it as it is — edit raw JSON, normalise + validate on apply (recommended)",
          "Make it read-only (a view, not an editor)",
          "Keep it, and add a “validate only” mode"
        ]
      }
    ]
  },
  {
    id: "P2-05",
    slug: "P2-05-saving-undo-and-the-github-backup",
    kind: "plan",
    title: "When it saves, what it remembers, and where the backup goes",
    request: "The state layer is the prerequisite for autosave and for a real undo stack. Round 1 said feature releases keep shipping while a phase is in flight, so these are things I can do one at a time — this ticket is about which ones you actually want.",
    questions: [
      {
        id: "5a",
        text: "Should the working project save itself to the browser as you work?",
        type: "select",
        options: [
          "Yes — debounced (a second or two after you stop typing), alongside the explicit Save (recommended)",
          "No — keep saving explicit",
          "Yes, but only the panel data, never the images"
        ]
      },
      {
        id: "5b",
        text: "A real undo/redo stack (P3 is when it becomes possible): how deep, and how long does it live?",
        type: "select",
        options: [
          "The last 50 changes, and it survives a reload (recommended)",
          "The last 20 changes, cleared on reload",
          "Unlimited for the session, cleared on reload",
          "No undo stack — the current behaviour is enough"
        ]
      },
      {
        id: "5c",
        text: "Once projects are first-class, where should “back up to GitHub” point?",
        type: "select",
        options: [
          "One file per project in a projects/ folder — I pick which project to back up (recommended)",
          "Keep today's single whole-blob backup",
          "Both: today's backup, plus an optional per-project file"
        ]
      },
      {
        id: "5d",
        text: "Which of these would you like as its own small release while P2 is in flight? (Pick any.)",
        type: "checkboxes",
        options: [
          "The range generator chip you mentioned — “Generate (x) to (y)”",
          "The panel menu showing Basic Description (the 4a answer)",
          "The recent-list count preference (T-05), if it is not already done",
          "Nothing for now — just the refactor"
        ]
      }
    ]
  },
  {
    id: "P2-06",
    slug: "P2-06-cadence-and-verification",
    kind: "process",
    title: "How P2's steps should be released and verified",
    request: "P2 is meant to be invisible: the DOM keeps driving the app on input until P3, so the only evidence you get is the release notes. This ticket fixes the cadence and what those notes should contain.",
    questions: [
      {
        id: "6a",
        text: "Release cadence for P2's steps (panel ids, core/schema.js, state/store.js, the differential test, the save path):",
        type: "select",
        options: [
          "One release per step, so I can watch each piece land (recommended)",
          "One release for the whole of P2",
          "Whatever order is convenient — release when I ask"
        ]
      },
      {
        id: "6b",
        text: "What should each release note show?",
        type: "select",
        options: [
          "Both: a plain-language summary first, then the suite/differential/park-hash numbers (recommended)",
          "Just the plain-language summary",
          "Just the numbers, like the P1 releases"
        ]
      },
      {
        id: "6c",
        text: "Anything you are nervous about in a state layer — a behaviour you rely on, or a way you use the app that I should be careful not to disturb?",
        type: "text"
      }
    ]

  document.getElementById("ghTestBtn").addEventListener("click", async function () {

  function headers(c) {
    const h = { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    if (c.token) h.Authorization = "Bearer " + c.token;
    return h;
  }
  function apiUrl(c, path) {
    let u = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/contents/";
    u += String(path || "").split("/").map(encodeURIComponent).join("/");
    if (c.branch) u += "?ref=" + encodeURIComponent(c.branch);
    return u;
  }
  function b64(str) {
    const bytes = new TextEncoder().encode(str);

    const chunk = 0x8000;

    }
    return btoa(bin);
  }
  async function ghGetFile(c, path) {
    const r = await fetch(apiUrl(c, path) + "&cb=" + Date.now(), { headers: headers(c), cache: "no-store" });

    if (!r.ok) throw new Error("GET " + path + " → HTTP " + r.status);
    const j = await r.json();
    return { sha: j.sha, text: j.content ? new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, "")), function (ch) { return ch.charCodeAt(0); })) : "" };
  }
  async function ghPutFile(c, path, content, message) {
    let existing = null;
    try { existing = await ghGetFile(c, path); } catch (e) { existing = null; }
    const body = { message: message, content: b64(content) };
    if (c.branch) body.branch = c.branch;
    if (existing && existing.sha) body.sha = existing.sha;
    let r = await fetch(apiUrl(c, path), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, headers(c)), body: JSON.stringify(body) });
    if (r.status === 409) {
      const again = await ghGetFile(c, path);
      if (again && again.sha) { body.sha = again.sha; r = await fetch(apiUrl(c, path), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, headers(c)), body: JSON.stringify(body) }); }
    }

      let t = "";
      try { t = (await r.json()).message || ""; } catch (e) {}

  function blobUrl(c, path) {

  }
  async function ghSearchIssues(c, marker) {

  function esc(s) { return String(s == null ? "" : s); }

  let lastGroup = null;

  function buildQuestion(q) {
    const sec = document.createElement("section");
    sec.className = "q";
    sec.id = "q-" + q.id;

    const head = document.createElement("div");
    head.className = "q-head";

    idBadge.textContent = q.id;
    const txt = document.createElement("div");
    txt.className = "q-text";
    txt.textContent = q.text;
    head.appendChild(idBadge);
    head.appendChild(txt);
    sec.appendChild(head);

    const control = document.createElement("div");
    control.className = "q-control";

    if (q.type === "select") {
      const sel = document.createElement("select");
      sel.id = "ctl-" + q.id;
      const blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "— choose an answer —";
      sel.appendChild(blank);
      (q.options || []).forEach(function (opt, i) {
        const o = document.createElement("option");
        o.value = String(i);
        o.textContent = opt;
        sel.appendChild(o);
      });
      sel.addEventListener("change", persist);
      control.appendChild(sel);
    } else if (q.type === "checkboxes") {
      const box = document.createElement("div");
      box.className = "opts";
      box.id = "ctl-" + q.id;
      (q.options || []).forEach(function (opt, i) {
        const lab = document.createElement("label");
        lab.className = "opt";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = String(i);
        cb.id = "ctl-" + q.id + "-" + i;
        cb.addEventListener("change", persist);
        const span = document.createElement("span");
        span.textContent = opt;
        lab.appendChild(cb);
        lab.appendChild(span);
        box.appendChild(lab);
      });
      control.appendChild(box);
    } else {
      const ta = document.createElement("textarea");
      ta.id = "ctl-" + q.id;
      ta.rows = q.rows || 4;
      ta.placeholder = q.placeholder || "";
      ta.addEventListener("input", persist);
      control.appendChild(ta);
    }
    sec.appendChild(control);

    if (q.notes !== false) {
      const nl = document.createElement("label");
      nl.className = "note-label";
      nl.setAttribute("for", "note-" + q.id);
      nl.textContent = q.notesLabel || "Notes (optional):";

  function applyDraft(q) {
    const s = draft[q.id];
    if (!s) return;
    if (q.type === "select") {
      const sel = document.getElementById("ctl-" + q.id);
      if (sel && s.choice != null && s.choice !== "") sel.value = String(s.choice);
    } else if (q.type === "checkboxes") {

    } else {
      const el = document.getElementById("ctl-" + q.id);

    }
    if (q.notes !== false) {
      const nt = document.getElementById("note-" + q.id);
      if (nt && s.note) nt.value = s.note;

  function readAnswer(q) {
    const out = { choice: "", checked: [], text: "", note: "" };
    if (q.type === "select") {
      const sel = document.getElementById("ctl-" + q.id);
      out.choice = sel ? sel.value : "";
    } else if (q.type === "checkboxes") {
      (q.options || []).forEach(function (opt, i) {
        const cb = document.getElementById("ctl-" + q.id + "-" + i);
        if (cb && cb.checked) out.checked.push(i);
      });
    } else {
      const el = document.getElementById("ctl-" + q.id);
      out.text = el ? el.value : "";
    }
    if (q.notes !== false) {
      const nt = document.getElementById("note-" + q.id);
      out.note = nt ? nt.value : "";
    }
    return out;
  }

  function answerText(q) {
    const a = readAnswer(q);
    if (q.type === "select") return (a.choice === "" || q.options[a.choice] == null) ? "" : q.options[a.choice];
    if (q.type === "checkboxes") return a.checked.length ? a.checked.map(function (i) { return q.options[i]; }).join("; ") : "";
    return esc(a.text).trim();
  }
  function noteText(q) { return q.notes === false ? "" : esc(readAnswer(q).note).trim(); }
  function isAnswered(q) { return answerText(q) !== "" || noteText(q) !== ""; }

  let persistTimer = null;
  function persist() {
    const data = {};

  function buildPayload() {
    const now = new Date();

  function ticketMarkdown(t, p) {
    const L = [];
    const now = new Date().toISOString();

    L.push("## Original request (verbatim)");
    L.push("");

  function indexRowsFor(tickets) {
    return tickets.map(function (t) {

    out.push("");
    return out.join("\n");
  }

  function buildText() {
    const p = buildPayload();

    lines.push("=== " + FORM_META.title.toUpperCase() + " ===");

  async function sendViaFiles(c, p) {
    const written = [];
    for (let i = 0; i < p.tickets.length; i++) {
      const t = p.tickets[i];
      if (t.answered === 0) continue;
      showToast("⏳ Writing " + t.id + " (" + (i + 1) + " of " + p.tickets.length + ")…", 60000);
      const path = c.folder + "/" + t.slug + ".md";
      const message = t.id + " — " + t.status + " — " + t.title;
      const res = await ghPutFile(c, path, ticketMarkdown(t, p), message);
      written.push({ ticket: t, path: path, url: res.url });
    }
    if (written.length) {
      const quiet = document.getElementById("ghQuiet").checked;
      if (!quiet) {
        const idxPath = c.folder + "/README.md";
        showToast("⏳ Updating the ticket index…", 60000);
        let existing = "";
        try { const f = await ghGetFile(c, idxPath); existing = f ? f.text : ""; } catch (e) { existing = ""; }
        await ghPutFile(c, idxPath, mergeIndex(existing, indexRowsFor(written.map(function (w) { return w.ticket; }))), "tickets: update index");
      }
    }
    return written;
  }

  async function createIssue(c, t, p) {
    const marker = "<!-- " + FORM_META.id + ":" + t.id + " -->";
    const body = marker + "\n\n" + ticketMarkdown(t, p).split("\n").slice(6).join("\n");
    const existing = await ghSearchIssues(c, marker);
    if (existing) {
      const r = await fetch("https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/issues/" + existing.number, {
        method: "PATCH", headers: Object.assign({ "Content-Type": "application/json" }, headers(c)), body: JSON.stringify({ title: t.id + " — " + t.title, body: body })
      });
      if (!r.ok) throw new Error("PATCH issue " + existing.number + " → HTTP " + r.status);
      return { url: existing.html_url };
    }
    const r = await fetch("https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/issues", {
      method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, headers(c)), body: JSON.stringify({ title: t.id + " — " + t.title, body: body, labels: [t.kind] })
    });
    if (!r.ok) {
      let t2 = "";
      try { t2 = (await r.json()).message || ""; } catch (e) {}
      throw new Error("POST issue → HTTP " + r.status + (t2 ? " (" + t2 + ")" : ""));
    }
    const j = await r.json();
    return { url: j.html_url };
  }

  async function sendViaIssues(c, p) {
    const written = [];
    for (let i = 0; i < p.tickets.length; i++) {
      const t = p.tickets[i];
      if (t.answered === 0) continue;
      showToast("⏳ Creating issue " + t.id + " (" + (i + 1) + " of " + p.tickets.length + ")…", 60000);
      const res = await createIssue(c, t, p);
      written.push({ ticket: t, path: "issue", url: res.url });
    }
    return written;
  }

  sendBtn.addEventListener("click", async function () {
    const p = buildPayload();
    const answeredTickets = p.tickets.filter(function (t) { return t.answered > 0; });
    if (!answeredTickets.length) { showToast("Answer at least one question first.", 3000); return; }
    const c = currentGh();
    const text = buildText();
    safeSet(LASTSENT_KEY, JSON.stringify(p));
    if (!c.owner || !c.repo || !c.token) {
      const ok = await copyText(text);
      showResults("<b>No GitHub connection yet.</b> Your answers are saved as a draft in this browser" + (ok ? " and copied to the clipboard" : "") + ".<div class=\"res-line\">Open the <b>GitHub tickets</b> panel above, fill in owner / repo / token, then press Send again — or just paste the copied text into the chat.</div>");
      if (!ok) { fallbackText.value = text; fallbackEl.classList.add("show"); }
      showToast("Not connected to GitHub — answers kept locally.", 4000);
      return;
    }
    const target = currentTarget();
    sendBtn.disabled = true;
    copyBtn.disabled = true;
    let written = [];
    let err = null;
    let fellBack = false;
    try {
      written = target === "issues" ? await sendViaIssues(c, p) : await sendViaFiles(c, p);
    } catch (e) {
      err = String(e);
      if (target === "issues") {
        fellBack = true;
        try { written = await sendViaFiles(c, p); err = null; } catch (e2) { err = String(e2); }
      }
    }
    sendBtn.disabled = false;
    copyBtn.disabled = false;
    if (err) {
      const ok = await copyText(text);
      showResults("<b>⚠️ GitHub write failed.</b><div class=\"res-err\">" + esc(err).replace(/</g, "&lt;") + "</div><div class=\"res-line\">Your answers are saved as a draft in this browser" + (ok ? " and copied to the clipboard" : "") + " — fix the token above and press Send again, or paste the copied text into the chat.</div>");
      if (!ok) { fallbackText.value = text; fallbackEl.classList.add("show"); }
      showToast("GitHub write failed.", 4000);
      return;
    }
    const folderUrl = "https://github.com/" + c.owner + "/" + c.repo + "/tree/" + encodeURIComponent(c.branch) + "/" + c.folder.split("/").map(encodeURIComponent).join("/");
    let html = "<b>✅ Sent " + written.length + " ticket" + (written.length === 1 ? "" : "s") + ".</b>";
    if (fellBack) html += " <span class=\"pill warn\">Issues refused (token needs Issues: read+write) — wrote ticket files instead</span>";
    html += "<div style=\"margin-top:8px\">";
    written.forEach(function (w) {
      html += "<div class=\"res-line\"><span class=\"pill ok\">" + w.ticket.id + "</span><span>" + esc(w.ticket.title) + "</span><a href=\"" + w.url + "\" target=\"_blank\" rel=\"noopener\">" + w.url + "</a></div>";
    });
    html += "</div><div class=\"res-line\"><a href=\"" + folderUrl + "\" target=\"_blank\" rel=\"noopener\">" + (target === "issues" && !fellBack ? "All issues" : "All tickets in the repo") + " →</a></div>";
    html += "<div class=\"res-line\">Now just tell the AI “sent”.</div>";
    if (written.length < answeredTickets.length) html += "<div class=\"res-line\">(" + (answeredTickets.length - written.length) + " answered ticket(s) were skipped.)</div>";
    showResults(html);
    showToast("✅ " + written.length + " ticket" + (written.length === 1 ? "" : "s") + " sent to GitHub.", 4000);
  });

  document.getElementById("recommendBtn").addEventListener("click", function () {
    let n = 0;
    ALL_QUESTIONS.forEach(function (q) {
      if (q.type === "select") {
        const sel = document.getElementById("ctl-" + q.id);
        if (!sel || sel.value !== "") return;
        const idx = (q.options || []).findIndex(function (o) { return /recommended/i.test(o); });
        if (idx < 0) return;
        sel.value = String(idx);
        n++;
      } else if (q.type === "checkboxes") {
        (q.options || []).forEach(function (opt, i) {
          if (!/recommended/i.test(opt)) return;
          const cb = document.getElementById("ctl-" + q.id + "-" + i);
          if (cb && !cb.checked) { cb.checked = true; n++; }
        });
      }
    });
    persist();
    showToast(n ? "Filled in the recommended answer for " + n + (n === 1 ? " question" : " questions") + " — change any of them you like, then Send." : "Nothing left to fill in: every question that has a recommended answer already has one.");
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    if (!window.confirm("Clear every answer and note on this form?")) return;
    ALL_QUESTIONS.forEach(function (q) {
      if (q.type === "select") {
        const sel = document.getElementById("ctl-" + q.id);
        if (sel) sel.value = "";
      } else if (q.type === "checkboxes") {
        (q.options || []).forEach(function (opt, i) {
          const cb = document.getElementById("ctl-" + q.id + "-" + i);
          if (cb) cb.checked = false;
        });
      } else {
        const el = document.getElementById("ctl-" + q.id);
        if (el) el.value = "";
      }
      if (q.notes !== false) {
        const nt = document.getElementById("note-" + q.id);
        if (nt) nt.value = "";
      }
    });
    persist();
    showToast("Cleared.");
  });

  const previewDetails = document.getElementById("previewDetails");
  previewDetails.addEventListener("toggle", function () {
    previewEl.setAttribute("data-open", previewDetails.open ? "1" : "0");
    if (previewDetails.open) previewEl.textContent = buildText();
  });

  updateStatus();
  document.getElementById("pageState").textContent = Object.keys(draft).length ? "draft restored" : "";
})();
</script>
