<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refactor &amp; UI Planning — Comic Book Page Generator</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #1c2024;
    --muted: #626b76;
    --line: #dfe3e8;
    --accent: #2f6fed;
    --accent-soft: #e8f0ff;
    --ok: #17864a;
    --ok-soft: #e3f6ec;
    --warn: #b7791f;
    --warn-soft: #fdf3dd;
    --bad: #c0392b;
    --bad-soft: #fdecea;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #1f2228;
      --ink: #e9ecf1;
      --muted: #9aa4b1;
      --line: #333a43;
      --accent: #6f9dff;
      --accent-soft: #1d2b45;
      --ok: #4ec27f;
      --ok-soft: #17301f;
      --warn: #e0b24d;
      --warn-soft: #33290f;
      --bad: #ff8a75;
      --bad-soft: #3a1c18;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px 14px 140px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  header.page h1 { margin: 0 0 6px; font-size: 1.32rem; line-height: 1.25; }
  header.page p { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; font-size: 0.82rem; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  h2.group {
    font-size: 1.02rem; margin: 26px 0 6px; padding-bottom: 6px;
    border-bottom: 2px solid var(--accent); display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
  }
  .group-sub { color: var(--muted); font-size: 0.82rem; font-weight: 400; margin: 0 0 12px; }
  section.q {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  }
  section.q.answered { border-left-color: var(--ok); }
  .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
  .q-id { flex: 0 0 auto; font-weight: 700; font-size: 0.78rem; background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 6px; margin-top: 2px; }
  .q-text { font-weight: 600; }
  select, textarea, input[type=text], input[type=password], input[type=number] {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  }
  select { min-height: 42px; }
  textarea { resize: vertical; min-height: 62px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  label.opt { display: flex; gap: 9px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; font-size: 0.94rem; }
  label.opt:hover { border-color: var(--accent); }
  label.opt input { margin: 2px 0 0; flex: 0 0 auto; width: 17px; height: 17px; }
  .note-label { display: block; margin: 10px 0 4px; font-size: 0.8rem; color: var(--muted); }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 0.86rem; color: var(--muted); cursor: pointer; }
  label.chk input { width: 16px; height: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 10px; }
  .field { flex: 1 1 180px; min-width: 140px; }
  .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  .targets { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .setting-help { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .setting-help code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 0.9em; }
  details.gh { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); margin-bottom: 16px; }
  details.gh > summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  details.gh > summary::-webkit-details-marker { display: none; }
  details.gh > summary::before { content: "▸"; color: var(--muted); }
  details.gh[open] > summary::before { content: "▾"; }
  details.gh .gh-body { padding: 0 18px 18px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 14px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 10px 16px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.small { padding: 7px 12px; font-size: 0.86rem; }
  button:disabled { opacity: 0.55; cursor: default; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding: 12px 14px; box-shadow: 0 -6px 20px rgba(0,0,0,0.08); }
  .bar-inner { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .bar-status { font-size: 0.85rem; color: var(--muted); }
  .bar-status.done { color: var(--ok); font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--bg); font-weight: 600; font-size: 0.88rem; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 30; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .fallback { margin-top: 10px; display: none; }
  .fallback.show { display: block; }
  #resultsEl { display: none; }
  #resultsEl.show { display: block; }
  .res-line { display: flex; gap: 8px; align-items: baseline; margin: 6px 0; font-size: 0.9rem; flex-wrap: wrap; }
  .res-line a { color: var(--accent); word-break: break-all; }
  .res-err { color: var(--bad); font-size: 0.84rem; }
  .steps { margin: 8px 0 0 18px; padding: 0; font-size: 0.86rem; color: var(--muted); }
  .steps li { margin: 4px 0; }
  details.preview { margin-top: 8px; }
  details.preview summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); }
  details.preview pre { white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0 0; max-height: 320px; overflow: auto; }
  @media (max-width: 560px) {
    body { padding: 14px 10px 170px; }
    .card, details.gh > summary { padding-left: 14px; padding-right: 14px; }
    .q-head { flex-direction: column; gap: 6px; }
    .q-text { font-size: 0.97rem; }
    .btns { width: 100%; }
    .btns button.primary { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page card">
    <h1 id="pageTitle"></h1>
    <p id="pageIntro"></p>
    <div class="meta-row">
      <span id="pageVersion" class="pill"></span>
      <span id="pageTickets"></span>
      <span id="pageState"></span>
    </div>
  </header>

  <div id="resultsEl" class="card"></div>

  <details class="gh" id="ghCard">
    <summary>
      <span>GitHub tickets</span>
      <span id="ghBadge" class="pill warn">not connected</span>
      <span id="ghWhere" class="pill">—</span>
    </summary>
    <div class="gh-body">
      <div class="row">
        <div class="field"><label for="ghOwner">Owner</label><input type="text" id="ghOwner" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="ghRepo">Repository</label><input type="text" id="ghRepo" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="ghBranch">Branch</label><input type="text" id="ghBranch" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="ghFolder">Tickets folder</label><input type="text" id="ghFolder" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1 1 320px;"><label for="ghToken">GitHub token (fine-grained PAT, Contents: read + write)</label><input type="password" id="ghToken" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></div>
      </div>
      <div class="row">
        <button type="button" class="small" id="ghTestBtn">🔍 Test connection</button>
        <button type="button" class="small" id="ghSaveBtn">💾 Remember in this browser</button>
        <button type="button" class="small" id="ghForgetBtn">Forget token</button>
        <label class="chk" style="margin-left:auto;"><input type="checkbox" id="ghQuiet"> quiet mode — only write ticket files</label>
      </div>
      <div class="targets">
        <label class="opt"><input type="radio" name="target" value="files" checked><span><b>Ticket files</b> — one markdown file per ticket in the tickets folder, plus an index. Works with the token you already have (Contents read + write).</span></label>
        <label class="opt"><input type="radio" name="target" value="issues"><span><b>GitHub Issues</b> — one issue per ticket. Needs the token to also have <code>Issues: read and write</code>; if that fails it falls back to ticket files automatically.</span></label>
      </div>
      <p class="setting-help" id="ghHelp"></p>
    </div>
  </details>

  <main id="formRoot"></main>
</div>

<div class="bar">
  <div class="bar-inner">
    <div>
      <div id="statusEl" class="bar-status"></div>
      <details class="preview" id="previewDetails">
        <summary>Preview the text that will be copied / sent</summary>
        <pre id="previewEl"></pre>
      </details>
    </div>
    <div class="btns">
      <button id="recommendBtn" type="button">✨ Use the recommended answers</button>
      <button id="clearBtn" type="button">Clear answers</button>
      <button id="copyBtn" type="button">📋 Copy answers</button>
      <button id="sendBtn" type="button" class="primary">📤 Send answers</button>
    </div>
  </div>
  <div class="fallback" id="fallbackEl">
    <label class="note-label">Clipboard was blocked — select all of this and copy it manually (Ctrl/Cmd+C):</label>
    <textarea id="fallbackText" rows="7" readonly></textarea>
  </div>
</div>
<div class="toast" id="toastEl"></div>

<script>
"use strict";

const FORM_META = {
  id: "yacbpg-refactor-2026-09-26",
  version: "2026-09-26",
  title: "Comic Book Page Generator — Refactor & UI Planning",
  intro: "This is the planning round for the refactor described in FUNCTION-MAP.md, REFACTOR-ROADMAP.md and UI-IDEAS.md (all three are in the repo). Nothing here changes the app; these are decisions I need before touching the code. Every choice marked “recommended” is the default I would pick if you just say “all defaults”. Answer whatever you like, add notes anywhere, then press “Send answers” — each ticket is written to GitHub as a markdown file and the links come back here."
};

const GH_DEFAULTS = {
  owner: "cgoodwin97124",
  repo: "yacbpg-backup",
  branch: "main",
  folder: "tickets"
};

const TICKETS = [
  {
    id: "R-01",
    slug: "R-01-how-far-should-the-refactor-go",
    kind: "plan",
    title: "How far should the refactor go, and can features keep shipping meanwhile?",
    request: "I'd like a road map for eventually refactoring the code — a document covering the functions and functionality of the app, independently of the user interface, plus a second one with UI ideas once the functionality is fully mapped out. (Your request, 2026-09-26. The two documents — FUNCTION-MAP.md and REFACTOR-ROADMAP.md — are written and in the repo; this ticket decides how much of the roadmap we actually execute.)",
    questions: [
      {
        id: "1a",
        text: "The roadmap is six phases (P0 safety net → P1 pure logic → P2 state layer → P3 commands → P4 services → P5 UI extraction → P6 redesign). How far should we go? (You can change your mind later — this just sets the first target.)",
        type: "select",
        options: [
          "P0 + P1 — safety net and the pure-logic modules; zero user-visible change (recommended first target)",
          "Docs only for now — read them, think about it, decide later",
          "Through P2 + P3 — the real state layer and commands (the structural change that kills the biggest bug class)",
          "Through P5 — the whole extraction, ending with no inline handlers and no window exports",
          "All the way, P6 included — the interface redesign too"
        ]
      },
      {
        id: "1b",
        text: "While a refactor phase is in flight, should new feature requests pause?",
        type: "select",
        options: [
          "No — features keep shipping and the refactor works around them (recommended)",
          "Only during P3 (the risky phase) — pause features there",
          "Yes — freeze features until the current phase is finished"
        ]
      },
      {
        id: "1c",
        text: "Long-term, what is this app to you? (Is it one generator you keep polishing, a template you might fork for other kinds of generators, or something you would like other people to be able to take and use?)",
        type: "text"
      }
    ]
  },
  {
    id: "R-02",
    slug: "R-02-risk-and-verification",
    kind: "process",
    title: "Risk appetite, fallbacks, and how each refactor release gets verified",
    request: "This ticket is about the safety rules for the refactor itself.",
    questions: [
      {
        id: "2a",
        text: "How much risk is acceptable in a single release while refactoring?",
        type: "select",
        options: [
          "None — the app must behave identically after every single release (recommended)",
          "Small risk is fine if the old path stays behind a flag",
          "I accept an occasional broken release; put it right in the next one"
        ]
      },
      {
        id: "2b",
        text: "The plan avoids cliff edges by extracting logic into a module but leaving the current implementation in place as a fallback, deleting the fallback one release later once the module has survived. Agreed?",
        type: "select",
        options: [
          "Yes — extract with a fallback, delete the fallback one release later (recommended)",
          "No — move each piece in one go and accept the risk",
          "Only for the risky pieces"
        ]
      },
      {
        id: "2c",
        text: "After each refactor release, how should I prove it still works? (Tick everything you want.)",
        type: "checkboxes",
        options: [
          "Run an automated smoke suite of the app's main behaviours and report the results (recommended)",
          "Compare screenshots of the main screens — both themes, phone and desktop (recommended)",
          "You click through it yourself and tell me what looks wrong",
          "Ask you before each Save, so you can look first",
          "Nothing extra — just tell me what changed and I will test it myself"
        ]
      },
      {
        id: "2d",
        text: "Has anything ever broken in a way you never want to see again? (Anything I should treat as sacred.)",
        type: "text"
      }
    ]
  },
  {
    id: "R-03",
    slug: "R-03-where-the-code-lives",
    kind: "technical",
    title: "Splitting the app into modules under src/ — is that acceptable?",
    request: "This ticket is about the only real platform decision in the whole plan: whether the app may be split into ES modules under src/, or must stay in one index.html.",
    questions: [
      {
        id: "3a",
        text: "The natural target is index.html as a thin shell plus ES-module files under src/ (core logic, state, services, views). The catch: unsaved src/ files are previewed through a service worker, and your saved generator only serves them after you press Save. Is that trade worth a far more maintainable app?",
        type: "select",
        options: [
          "Yes — split it into src/ modules (recommended)",
          "Yes, but only if the app can never break when a module fails to load (the fallback pattern in R-02)",
          "No — keep everything in index.html, refactor in place only",
          "I am not sure — recommend the safest option and I will follow it"
        ]
      },
      {
        id: "3b",
        text: "src/ currently holds the manual (manual.html) and the ticket form (question-form.html). May it also hold the app's modules? (Docs like README.md / PENDING.md must never go in src/ — that wedges the platform's save flow.)",
        type: "select",
        options: [
          "Yes — src/ is for anything the app ships or loads, code included (recommended)",
          "Only the manual and forms stay there; the code stays in index.html",
          "I would rather you decide — you know the platform limits best"
        ]
      },
      {
        id: "3c",
        text: "Should the build stay buildless?",
        type: "select",
        options: [
          "No build step — plain ES modules the browser loads directly (recommended)",
          "Use a bundler (esbuild-wasm) so the app is one file again, even if it complicates releases",
          "Decide for me once you have measured the load time"
        ]
      },
      {
        id: "3d",
        text: "Any environment I should assume? (Phone vs desktop, in-app browsers, offline use, slow connections, a device you care about most.)",
        type: "text"
      }
    ]
  },
  {
    id: "R-04",
    slug: "R-04-data-compatibility",
    kind: "data",
    title: "Old projects, the migration ladder, and where the library lives",
    request: "The refactor touches how state is stored, so I need to know how forgiving it has to be.",
    questions: [
      {
        id: "4a",
        text: "How important is it that every old backup still loads? (The app carries a migration ladder for five historical shapes; keeping it costs work in the refactor.)",
        type: "select",
        options: [
          "Essential — every backup I have ever exported must keep working (recommended)",
          "Only recent releases need to work; older files can be re-made",
          "It is a hobby project — if the structure changes, I will redo my projects"
        ]
      },
      {
        id: "4b",
        text: "Do you actually still have older backup .json / .zip files lying around that you might load again?",
        type: "select",
        options: [
          "Yes — several, and I would load them (the migration ladder stays)",
          "Maybe one or two, not sure which",
          "No — I only keep the current project"
        ]
      },
      {
        id: "4c",
        text: "Right now the library (characters / locations / action prompts) is shared by every project in the browser, and a project export carries a copy of it. After the refactor, where should it live?",
        type: "select",
        options: [
          "Keep it shared in the browser, as now (recommended — least change)",
          "Move it into the project file so a project is completely self-contained",
          "Both — a browser-level library plus an optional per-project set",
          "I am not sure — talk me through the trade-off first"
        ]
      },
      {
        id: "4d",
        text: "Invisible-but-important: panels currently have no identity (their position IS their identity), which is why moving, duplicating and reflowing needs so much careful code. Giving each panel a real id changes nothing you can see, but fixes a whole class of bugs and makes undo possible. Any objection?",
        type: "select",
        options: [
          "Do it — invisible is fine if it makes the app sturdier (recommended)",
          "Explain the change to me before you do it",
          "No — keep the current model"
        ]
      }
    ]
  },
  {
    id: "R-05",
    slug: "R-05-pages-panels-and-image-history",
    kind: "direction",
    title: "Pages, the 24-panel rule, and whether images should keep a history",
    request: "These are behaviour questions the roadmap has to answer before P3/P4, because they decide how panels and images are modelled.",
    questions: [
      {
        id: "5a",
        text: "Today a page holds at most 24 panels and anything beyond that overflows onto the following page automatically. Keep that, or should a page simply grow and scroll?",
        type: "select",
        options: [
          "Keep the automatic overflow onto the next page (recommended — it is what makes a comic page a page)",
          "Let a page grow: drop the 24 cap and scroll (no more overflow, no more pages needed)",
          "Raise the cap (say 48) but keep the overflow behaviour"
        ]
      },
      {
        id: "5b",
        text: "How much do you actually use multiple pages?",
        type: "select",
        options: [
          "Often — multi-page projects are normal for me",
          "Sometimes — a story needs a second page now and then",
          "Rarely / never — I work one page at a time",
          "I use pages, but only as a way to get past the 24-panel limit"
        ]
      },
      {
        id: "5c",
        text: "Should each image slot be able to keep a small history of what was rendered there (the last few renders, each with its seed, so you can go back to an earlier variant), or is only the current image ever needed? (History costs memory — a few hundred KB per kept image.)",
        type: "select",
        options: [
          "Keep a small history — the last 3 renders per slot (recommended)",
          "Keep a full history until I clear it (more memory, more control)",
          "Current image only — history lives in the Generated Prompt list, as now",
          "Not sure — decide based on what it does to performance"
        ]
      },
      {
        id: "5d",
        text: "Which page-related conveniences would you want, if pages became first-class? (Tick anything interesting.)",
        type: "checkboxes",
        options: [
          "A page filmstrip with thumbnails, so I can see and click pages instead of using a dropdown",
          "Drag pages to reorder them",
          "Copy / duplicate an entire page",
          "Save a page as a template and reuse its layout",
          "A different art style or palette for one page while the rest of the project stays on the global style",
          "None of these — pages are fine as they are"
        ]
      }
    ]
  },
  {
    id: "R-06",
    slug: "R-06-interface-shape",
    kind: "ui",
    title: "The shape of the interface: one inspector, modes, and expert controls",
    request: "The UI document (UI-IDEAS.md) proposes a different shape for the app. This ticket asks which parts of that shape you actually want before any of it is designed in detail.",
    questions: [
      {
        id: "6a",
        text: "The biggest proposal: the page becomes a canvas of compact panel cards (number, title, thumbnail, status) and all editing happens in ONE inspector for the selected panel — instead of every panel carrying ~60 controls of its own. Acceptable?",
        type: "select",
        options: [
          "Yes — one inspector for the selected panel (recommended)",
          "Yes, but keep an 'expand all panels' mode exactly like today, so I can work the old way when I want",
          "No — I like editing every panel in place",
          "Not sure — show me a mock-up of one panel done both ways first"
        ]
      },
      {
        id: "6b",
        text: "Should the app have explicit modes — Compose (describe panels), Render (queue, progress, re-roll), Review (read the comic, compare, export) — instead of one screen that does all three at once?",
        type: "select",
        options: [
          "Yes — three modes over the same project (recommended)",
          "No — one screen, but tidy it up",
          "Only Compose and Review; keep rendering inline",
          "Not sure — mock it up first"
        ]
      },
      {
        id: "6c",
        text: "Should expert controls (prompt obedience/guidance, custom image sizes, seed boxes, the per-panel prompt override, per-panel style and size overrides, panel titles) be hidden behind an 'Advanced' switch by default? (Anything you have actually set stays visible, so nothing becomes invisible-but-active.)",
        type: "select",
        options: [
          "Yes — hide the expert controls until I switch Advanced on (recommended)",
          "Hide some of them — I will list which in the notes",
          "No — I want everything visible all the time"
        ]
      },
      {
        id: "6d",
        text: "Where do you actually use it?",
        type: "select",

    const out = [];
    out.push("# Tickets");
    out.push("");
    out.push("Change requests for this project. One markdown file per ticket, each with a YAML header (`status`, `kind`, `answers`) so the state is machine-readable. Anyone (including the AI) can flip a ticket's `status` by editing its file.");
    out.push("");
    out.push("| Ticket | Title | Kind | Status | Answers | Updated |");
    out.push("| --- | --- | --- | --- | --- | --- |");
    ids.forEach(function (id) { const r = map.get(id); out.push("| [" + r.id + "](" + r.link + ") | " + r.rest); });
    out.push("");
    return out.join("\n");
  }

  function buildText() {
    const p = buildPayload();
    const lines = [];
    lines.push("=== " + FORM_META.title.toUpperCase() + " ===");
    lines.push("Form: " + p.form.id + "  (v" + p.form.version + ")  ·  " + new Date().toLocaleString());
    lines.push("");
    let unanswered = [];
    p.tickets.forEach(function (t) {
      lines.push("---------- " + t.id + " — " + t.title + " [" + t.status + "] ----------");
      t.questions.forEach(function (q) {
        lines.push("[" + q.id + "] " + q.text);
        lines.push("  ANSWER: " + (q.answer || "(no answer given)"));
        if (q.note) lines.push("  NOTE: " + q.note.replace(/\n/g, "\n        "));
        if (!q.answered) unanswered.push(q.id);
      });
      lines.push("");
    });
    if (unanswered.length) {
      lines.push("---------- NOT ANSWERED ----------");
      lines.push(unanswered.join(", "));
      lines.push("");
    }
    lines.push("=== END OF ANSWERS ===");
    return lines.join("\n");
  }

  function updateStatus() {
    let n = 0;
    ALL_QUESTIONS.forEach(function (q) {
      const el = document.getElementById("q-" + q.id);
      if (isAnswered(q)) { n++; if (el) el.classList.add("answered"); } else if (el) el.classList.remove("answered");
    });
    statusEl.textContent = n + " of " + ALL_QUESTIONS.length + " answered";
    if (n === ALL_QUESTIONS.length) statusEl.classList.add("done"); else statusEl.classList.remove("done");
    TICKETS.forEach(function (t) {
      const a = t.questions.filter(isAnswered).length;
      const el = document.getElementById("tstate-" + t.id);
      if (!el) return;
      el.textContent = t.kind + " · " + a + "/" + t.questions.length;
      el.className = "pill" + (a === 0 ? "" : (a === t.questions.length ? " ok" : " warn"));
    });
  }

  function showToast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toastEl.classList.remove("show"); }, ms || 2400);
  }

  function legacyCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  async function copyText(text) {
    let ok = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
    }
    if (!ok) ok = legacyCopy(text);
    return ok;
  }

  copyBtn.addEventListener("click", async function () {
    const text = buildText();
    const ok = await copyText(text);
    if (ok) { fallbackEl.classList.remove("show"); showToast("✅ Copied! Paste it into the chat."); }
    else { fallbackText.value = text; fallbackEl.classList.add("show"); fallbackText.focus(); fallbackText.select(); showToast("Clipboard blocked — copy the text below.", 4000); }
  });

  function showResults(html) {
    resultsEl.innerHTML = html;
    resultsEl.classList.add("show");
    resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function sendViaFiles(c, p) {
    const written = [];
    for (let i = 0; i < p.tickets.length; i++) {
      const t = p.tickets[i];
      if (t.answered === 0) continue;
      showToast("⏳ Writing " + t.id + " (" + (i + 1) + " of " + p.tickets.length + ")…", 60000);
      const path = c.folder + "/" + t.slug + ".md";
      const message = t.id + " — " + t.status + " — " + t.title;
      const res = await ghPutFile(c, path, ticketMarkdown(t, p), message);
      written.push({ ticket: t, path: path, url: res.url });
    }
    if (written.length) {
      const quiet = document.getElementById("ghQuiet").checked;
      if (!quiet) {
        const idxPath = c.folder + "/README.md";
        showToast("⏳ Updating the ticket index…", 60000);
        let existing = "";
        try { const f = await ghGetFile(c, idxPath); existing = f ? f.text : ""; } catch (e) { existing = ""; }
        await ghPutFile(c, idxPath, mergeIndex(existing, indexRowsFor(written.map(function (w) { return w.ticket; }))), "tickets: update index");
      }
    }
    return written;
  }

  async function createIssue(c, t, p) {
    const marker = "<!-- " + FORM_META.id + ":" + t.id + " -->";
    const body = marker + "\n\n" + ticketMarkdown(t, p).split("\n").slice(6).join("\n");
    const existing = await ghSearchIssues(c, marker);
    if (existing) {
      const r = await fetch("https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/issues/" + existing.number, {
        method: "PATCH", headers: Object.assign({ "Content-Type": "application/json" }, headers(c)), body: JSON.stringify({ title: t.id + " — " + t.title, body: body })
      });
      if (!r.ok) throw new Error("PATCH issue " + existing.number + " → HTTP " + r.status);
      return { url: existing.html_url };
    }
    const r = await fetch("https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/issues", {
      method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, headers(c)), body: JSON.stringify({ title: t.id + " — " + t.title, body: body, labels: [t.kind] })
    });
    if (!r.ok) {
      let t2 = "";
      try { t2 = (await r.json()).message || ""; } catch (e) {}
      throw new Error("POST issue → HTTP " + r.status + (t2 ? " (" + t2 + ")" : ""));
    }
    const j = await r.json();
    return { url: j.html_url };
  }

  async function sendViaIssues(c, p) {
    const written = [];
    for (let i = 0; i < p.tickets.length; i++) {
      const t = p.tickets[i];
      if (t.answered === 0) continue;
      showToast("⏳ Creating issue " + t.id + " (" + (i + 1) + " of " + p.tickets.length + ")…", 60000);
      const res = await createIssue(c, t, p);
      written.push({ ticket: t, path: "issue", url: res.url });
    }
    return written;
  }

  sendBtn.addEventListener("click", async function () {
    const p = buildPayload();
    const answeredTickets = p.tickets.filter(function (t) { return t.answered > 0; });
    if (!answeredTickets.length) { showToast("Answer at least one question first.", 3000); return; }
    const c = currentGh();
    const text = buildText();
    safeSet(LASTSENT_KEY, JSON.stringify(p));
    if (!c.owner || !c.repo || !c.token) {
      const ok = await copyText(text);
      showResults("<b>No GitHub connection yet.</b> Your answers are saved as a draft in this browser" + (ok ? " and copied to the clipboard" : "") + ".<div class=\"res-line\">Open the <b>GitHub tickets</b> panel above, fill in owner / repo / token, then press Send again — or just paste the copied text into the chat.</div>");
      if (!ok) { fallbackText.value = text; fallbackEl.classList.add("show"); }
      showToast("Not connected to GitHub — answers kept locally.", 4000);
      return;
    }
    const target = currentTarget();
    sendBtn.disabled = true;
    copyBtn.disabled = true;
    let written = [];
    let err = null;
    let fellBack = false;
    try {
      written = target === "issues" ? await sendViaIssues(c, p) : await sendViaFiles(c, p);
    } catch (e) {
      err = String(e);
      if (target === "issues") {
        fellBack = true;
        try { written = await sendViaFiles(c, p); err = null; } catch (e2) { err = String(e2); }
      }
    }
    sendBtn.disabled = false;
    copyBtn.disabled = false;
    if (err) {
      const ok = await copyText(text);
      showResults("<b>⚠️ GitHub write failed.</b><div class=\"res-err\">" + esc(err).replace(/</g, "&lt;") + "</div><div class=\"res-line\">Your answers are saved as a draft in this browser" + (ok ? " and copied to the clipboard" : "") + " — fix the token above and press Send again, or paste the copied text into the chat.</div>");
      if (!ok) { fallbackText.value = text; fallbackEl.classList.add("show"); }
      showToast("GitHub write failed.", 4000);
      return;
    }
    const folderUrl = "https://github.com/" + c.owner + "/" + c.repo + "/tree/" + encodeURIComponent(c.branch) + "/" + c.folder.split("/").map(encodeURIComponent).join("/");
    let html = "<b>✅ Sent " + written.length + " ticket" + (written.length === 1 ? "" : "s") + ".</b>";
    if (fellBack) html += " <span class=\"pill warn\">Issues refused (token needs Issues: read+write) — wrote ticket files instead</span>";
    html += "<div style=\"margin-top:8px\">";
    written.forEach(function (w) {
      html += "<div class=\"res-line\"><span class=\"pill ok\">" + w.ticket.id + "</span><span>" + esc(w.ticket.title) + "</span><a href=\"" + w.url + "\" target=\"_blank\" rel=\"noopener\">" + w.url + "</a></div>";
    });
    html += "</div><div class=\"res-line\"><a href=\"" + folderUrl + "\" target=\"_blank\" rel=\"noopener\">" + (target === "issues" && !fellBack ? "All issues" : "All tickets in the repo") + " →</a></div>";
    html += "<div class=\"res-line\">Now just tell the AI “sent”.</div>";
    if (written.length < answeredTickets.length) html += "<div class=\"res-line\">(" + (answeredTickets.length - written.length) + " answered ticket(s) were skipped.)</div>";
    showResults(html);
    showToast("✅ " + written.length + " ticket" + (written.length === 1 ? "" : "s") + " sent to GitHub.", 4000);
  });

  document.getElementById("recommendBtn").addEventListener("click", function () {
    let n = 0;
    ALL_QUESTIONS.forEach(function (q) {
      if (q.type === "select") {
        const sel = document.getElementById("ctl-" + q.id);
        if (!sel || sel.value !== "") return;
        const idx = (q.options || []).findIndex(function (o) { return /recommended/i.test(o); });
        if (idx < 0) return;
        sel.value = String(idx);
        n++;
      } else if (q.type === "checkboxes") {
        (q.options || []).forEach(function (opt, i) {
          if (!/recommended/i.test(opt)) return;
          const cb = document.getElementById("ctl-" + q.id + "-" + i);
          if (cb && !cb.checked) { cb.checked = true; n++; }
        });
      }
    });
    persist();
    showToast(n ? "Filled in the recommended answer for " + n + (n === 1 ? " question" : " questions") + " — change any of them you like, then Send." : "Nothing left to fill in: every question that has a recommended answer already has one.");
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    if (!window.confirm("Clear every answer and note on this form?")) return;
    ALL_QUESTIONS.forEach(function (q) {
      if (q.type === "select") {
        const sel = document.getElementById("ctl-" + q.id);
        if (sel) sel.value = "";
      } else if (q.type === "checkboxes") {
        (q.options || []).forEach(function (opt, i) {
          const cb = document.getElementById("ctl-" + q.id + "-" + i);
          if (cb) cb.checked = false;
        });
      } else {
        const el = document.getElementById("ctl-" + q.id);
        if (el) el.value = "";
      }
      if (q.notes !== false) {
        const nt = document.getElementById("note-" + q.id);
        if (nt) nt.value = "";
      }
    });
    persist();
    showToast("Cleared.");
  });

  const previewDetails = document.getElementById("previewDetails");
  previewDetails.addEventListener("toggle", function () {
    previewEl.setAttribute("data-open", previewDetails.open ? "1" : "0");
    if (previewDetails.open) previewEl.textContent = buildText();
  });

  updateStatus();
  document.getElementById("pageState").textContent = Object.keys(draft).length ? "draft restored" : "";
})();
</script>
</body>
</html>
