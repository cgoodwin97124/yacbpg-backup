f that panel's images packed into a single \u003ccode>.zip\u003c/code>); these activate once the panel has at least one image. Choose the image size in \u003cb>📄 File\u003c/b>: from 512×512 up to 1920×1080 (16:9) or 1080×1920 (9:16), or a custom size up to 1920×1080. Larger sizes are upscaled from the 768px base generation, so they're a bit softer but still crisp for print/web use. To preview any image at a larger size, hover your pointer over it (computer) or press and hold it (mobile). The preview appears after the delay set in \u003cb>📄 File → Image Preview Delay\u003c/b> (0 shows it instantly), and can be turned off entirely with the \u003cb>Enable image preview\u003c/b> checkbox there. Each image also has a \u003ccode>🔓 Protect\u003c/code> chip (locks it against regeneration), a \u003ccode>⭐ Cover\u003c/code> chip (makes it the panel's representative — it moves to the first slot and gets a \u003ccode>⭐\u003c/code> badge), and an \u003ccode>✕ Clear this image\u003c/code> chip (removes just that image).\u003c/li>\n            \u003cli>\u003cb>Copy a panel's prompt\u003c/b> — use the \u003ccode>📋 Copy Prompt\u003c/code> chip on any panel to copy that panel's exact full prompt (style keywords, characters, modifiers, location, and action) to your clipboard — great for testing or tweaking a prompt in another image tool. If a panel has no content, the chip shows \u003ccode>⚠ No Content\u003c/code> instead. (This reflects any \u003ccode>📝 Prompt\u003c/code> override you've set.)\u003c/li>\n            \u003cli>\u003cb>View / override a panel's prompt\u003c/b> — the \u003ccode>📝 Prompt\u003c/code> chip on any panel opens an inline editor showing that panel's exact prompt, positive and negative, including the preset style keywords. You can view it or edit it right there: once you modify it, the \u003ccode>⚡ GENERATE\u003c/code> / \u003ccode>🔄 Generate\u003c/code> buttons for that panel use your edited text instead of the interface-built prompt. The editor text does \u003cb>not\u003c/b> feed back into the panel's character/location/action fields. If you then change the panel's characters, location, or action — or the global keywords, presets, or NSFW flag — the editor resets to the values drawn from those presets and the interface, discarding your override. (The override survives page reloads until such an interface change.)\u003c/li>\n            \u003cli>\u003cb>Reproduce a page\u003c/b> — set a \u003cb>Seed\u003c/b> in \u003cb>📄 File\u003c/b> (each page has its own); leave it blank for random results. When a seed is set, Panel N uses seed + N, so the whole page regenerates identically. The seed is saved across reloads along with your panel details. For full control, every panel also has its own \u003ccode>Panel Seed\u003c/code> box: if you set one, it overrides the page seed for that panel only.\u003c/li>\n            \u003cli>\u003cb>Back up your project\u003c/b> — give it a name in \u003cb>📄 File → Project\u003c/b> (it shows at the top of the page and becomes the default filename). \u003cb>📄 File → Project → Backup Project\u003c/b> saves everything (project name, page setup, keywords, NSFW flag, all pages' panel details, saved characters/locations, layout) as a \u003ccode>.json\u003c/code> file. \u003ccode>💾 Save…\u003c/code> never asks: it silently overwrites the file you chose with \u003ccode>Save as…\u003c/code> (remembered even after a reload), or downloads to the default name if you haven't chosen one yet; \u003ccode>💾 Save as…\u003c/code> always asks for a path and filename and confirms before overwriting an existing file. Where the browser supports it you can choose any folder on your device; otherwise the file is simply downloaded. \u003ccode>⬆ Import Project\u003c/code> restores a saved file later — even on another device: a \u003ccode>.json\u003c/code> restores the settings, and a project \u003ccode>.zip\u003c/code> restores the settings \u003ci>and\u003c/i> repopulates every generated panel image (all pages) back into the page. Importing replaces the current project entirely (including image protection), so if you have a project in progress it asks first whether to save it: \u003cb>Save\u003c/b> backs the current project up and then imports, \u003cb>Continue\u003c/b> imports without saving, \u003cb>Cancel\u003c/b> aborts. All menu settings also survive page refreshes automatically. Every panel also has an \u003ccode>⬇ Export\u003c/code> chip — it downloads the \u003ci>same single JSON file\u003c/i> containing all panels' settings, so exporting from any panel backs up the whole project. To back up your generated images too, use \u003cb>📄 File → Export Project (.zip)\u003c/b>: it bundles the settings JSON plus every generated panel image (all pages) into one \u003ccode>.zip\u003c/code>. Images only live in the page until you reload, so export them before then.\u003c/li>\n            \u003cli>\u003cb>View modes\u003c/b> — \u003cb>▦ Storyboard\u003c/b> (top of the page) temporarily hides the whole UI and shows every panel's representative image as a comic-page grid — panels with no image yet get a placeholder. The \u003ccode>🔍 Focus\u003c/code> chip on a panel opens \u003cb>single-panel view\u003c/b>: the full page is hidden and just that panel fills the screen, so you can edit it without scrolling. Navigate with the \u003ccode>◀ Prev\u003c/code> / \u003ccode>Next ▶\u003c/code> buttons, the panel dropdown, the panel list on the left (landscape only), or the \u003ccode>↑\u003c/code>/\u003ccode>↓\u003c/code> arrow keys; \u003ccode>Esc\u003c/code> or \u003ccode>← Back to page\u003c/code> returns you. Both views reflect the current number of panels and their titles.\u003c/li>\n            \u003cli>\u003cb>NSFW\u003c/b> — leave unchecked to force SFW output; check it (in \u003cb>🎨 Edit\u003c/b>) to let the model follow your prompts without filters.\u003c/li>\n          \u003c/ol>\n          \u003cp style=\"margin-bottom:0;color:#bbb;\">Tip: generated images live only in this page until you reload — if you want to keep one, screenshot it.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"help-panel manual-panel\">\n          \u003ch3>📖 User Manual\u003c/h3>\n          \u003cp class=\"lib-hint\">A full guide to the app — building panels, generating images, persistence, backups, and more.\u003c/p>\n          \u003cbutton class=\"btn-add-lib\" onclick=\"openUserManual()\" title=\"Open the full user manual in a new tab\">📖 Open User Manual\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"help-panel about-panel\">\n          \u003ch3>About / Version History\u003c/h3>\n          \u003cp class=\"lib-hint\">Yet Another Comic Book Page Generator — a Perchance image-comic builder. Current version: \u003cb id=\"aboutVersion\" class=\"about-ver\">\u003c/b>. Each revision below summarizes what changed.\u003c/p>\n          \u003cdiv id=\"changelogCtn\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"gen-actions\">\n      \u003cdiv class=\"gen-row\">\n        \u003cbutton class=\"btn-generate\" onclick=\"generateComicPage()\">⚡ GENERATE ALL PANELS\u003cbr>ON PAGE ⚡\u003c/button>\n        \u003cbutton class=\"btn-pause-global\" id=\"globalPauseBtn\" onclick=\"pauseGenerations()\" title=\"Pause the run — press ⚡ Generate All Panels On Page to continue where you left off\" disabled>⏸ Pause\u003c/button>\n        \u003cbutton class=\"btn-stop-global\" id=\"globalStopBtn\" onclick=\"haltGenerations()\" title=\"Cancel the running Generate All Panels On Page run\" disabled>■ Stop\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"statusEl\" class=\"status\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"canvas-frame\" id=\"canvasFrame\">\n    \u003ch2>Panel Modifiers & Canvas\u003c/h2>\n    \u003cdiv id=\"comicGrid\" class=\"comic-grid\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"imgPreview\" class=\"img-preview\" hidden>\u003cimg id=\"imgPreviewImg\" alt=\"\">\u003cdiv id=\"imgPreviewLabel\" class=\"img-preview-label\">\u003c/div>\u003c/div>\n\n\u003cdiv id=\"singleOverlay\" class=\"view-overlay\" hidden>\n  \u003cdiv class=\"view-top\">\n    \u003cbutton class=\"btn-view\" onclick=\"closeSingleView()\" title=\"Return to the full page\">← Back to page\u003c/button>\n    \u003cdiv class=\"single-nav\">\n      \u003cbutton class=\"btn-clear\" onclick=\"singleNav(-1)\" title=\"Previous panel\">◀ Prev\u003c/button>\n      \u003cselect id=\"singlePanelSel\" onchange=\"singleNavTo(this.value)\">\u003c/select>\n      \u003cbutton class=\"btn-clear\" onclick=\"singleNav(1)\" title=\"Next panel\">Next ▶\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"focus-gen\">\n    \u003cbutton class=\"btn-generate\" id=\"focusGenerateBtn\" onclick=\"generateComicPage()\">⚡ GENERATE ALL PANELS ON PAGE ⚡\u003c/button>\n    \u003cbutton class=\"btn-pause-global\" id=\"focusPauseBtn\" onclick=\"pauseGenerations()\" title=\"Pause the run — press ⚡ Generate All Panels On Page to continue where you left off\" disabled>⏸ Pause\u003c/button>\n    \u003cbutton class=\"btn-stop-global\" id=\"focusStopBtn\" onclick=\"haltGenerations()\" title=\"Cancel the running Generate All Panels On Page run\" disabled>■ Stop\u003c/button>\n    \u003cdiv class=\"status\" id=\"focusStatusEl\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"single-body\">\n    \u003cdiv class=\"single-list\" id=\"singleList\">\u003c/div>\n    \u003cdiv class=\"single-stage\" id=\"singleStage\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"storyboardOverlay\" class=\"view-overlay\" hidden>\n  \u003cdiv class=\"view-top\">\n    \u003cbutton class=\"btn-view\" onclick=\"closeStoryboard()\" title=\"Return to the full page\">← Back to page\u003c/button>\n    \u003cspan class=\"view-title\" id=\"storyboardTitle\">Storyboard — panel by panel\u003c/span>\n  \u003c/div>\n  \u003cdiv id=\"storyboardGrid\" class=\"storyboard-grid\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"manualOverlay\" class=\"manual-overlay\" hidden>\n  \u003cdiv class=\"manual-bar\">\n    \u003cspan class=\"manual-title\">📖 User Manual — Yet Another Comic Book Page Generator\u003c/span>\n    \u003cbutton class=\"btn-view\" onclick=\"closeUserManual()\" title=\"Close the user manual\">✕ Close\u003c/button>\n  \u003c/div>\n  \u003ciframe id=\"manualFrame\" title=\"User Manual\">\u003c/iframe>\n\u003c/div>\n\n\u003cdiv id=\"passwordOverlay\" class=\"password-overlay\" hidden>\n  \u003cdiv class=\"password-box\">\n    \u003cdiv id=\"passwordSetMode\">\n      \u003ch3>Protect your hidden panels\u003c/h3>\n      \u003cp class=\"lib-hint\">Choose a one-time password to reveal them later. It only lasts until the panels are shown again — each hide can set a fresh one.\u003c/p>\n      \u003clabel>Password:\u003c/label>\n      \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"pwSet1\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){event.preventDefault();confirmSetPassword();}\">\u003cbutton class=\"btn-view\" id=\"pwSet1Eye\" onclick=\"togglePwEye('pwSet1','pwSet1Eye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n      \u003clabel>Confirm password:\u003c/label>\n      \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"pwSet2\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){event.preventDefault();confirmSetPassword();}\">\u003cbutton class=\"btn-view\" id=\"pwSet2Eye\" onclick=\"togglePwEye('pwSet2','pwSet2Eye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n      \u003cdiv id=\"pwSetErr\" class=\"pw-err\">\u003c/div>\n      \u003cdiv class=\"pw-btns\">\u003cbutton class=\"btn-view\" onclick=\"confirmSetPassword()\" style=\"background:#4dff88;color:#111;\">🔒 Lock &amp; Hide\u003c/button>\u003cbutton class=\"btn-view\" onclick=\"cancelPasswordDialog()\">Cancel\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"passwordEnterMode\" hidden>\n      \u003ch3>Panels are locked\u003c/h3>\n      \u003cp class=\"lib-hint\">Enter the password to show the panels again.\u003c/p>\n      \u003clabel>Password:\u003c/label>\n      \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"pwEnter\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){event.preventDefault();confirmEnterPassword();}\">\u003cbutton class=\"btn-view\" id=\"pwEnterEye\" onclick=\"togglePwEye('pwEnter','pwEnterEye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n      \u003cdiv id=\"pwEnterErr\" class=\"pw-err\">\u003c/div>\n      \u003cdiv class=\"pw-btns\">\u003cbutton class=\"btn-view\" onclick=\"confirmEnterPassword()\" style=\"background:#4dff88;color:#111;\">🔓 Unlock &amp; Show\u003c/button>\u003cbutton class=\"btn-view\" onclick=\"cancelPasswordDialog()\">Cancel\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"importConfirmOverlay\" class=\"import-confirm-overlay\" hidden>\n  \u003cdiv class=\"import-confirm-box\">\n    \u003ch3>⚠️ Importing replaces your current project\u003c/h3>\n    \u003cp>You have a project in progress. Importing will clear \u003cb>everything\u003c/b> — all pages, panel settings, keywords, saved characters/locations, generated images, and image protection.\u003c/p>\n    \u003cp class=\"ic-hint\">Save backs up the current project first (💾 Save…), then imports. Continue imports without saving. Cancel aborts.\u003c/p>\n    \u003cdiv class=\"import-confirm-btns\">\n      \u003cbutton class=\"btn-confirm-save\" onclick=\"confirmImportSave()\" title=\"Back up the current project (same as 💾 Save…), then import\">💾 Save & Import\u003c/button>\n      \u003cbutton onclick=\"confirmImportNoSave()\" title=\"Import without backing up the current project\">Continue\u003c/button>\n      \u003cbutton class=\"btn-clear\" onclick=\"cancelImport()\" title=\"Abort — keep the current project\">Cancel\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"newProjectOverlay\" class=\"import-confirm-overlay\" hidden>\n  \u003cdiv class=\"import-confirm-box\">\n    \u003ch3>⚠️ Starting a new project clears the current one\u003c/h3>\n    \u003cp>You have a project in progress. Starting a new project will clear \u003cb>everything\u003c/b> — all pages, panel settings, keywords, generated images, and image protection. (Your saved characters, locations, and action prompts are kept.)\u003c/p>\n    \u003cp class=\"ic-hint\">Save backs up the current project first (💾 Save…), then starts fresh. Continue starts without saving. Cancel aborts.\u003c/p>\n    \u003cdiv class=\"import-confirm-btns\">\n      \u003cbutton class=\"btn-confirm-save\" onclick=\"confirmNewProjectSave()\" title=\"Back up the current project (same as 💾 Save…), then start a new project\">💾 Save & New\u003c/button>\n      \u003cbutton onclick=\"confirmNewProjectNoSave()\" title=\"Start a new project without backing up the current one\">Continue\u003c/button>\n      \u003cbutton class=\"btn-clear\" onclick=\"cancelNewProject()\" title=\"Abort — keep the current project\">Cancel\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003cdiv id=\"ghBackupOverlay\" class=\"password-overlay\" style=\"position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:10001;\" hidden>\n  \u003cdiv class=\"password-box\" style=\"max-width:460px;\">\n    \u003ch3>⬆ Backup to GitHub\u003c/h3>\n    \u003cp class=\"lib-hint\" style=\"margin:0 0 10px;\">Pushes this generator's source — \u003cb>main.pjs\u003c/b>, \u003cb>index.html\u003c/b> (the live page, incl. embedded docs), \u003cb>src/user-manual.html\u003c/b>, and the PENDING / AI-NOTES / CHANGELOG / ISSUES docs — to a GitHub repo as version history. Requires a private repo + a fine-grained Personal Access Token (Contents: read &amp; write, scoped to that repo). Backs up the \u003ci>last-saved\u003c/i> generator — press Save first if you just made changes.\u003c/p>\n    \u003clabel>GitHub username / owner:\u003c/label>\n    \u003cinput type=\"text\" id=\"ghOwnerInput\" placeholder=\"e.g. cgoodwin97124\" autocomplete=\"off\" style=\"width:100%;box-sizing:border-box;\">\n    \u003clabel>Repository name:\u003c/label>\n    \u003cinput type=\"text\" id=\"ghRepoInput\" placeholder=\"e.g. yacbpg-backup\" autocomplete=\"off\" style=\"width:100%;box-sizing:border-box;\">\n    \u003clabel>Personal Access Token (fine-grained):\u003c/label>\n    \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"ghTokenInput\" autocomplete=\"off\">\u003cbutton class=\"btn-view\" id=\"ghTokenEye\" onclick=\"togglePwEye('ghTokenInput','ghTokenEye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n    \u003cdiv id=\"ghStatusEl\" class=\"pw-err\">\u003c/div>\n    \u003cp class=\"ic-hint\" style=\"margin:0 0 12px;\">🔒 Token is stored only in your browser (localStorage) — never in exports, project backups, or the shipped generator. Last backup: \u003cspan id=\"ghLastBackupEl\">never\u003c/span>\u003c/p>\n    \u003cdiv class=\"pw-btns\">\n      \u003cbutton class=\"btn-view\" onclick=\"ghSaveSettings()\" title=\"Save owner/repo/token in this browser only\">💾 Save settings\u003c/button>\n      \u003cbutton class=\"btn-view\" onclick=\"ghTest()\" title=\"Check the token can see the repo (makes no changes)\">🔍 Test connection\u003c/button>\n      \u003cbutton class=\"btn-view\" onclick=\"ghClose()\">Close\u003c/button>\n    \u003c/div>\n    \u003cp class=\"ic-hint\" style=\"margin:10px 0 0;\">⬆ Backups are run by the AI assistant — just say \"back it up to GitHub\" in the chat and I'll push using the saved token. No push button ships with the generator, so visitors can't trigger commits.\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003c!-- EMBEDDED WORKFLOW DOCS (2026-08-14): PENDING queue + AI-NOTES + CHANGELOG were moved out of src/ into\n     these \u003cscript type=\"text/plain\"> blocks (read via .textContent; inert to the perchance template engine).\n     Reason: the platform's save flow permanently fails on those three src/ file names (\"another_upload_in_progress\")\n     once their first upload wedges, blocking ALL saves while they're present — deleting them is the only cure.\n     AI-NOTES was previously src/AI-NOTES.md; the queue was src/PENDING.md; the changelog was src/CHANGELOG.md;\n     ISSUES.md (src/ISSUES.md) joined the same way later the same day — its FIRST AI write this session wedged it too,\n     proving the trigger is ANY src/ file written by the AI (its sync gets killed by the next hard reload), not the\n     content or the file names. None of these four file names may ever be recreated in src/.\n     (renderChangelog below reads #embeddedChangelog, with a src/ fetch fallback for stale editor copies). -->\n\u003cscript type=\"text/plain\" id=\"embeddedPENDING\">\n# PENDING — Request Queue\n\n**RULE (author-mandated 2026-08-13): EVERY new author request is logged into this file FIRST — before\nany work starts — even when the author says \"go ahead\" immediately.** Greenlit requests go straight into\nthe 🟢 START NOW section; everything awaiting the author's explicit \"go ahead\" goes into the 🕒 QUEUED\nsection. Move entries between sections as their status changes (greenlit → START NOW; implemented →\n✅ DONE, with the changelog version + a matching dev-note block in index.html). A future AI helper\nsession should READ THIS FILE before planning new work.\n\nConvention: date-stamped entry with Status, Request, and implementation Notes (newest first within\neach section).\n\n---\n\n## 🟢 START NOW — author explicitly said \"go ahead\" (implement immediately)\n\n### 2026-08-22 — File → New Project should clear the library (bug report)\n- **Status:** DONE 2026-08-22 (changelog 2026.08.16.12). Author: \"File -> New is not clearing the\n  library.\" Root cause: doNewProject() → resetEverything(true) only wiped comicGen.libObjects when the Edit→Reset\n  \"Also permanently delete my saved library objects\" checkbox was checked (it defaults off and resets to false), so\n  New Project never cleared it. Fixed: doNewProject() now always removes comicGen.libObjects + re-renders the\n  library panel. Edit→Reset checkbox path unchanged.\n\n### 2026-08-17 — Remove Panel Library persistence; add \"copy from previous panel\" buttons\n- **Status:** DONE 2026-08-17 (changelog 2026.08.16.11). Author request: \"I'd like to eliminate the Panel\n  Library persistence function. Instead, I'd like to replace it with a small button that copies the\n  corresponding item from the previous panel. And we'll go ahead with this now.\" Implemented: the entire ⟳\n  persistence system (checkbox propagation to later panels + cross-page carry) was removed and replaced\n  with a small ⇤ button on each character slot, the Location row, and the Panel Action Prompt row that\n  copies that item (selection + modifier) from the panel directly before it. Panel 1's buttons are\n  disabled. Nothing copies automatically anymore. Old saved projects keep their content (persist flags\n  dropped on next save). Help + user manual + dev docs updated. Verified live; author's project intact.\n\n\n\n## 🕒 QUEUED — persistent pending items, awaiting the author's \"go ahead\" (newest first, DO NOT start)\n\n### 2026-09-18 — Show each panel's seed in the panel header (user-editable)\n- **Status:** QUEUED — awaiting the author's \"go ahead\" (DO NOT start). Author request: \"Is it possible to\n  have each panel display the seed it uses? I'd like to have it placed in the panel header area, where the\n  panel title, number of images, style, and size are. I'd also like to make this user-editable, so if the\n  user changes it here it uses that seed for that panel.\"\n- **DESIGN DECISIONS (author, 2026-09-18):** (1) the box SHOWS THE RESOLVED SEED the panel would use, i.e.\n  `getPanelSeed(i)` = panel override > global seed + (N−1) > random — so when a panel has no override and a\n  global seed is set, it displays that computed value; when neither is set the resolved value is random, so\n  the display should read \"random\"/\"unseeded\" rather than a made-up number. (2) The header field behaves\n  IDENTICALLY to the accordion box: typing a value = that panel's override, clearing it = fall back to the\n  global seed. (3) The header field REPLACES the ⚙ Panel accordion seed box — the accordion\n  `#panel-seed-N` label+input block (~line 4367) is REMOVED, not duplicated/synced.\n- **Implementation notes:** Move the per-panel seed input into the panel header row `.panel-header-row`\n  (renderPanels, index.html ~line 4279), which today holds `Panel N`, `#panel-title-N`, the Images\n  `#panel-img-count-N` select, the Style `#panel-style-N` select, the Size `#panel-size-N` select (+ custom\n  W/H), and the ⇅ Move chip. Keep the SAME id `panel-seed-N` so the existing state plumbing keeps working:\n  save loop (~line 3766), restore loop (~line 4159), reset loop (~line 6417), and getPanelSeed (~line 5033,\n  which reads `#panel-seed-N`). The `.panel-card input[id^=\"panel-seed-\"]` CSS rule (~line 1194, keeps the\n  seed box a 1-line input under the 5-line-textarea rule) still applies. Remove the accordion `.panel-acc-stack`\n  wrapper that held the seed label/input. Enter already triggers generateSinglePanel for the seed input — keep\n  that on the header field. To DISPLAY the resolved seed when the box is empty, set the input's `placeholder`\n  from getPanelSeed(i) after render and refresh it when the global seed changes (the existing `#seedInput`\n  listener at ~line 7110 is the hook) and whenever panel numbering changes (reorder/add/delete). If the author\n  wants the resolved value to be genuinely visible even for a random/unseeded panel, note that an unseeded\n  panel's seed is only chosen at generation time (`-1` → random) and is NOT currently stored — flag this as an\n  open sub-decision (store the last-used random seed for display, vs. show \"random\"). The header is already\n  dense, so check the flex-wrap layout at phone width (390px).\n\n### 2026-08-15 — STANDING DIRECTIVE: back up to GitHub on every Save reminder\n- **Status:** in force until the author says otherwise (no changelog entry — process/directive, not a feature).\n  Recorded 2026-08-15 at the author's request (\"add this to the ongoing directives: until I specify otherwise,\n  always back it up to GitHub at the same time you remind me to Save\"). Every future session must, at task end,\n  run the GitHub backup in the same turn as the \"press Save\" reminder: openGhBackup() → ghPush() → ghClose().\n  Also recorded in the top-of-file dev-notes and in AI-NOTES §standings.\n\n## ✅ DONE — implemented (history, newest first)\n### 2026-08-16 — Pause a run and continue it (implemented 2026.08.16.9)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.9). Author request: \"Is there a way we can pause a run\n  rather than disabling it, and be able to continue it?\" Implemented: a ⏸ Pause button (sidebar gen-row\n  between ⚡ and ■ Stop, plus a mirrored ⏸ in the Focus overlay's .focus-gen row) that pauses the running\n  Generate All Panels On Page run after the current panel; pressing ⚡ GENERATE ALL PANELS ON PAGE again\n  CONTINUES from the panel it paused on — done panels are NOT regenerated. ■ Stop still fully cancels\n  (⚡ then restarts from panel 1). Tab-background auto-pause now also resumes mid-run instead of\n  restarting. Mechanics: `pausedManually` + `resumePanel` state; `pauseGenerations()` (guard on\n  generateAllRunning) stops the in-flight generation like Stop does; the generateComicPage loop's break\n  block records `resumePanel = (result === 'cleared') ? i : i + 1` (clamped to totalPanels) and the next\n  ⚡ click starts from there; \"Generate All From Here\" (startPanel) clears resumePanel; button states:\n  ⏸+■ disabled while paused, ⚡ enabled. Verified live with mocked image generation: pause mid-run →\n  status \"Paused — press ⚡ ... to continue from panel N\", resume regenerated only from panel N (skipped\n  count correct, done panel images kept), Stop still cancels cleanly (loop breaks, ⚡ restarts fresh from\n  panel 1), Focus overlay ⏸ mirrors sidebar state through a full pause/resume cycle, from-here overrides a\n  stored resume point. Test page deleted and author's project data verified intact after testing.\n  (REVISED 2026-08-16 after author retest: the first live verification used a mock WITH a `.stop()`\n  method, which the real text-to-image plugin does not have — so Pause couldn't cancel the in-flight\n  image, the current panel kept rendering and its result landed anyway, and the run only paused after it\n  finished. Fixed in 2026.08.16.10 with a per-run abort signal raced against each image request; see the\n  BATCH 2026.08.16.10 dev-note. Re-verified live with a realistic no-.stop mock.)\n\n### 2026-08-16 — ⚡ Generate All Panels On Page button in Focus view (implemented 2026.08.16.8)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.8). Author request: put the Generate All Panels On Page\n  button on the Focus page with the same functionality; implement now. Implemented: a `.focus-gen` row in\n  the #singleOverlay (Focus) with its own ⚡ button (calls the same generateComicPage), a ■ Stop button, and\n  a status line. No changes to generation internals — state is mirrored via MutationObservers\n  (syncFocusControls/initFocusSync): sidebar ⚡ disabled → focus ⚡, globalStopBtn disabled → focus Stop,\n  statusEl text → focusStatusEl. Verified live: both buttons disabled during a run and both Stops enabled,\n  status synced through the run, black-on-yellow label rendering, visual pass. Author's project verified\n  intact after testing.\n\n### 2026-08-16 — \"Generate All Panels On Page\" label + per-page panel counts (implemented 2026.08.16.7)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.7). Author request: Generate All Panels should generate\n  only the current page and be labeled \"Generate All Panels On Page\"; also be able to vary the number of\n  panels per page. Findings: Generate All ALREADY only generated the current page, and per-page panel counts\n  ALREADY worked (each page stores its own count). Implemented: relabeled the ⚡ button, ■ Stop tooltip, 3\n  status strings, embedded help, and src/user-manual.html to \"GENERATE ALL PANELS ON PAGE\"; made the Page\n  Setup control's label explicit (\"Number of Panels on This Page — each page remembers its own\"). Plus layout\n  fixes the longer label forced: two-line `\u003cbr>` button text, compact sizes, `color:#000` restored (a\n  platform `button:not([disabled]){color:inherit}` override had silently made the ⚡ button white-on-yellow),\n  and a 6px right margin so ■ Stop sits fully inside the sidebar. Verified live: black-on-yellow two-line\n  label, Stop fully inside, generation uses the current page's count only. Author's project data verified\n  intact after testing.\n\n### 2026-08-16 — Page navigator + multi-page chain fixes (implemented 2026.08.16.6)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.6). Author go-ahead given 2026-08-16. Combined\n  implementation: (1) **Page navigator** — `#pageNav` (◀ Prev + numbered `.page-nav-page` buttons with\n  `.active` + ▶ Next) shows fixed bottom-center only when pageCount() > 1; `updatePageNav()` called from\n  `populatePageSel` (covers switch/add/delete/rename), `pageNavDelta(delta)` wraps. Landscape: bottom 16px;\n  `@media (orientation: portrait)` bottom 74px so it clears the fixed ▧ Hide Panels (bottom-left) and ☰ Menu\n  (bottom-right) buttons. (2) **BUG 1** — `clearChainFor(i, suffix)` now deletes `syncState[i + suffix]`\n  (was `currentPage + suffix`); deleting mid-chain no longer permanently breaks the chain or corrupts an\n  unrelated panel's entry. (3) **BUG 2** — `applyCarryToPanel1` + new `panel1IsPristine()` only land a\n  cross-page carry on a pristine panel 1 (matches applied, or holds the same value, or is untouched\n  default); a deliberately different value set there is preserved. One-page-forward carry + decision point\n  unchanged (verified continue + stop paths). All verified live with mocked image generation; test pages\n  deleted and author's project data restored afterwards.\n\n### 2026-08-16 — Library menu: add Characters/Locations via green + button (implemented 2026.08.16.5)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.5). Author request: in the main Library menu, a small\n  green square button with a + sits to the right of the Characters / Locations subheaders, above the rows'\n  Delete buttons, and adds a new Character / new Location. Implemented: renderLibrary's bucket header is\n  now a `.lib-bucket-row` flex row (h3 + `.btn-add-bucket`, 22×22 green #2ea043, \"+\") with\n  title \"Add a new Character/Location\"; clicking calls the new `addLibraryEntryByType(type)` — two\n  prompts (name, then the reusable library description), saves to libObjects, re-renders the library +\n  all panel dropdowns. No panel is involved, so there's no separate panel-description prompt. Verified\n  live: both buttons render green with correct titles, Character creation lands in the right bucket with\n  the typed description, and panel dropdowns pick it up.\n\n### 2026-08-16 — Panel Action Prompt box width (implemented 2026.08.16.4)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.4). Author request: the Panel Action Prompt entry\n  control should have the combined width of the dropdown + freeform description controls of the\n  Characters/Location rows. The action textarea (a 4-column grid row with nothing filling the description\n  column) now gets `grid-column: 1 / 3` via a `.pl-act-wide` class — it spans both columns, leaving the ⟳\n  and ✕ to auto-place into their correct columns (previously they sat misaligned in the middle columns).\n  Verified by pixel measurement: action box left edge == dropdown left edge, right edge == description\n  right edge, ⟳/✕ x-positions identical to the other rows.\n\n### 2026-08-16 — Panel library → fixed slots; Library → Character/Location buckets (revert, 2026.08.16.3)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.3). Author request: revert panel adding of chars/locs\n  to 2026.08.14.5 (name → reusable library description → separate panel description), keep one panel\n  accordion, and revert the main Library menu display to separate Character/Location buckets. Author\n  decisions: delete saved Action prompts + custom types; migrate any extra panel objects into empty main\n  slots (none existed); remove \"+ Add Library Object\"; keep hover tooltips. Implemented: 📖 Panel Library\n  accordion renders 3 fixed char slots + loc slot + freeform action box (no type column, no add-object\n  menu, no extra rows, no action library); char/loc creation goes through newPanelLibraryEntry's 3 prompts\n  via handleGridInput; Library menu renders 👤 Characters / 📍 Locations buckets (name+desc+🗑 rows);\n  migrateLibObjects prunes non-Character/Location entries + deletes comicGen.libTypes; migratePanelExtras\n  folds legacy extras into main slots at restore. Verified live: 3-prompt flows (library desc vs panel\n  desc distinct), save→reload round trip, buckets render, tooltips intact, page error-free, panel library\n  layout vision-checked.\n\n### 2026-08-16 — Bug: Panel Objects \"Add\" button doesn't add an Action (fixed 2026.08.16.2)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.2). Author report: \"When I click the Add button in\n  order to add an Action to the Panel Objects, the Action is not added.\" Two root causes found + fixed:\n  (1) switching the add menu from \"＋ New Action…\" (freeform) to \"Add from library → Action…\" left the\n  picker in stale freeform mode — identity dropdown stayed hidden, button still said \"Ok\", and clicking\n  it with an empty description returned early (nothing added). onPanelAddSelect now fully resets the\n  picker on every menu change (mode cleared, dropdown shown, label \"Add\", placeholder restored), including\n  \"— add object —\". (2) routeObject's Action branch ignored the library selection and set the action slot\n  to the (possibly empty) freeform description — picking a library Action with no typed description\n  silently added nothing; it now falls back to the library entry's action text. Verified live: the stale-\n  switch sequence, clean library pick + prefill, freeform (slot + extra-row), and full reset.\n\n### 2026-08-16 — Panel Menu: adding an Action without a name (implemented)\n- **Status:** DONE 2026-08-16 (changelog 2026.08.16.1). Author request: when adding an Action via the\n  Panel Menu's add flow, the name doesn't matter — a freeform description alone should suffice. Flow now:\n  selecting \"Action\" from either entry point (the add-bar dropdown's \"＋ New Action…\" option, or the\n  object picker's pick:Action → \"＋ New Action…\") switches the add bar into freeform mode: no name prompt,\n  no library entry created. The description textarea shows \"Freeform action description — goes straight\n  into the panel prompt\", the Add button relabels to \"Ok\", and Enter (without Shift) confirms. On Ok,\n  the trimmed description lands directly in the panel's Action slot (#panel-act-N) and its summary\n  (#ps-act-N); if the panel already has an action, it queues as an extra row. The picker's \"＋\" (__new_act__)\n  now routes to the same freeform mode. Library entries (__new_char__ / __new_loc__) are unaffected.\n\n### 2026-08-15 — Bug: hover-to-preview for images invisible in Focus view (fixed 2026.08.15.6)\n- **Status:** DONE 2026-08-15 (changelog 2026.08.15.6). Author report: \"The hover-to-preview for images\n  doesn't work when the panel has Focus.\" Root cause: Focus moves the real panel card into #singleOverlay\n  (.view-overlay z-index 10000), which painted ABOVE #imgPreview (z-index 9999). Fixed by bumping .img-preview\n  to z-index 10002. Verified with real-browser hit testing (elementsFromPoint returns imgPreviewImg first),\n  since html2canvas can't capture fixed-position elements.\n\n\n\n### 2026-08-15 — Panel Objects tooltips + per-panel image size selector (implemented)\n- **Status:** DONE 2026-08-15 (changelog 2026.08.15.5). Greenlit same day (\"Go ahead and greenlight these,\n  unless you need me to make any decisions...\"). (1) Hover / long-press over a Panel Objects Identity dropdown\n  (.po-sel) or Freeform Description (.po-desc) shows the full contents in a floating tooltip (delegated\n  document listeners + a single #poTooltip div, 350ms hover / 500ms long-press delay, viewport-clamped,\n  hidden on scroll/touchmove; perchance engine reload-proof). (2) Each panel header now has a Size dropdown\n  (panel-size-N) next to Style: [Default (Global)] / the same presets as File → Page Setup / Custom… (inline\n  panel-size-w/h inputs). getPanelImageSize(i) falls back to the global getImageSize() when blank/custom-empty;\n  used by generateSinglePanel + generateSinglePanelSlot. Saved in panelState page[i].sizeSel/sizeW/sizeH\n  (version stays 2 — fields are optional/back-compatible), restored on load, reset by Edit → Reset to Defaults,\n  copied by Duplicate (whole-page[i] deep copy). Verified live: override/custom/fallback logic, save→restore\n  round trip (persisted to localStorage, restored on reload), both tooltip types.\n\n\n### 2026-08-15 — Bug: Backup dialog's Close button did nothing (fixed 2026-08-15.4)\n- **Status:** DONE 2026-08-15 (changelog 2026.08.15.4). After the dialog-visibility hardening made the overlay\n  visible for the author at last (2026.08.15.3), Close stopped working: the hardening pins the overlay with\n  inline `display:flex !important`, which beats perchance's `[hidden]{display:none !important}` — so\n  `ghClose()`'s `hidden=true` had no visual effect. Fixed by forcing `display:none !important` in ghClose and\n  having the 2s visibility guard stop once `_ghClosed` is set. Open → Close → Reopen verified live.\n\n### 2026-08-15 — Tier 3: \"Backup to GitHub\" feature (implemented)\n- **Status:** DONE 2026-08-15 (changelog 2026.08.15.2). Greenlit 2026-08-14 evening; built + verified live\n  2026-08-15. File → Backup Project → \"⬆ Backup to GitHub…\" → #ghBackupOverlay (owner/repo/token inputs; 💾\n  Save settings / 🔍 Test connection / ⬆ Push to GitHub). Token stored ONLY in the browser (localStorage\n  comicGen.githubOwner/Repo/Token/LastBackup) — never in panelState/exports/shipped code. ghPush() pushes:\n  main.pjs (via the CORS-open perchance getGeneratorsAndDependencies API), index.html (fetch(location.href) =\n  the live page — raw index.html is unreachable at runtime), src/user-manual.html (relative fetch), and the 4\n  embedded docs as .md files; GitHub Contents API with GET-first sha resolution; commit msg \"backup \u003cver> —\n  \u003ctimestamp>\". Verified live: dialog open/close, settings round-trip, auth-error handling. REMAINING for the\n  author: create the fine-grained PAT and run the first real push (repo exists: cgoodwin97124/yacbpg-backup).\n\n### 2026-08-15 — Batch (2 items, author: \"Go ahead and make it happen!\")\n- **Status:** DONE 2026-08-15 (changelog 2026.08.15.1). Both items implemented + verified live;\n  documented in the index.html dev-notes \"BATCH 2026-08-15.1\" block (incl. a TESTING GOTCHA about the\n  debounced panel save overwriting test restores).\n- **(1) Export protection gating** — `buildExportData(includeProtection)`; JSON-only paths pass false\n  (exportSettings, settingsBlob → saveSettings/saveSettingsAs/confirmImportSave/confirmNewProjectSave) so\n  protectSlots is stripped from all exported panel entries; exportZip passes true (kept). Import unchanged\n  (nukes then applies). Verified: JSON-only export has NO protectSlots; zip export HAS them.\n- **(2) Panel Objects consolidation** — each panel's 📖 Panel Library accordion (👤/📍/🎬 sub-accordions)\n  replaced by one 🧩 Panel Objects accordion: warning, unified rows (Type/Identity/Freeform Description/⟳/✕,\n  same Type dropdown as main menu incl ＋ New Type…), add bar (\"Create new…\" ＋ New Character/Location/\n  Action/\u003cCustomType>…/＋ New Type… + \"Add from library…\" picker). Primary rows reuse existing element ids\n  (empty slots render no row); new per-panel `extras` array supports arbitrary objects; type change routes\n  rows (Character→char slot else extras, Location→loc slot else extras, Action→action box else extras,\n  custom→extras); ensurePanelObjectRow keeps ⟳ chains + carry working on previously-empty slots;\n  buildPanelPrompt null-safe + appends extras; lib-desc auto-fills rows; desc-only rows preserved.\n  Verified live: migration of existing data (author's panel 1: Blonde Woman + monkey + \"hiding behind a\n  door\" all intact), picker add + prefill, custom-type creation (\"＋ New Object…\"), extras overflow +\n  persistence across reload, type routing, desc-only loc preservation, prompt inclusion, real generation.\n  (NOTE: the author's libTypes contains a custom \"Object\" type and libObjects has a few extra entries —\n  \"Sword\", blank rows, \"hide\" — which appear to be the author's own experiments; left untouched.)\n\n### 2026-08-14 — Batch (5 items, author: \"Let's go ahead and start now!\")\n- **Status:** DONE 2026-08-14 (changelog 2026.08.14.7). All five greenlit items implemented + verified live;\n  documented in the index.html dev-notes \"BATCH 2026-08-14.7\" block.\n- **(1) Generate All From Here** — `generateComicPage(startPanel)` takes an optional start (guard + `from`);\n  ⚡ button in each panel's ⚙ accordion (after Collapse Menu) calls `generateComicPage(i)`. Verified: button\n  present, param honored.\n- **(2) Floating Hide/Show Panels button** — `#panelsToggleBtn` now fixed bottom-left (16px/16px, z-index 1000).\n  Verified position.\n- **(3) Hide-panels password + Preferences** — `panelsPassword` (session-only, cleared on reveal);\n  `#hidePasswordPref` in File → Preferences (persisted comicGen.hidePasswordPref); `#passwordOverlay`\n  (set/enter modes, 👁 eyes, wrong password stays hidden). All dialogs exported. Verified live end-to-end.\n- **(4) File → New Project** — `newProject()` + 3-choice overlay (Save & New / Continue / Cancel) →\n  `doNewProject()` = resetEverything(true) + optional name. Verified overlay opens + cancels.\n- **(5) Panel Library Objects consolidation** — one `comicGen.libObjects` store `[{id,type,name,desc}]` +\n  custom types (comicGen.libTypes); Library menu is one \"Panel Library Objects\" section (Type select/name/\n  desc/🗑 rows, \"＋ New Type…\"); dropdowns filter by type (char/loc/act slugs); `migrateLibObjects()` merges\n  the legacy charLibrary/locLibrary/actLibrary (ids preserved) and deletes the keys — runs at boot AND inside\n  applyImportedSettings so old backups import correctly; buildExportData exports libObjects (version 2);\n  imports accept either format; reset consolidated to one checkbox (resetDelLibCheck). Author's 6 saved\n  entries migrated with types intact and panel selections preserved. Verified: migration, per-row type\n  changes, custom types, all three create flows, resolveDesc in prompts, legacy-key removal, old-format\n  import → merged.\n- **Bonus fix:** `let syncState = {}` was missing (implicit global only set by loadCurrentPage) — importing\n  from a fresh page threw \"syncState is not defined\". Declared at IIFE top; legacy-format import now reports\n  \"Imported ✓\".\n\n- **Status:** DONE 2026-08-14 (changelog 2026.08.14.6) — new `comicGen.actLibrary` + 📚 Library \"My Saved\n  Action Prompts\" section (renderLibrary('act'), + Add Action Prompt, name/desc/delete rows). Each panel's\n  🎬 Action Prompt gained a \"From Action Library:\" dropdown (`panel-act-lib-N`) above the freeform textarea:\n  saved actions INSERT their text into `panel-act-N` (dropdown resets to ''; textarea remains the source of\n  truth so freeform actions are untouched); \"＋ New Action…\" → `newActLibraryEntry(i)` runs the same 3-prompt\n  flow (name, library action text, optional panel action text). ⟳ re-propagates when persisted; summary/\n  override/save updated. Backup/import/reset round-trip actLibrary (new reset checkbox). Verified live.\n- **Request (author):** \"I'd like to have a library of action prompts as well, working with the same options\n  as the ones for characters and locations.\"\n- **Plan:** new library `comicGen.actLibrary` (`{id, name, desc}`) + a 📚 Library tab section for it (+ Add\n  Action Prompt button, name/desc/delete rows, renderLibrary/import/export/reset all extended). Each panel's\n  🎬 Action Prompt section gets an \"Action Library\" dropdown: \"(none)\", \"My Actions\" optgroup, \"＋ New\n  Action…\". Picking a saved action INSERTS its description into the existing freeform action textarea (the\n  textarea stays the source of truth so freeform actions keep working — decision noted); \"＋ New Action…\" runs\n  the same 3-prompt create flow (name, main library desc, panel desc) and inserts the panel desc (or lib\n  desc) as the panel's action. ⟳/✕/summary/persistence all stay driven by the textarea.\n\n### 2026-08-14 — Clarified (NOT a bug): description entered at creation doesn't appear in the panel's slot\n- **Status:** DONE 2026-08-14 (changelog 2026.08.14.5) — the description typed at creation is the LIBRARY\n  description (`entry.desc`, reusable, shown in 📚 Library, woven into every prompt that uses the entry via\n  resolveDesc). The slot's own description field (modifier textarea) is intentionally per-panel and separate.\n  Per the author's clarification, the create flow now asks THREE prompts instead: (1) name, (2) main library\n  description, (3) a PANEL description that fills the placed slot's own description field\n  (`panel-char-extra-i-s` / `panel-loc-extra-i`). Both feed this panel's prompt (library desc + slot desc as\n  the modifier) — deliberately distinct. Brief write-up in src/ISSUES.md.\n\n### 2026-08-14 — Request: move \"New Character / New Location\" into the dropdown (per-slot placement)\n- **Status:** DONE 2026-08-14 (changelog 2026.08.14.4) — the ＋ buttons are gone. Every character slot + the\n  location select now end with a \"＋ New Character…\" / \"＋ New Location…\" option (`__new_char__` / `__new_loc__`).\n  handleGridInput intercepts the special value, reverts the select to 'none' first, then\n  `newPanelLibraryEntry(type, i, s)` (name prompt, optional description prompt) creates the entry in the\n  library and places it in THAT slot (s), updates summary/override/save, and re-propagates ⟳ chains if that\n  line is persisted. Guards in propagateSlot/propagateLoc skip the special values so they never reach syncState.\n  Verified live (picked option from a slot dropdown with stubbed prompt → entry created, placed in that slot).\n\n### 2026-08-14 — Request: New Character / New Location buttons should also ask for a description\n- **Status:** DONE 2026-08-14 (changelog 2026.08.14.3) — `newPanelLibraryEntry(type, i)` now runs TWO native\n  prompts: a name (cancel aborts), then an OPTIONAL freeform description (cancel just skips it → desc:'').\n  The description is stored on the library entry `{id, name, desc}` (same field 📚 Library edits) and feeds\n  panel prompts via resolveDesc. Verified live with a stubbed prompt() (name + desc both saved, selected in\n  the panel, summary updated, state restored afterwards).\n\n### 2026-08-14 — Request: in Panel Library, create a new character / location right from a panel, then use it immediately\n- **Status:** DONE 2026-08-14 (changelog 2026.08.14.2) — each panel's 📖 Panel Library → 👤 Characters and\n  📍 Location sections now have a \"＋ New Character\" / \"＋ New Location\" button → `newPanelLibraryEntry(type, i)`\n  (exported on window). It prompts for a name (native prompt(); cancel aborts), adds `{id, name, desc:''}` to\n  comicGen.charLibrary / comicGen.locLibrary, re-renders the library tab + all panel dropdowns\n  (renderLibrary + updatePanelSelects), then immediately SELECTS the new entry in that panel (char → first\n  empty slot else slot 1; loc → the location slot), refreshes the panel summary, clears the panel prompt\n  override, and saves. Buttons are in buildPanelGrid markup, so single-panel view (reuses the same card DOM)\n  gets them too. Verified live (create char + loc, both selected immediately, persisted to localStorage).\n- **Request:** The 👤 Characters and 📍 Location sections of each panel's 📖 Panel Library should offer a way\n  to CREATE a new character / location. After creating it, the new entry must be selected/used in THAT panel\n  immediately (dropdown repopulates, value set, modifier maybe left empty). The new entry must also persist\n  to the normal library storage (comicGen.charLibrary / comicGen.locLibrary) so it appears everywhere.\n\n### 2026-08-14 — Fix: on load, highlighted menu button didn't match the open menu (default state = all closed)\n- **Status:** DONE 2026-08-14 (changelog 2026.08.14.1) — the app now ALWAYS starts with every menu group\n  closed and no menu button highlighted. initMenu() hides all .menu-group's + strips .active from all\n  .menu-btn's (no auto-restore of 'comicGen.activeMenu' on load; switchMenu still writes it for import-time\n  restore). Also added the missing `hidden` to menuGroup-file so nothing flashes before initMenu runs. Root\n  cause: old initMenu opened only the saved group and never hid the others (the File group was HTML-visible\n  by default), so a saved 'help' left Help highlighted while File stayed open. Full write-up in src/ISSUES.md.\n\n### 2026-08-14 — Fix: manual \"↗ Open in new tab\" → \"No src manifest available for this page\"\n- **Status:** DONE 2026-08-14 — top-level navigation to a `src/` asset is NOT supported in this\n  environment: the perchance service worker only holds \"src manifest\" state for the app page itself, so\n  `window.open(location.origin + '/src/user-manual.html')` (the absolute URL the previous fix computed)\n  opened a tab showing \"No src manifest available for this page (service worker had no state for the client)\".\n  Since the in-app overlay reader works reliably, the \"↗ Open in new tab\" button and `openUserManualTab()`\n  were REMOVED — the manual now opens ONLY in the in-app reader. Full write-up in src/ISSUES.md (2026-08-14,\n  second entry). No changelog version (folded into the 2026.08.13.10 entry, same as the 404 fix).\n\n### 2026-08-14 — Fix: 📖 Open User Manual 404 (\"Cannot GET /src/user-manual.html\")\n- **Status:** DONE 2026-08-14 — manual now opens in an in-app overlay (`#manualOverlay` + `\u003ciframe#manualFrame>`\n  srcdoc from `fetch('src/user-manual.html')`), with a secondary new-tab button using the corrected URL\n  `location.origin + '/src/user-manual.html'`. Root cause: Perchance's injected `\u003cbase>` makes relative URLs\n  resolve against `perchance.org/\u003cname>`, which 404s top-level `/src/...`. Full write-up in src/ISSUES.md.\n  (The secondary new-tab button was later removed — see the entry above.)\n\n### 2026-08-13 — Ship the HTML design doc as an in-project user manual\n- **Status:** DONE 2026-08-14 (changelog 2026.08.13.10) — `src/user-manual.html` (copy of the styled design\n  doc, footer updated to v2026.08.13.10 + snapshot caveat) + Help menu panel with 📖 Open User Manual →\n  `openUserManual()` (window.open relative URL). Note: the manual is a SNAPSHOT — keep it roughly current\n  when major features land (regenerate from the design doc / markdown or hand-edit), since it ships with the app.\n\n### 2026-08-13 — Design document (markdown + styled HTML) delivered\n- **Status:** DONE 2026-08-14 — user-facing doc written from the code + AI-NOTES, both versions handed over\n  via attach_file (also kept at `scratch/design/` for this session). Docs-only; no changelog entry.\n  Note: `src/AI-NOTES.md` remains the AI-facing architecture reference; the design doc is the human one.\n\n### 2026-08-13 — ■ Stop button active during ANY generation\n- **Status:** DONE 2026-08-13 (changelog 2026.08.13.9) — `syncStopButton()` =\n  `setStopButtonEnabled(inFlightGen.size > 0 || generateAllRunning)` wired into renderPanelSlot (register +\n  finally), generateComicPage finally, haltGenerations, stopAllGenerations, visibilitychange, and the three\n  clear functions. Verified live: enables within ~200ms of a single-panel run starting, disables after stop/done.\n\n### 2026-08-13 — Per-image Open/Save/Clear/Protect/Cover buttons back under each image\n- **Status:** DONE 2026-08-13 (changelog 2026.08.13.9) — the `slotbtns-panel-N-K` rows moved out of the\n  collapsed 🖼 Image Controls accordion into each `.panel-img-slot` (after the image box); the accordion was\n  removed; buttons are icon-only chips (↗ ⬇ ✕ 🔓/🔒 ⭐) and `setSlotProtected` now toggles '🔒'/'🔓'.\n  Same ids, so all JS selectors still work. Verified live (96 rows under the 24×4 slots).\n\n### 2026-08-13 — Show/Hide Menus button (single button does both)\n- **Status:** DONE 2026-08-13 (changelog 2026.08.13.9) — static label \"Show/Hide Menus\"; click →\n  `togglePanelMenus(i)` (any `.panel-acc` open ⇒ collapse all, else open all). Verified live.\n\n### 2026-08-13 — ⟳ propagate Location + Action Prompt to later panels (cap at next page's panel 1); add per-line Delete buttons\n- **Status:** DONE 2026-08-13 (changelog 2026.08.13.8). Delete-button chain decision made: ✕ also unchecks the\n  line's ⟳ checkbox and clears its syncState/carry chain entries (delete = full line reset).\n- **Request:**\n  - In the panel menus, give 📍 Location and 🎬 Panel Action Prompt the SAME ⟳ persist checkbox the\n    character entries have, so checking it propagates that panel's location (incl. the location modifier)\n    / action prompt to the later panels too.\n  - Character propagation (and the new location/action propagation) should extend NO FURTHER than\n    panel 1 of the NEXT page, if a next page exists (same-page panels + next page's first panel, then stop).\n  - Add a small DELETE button next to each character line, and next to the Location and the Panel Action\n    Prompt lines. Pressing it clears that line:\n    1. Characters → set select to \"No Character Selected\" (value `none`) and clear that character's\n       modifier text (`#panel-char-extra-N-S`).\n    2. Location → set select to \"No Location Selected\" (value `none`) and clear the location modifier\n       (`#panel-loc-extra-N`).\n    3. Panel Action Prompt → clear the prompt entry (`#panel-act-N`).\n- **Notes / current behavior:**\n  - Character ⟳ propagation already exists: `.persist-check[data-s]` in each char slot →\n    `isPersisted(i,s)` → `propagateSlot(i,s)` (copies sel+extra to panels i+1..24 of the CURRENT page via\n    per-page `syncState['i-s'] = {sel, extra}`; a `stillInSync` check skips later panels the user has\n    diverged from the chain).\n  - Location (`panel-loc-select-N` / `panel-loc-extra-N`) and action (`panel-act-N`) currently have NO\n    persist flag and NO propagation.\n  - The `none` dropdown options exist and read exactly \"No Character Selected\" / \"No Location Selected\"\n    (no brackets); `handleGridInput` already clears a char's extra field when its select flips to `none`,\n    and the same pattern applies to `panel-loc-select-N` → `panel-loc-extra-N`. `schedulePanelSave()`\n    persists after grid edits; `updatePanelSummary(i)` must be refreshed after any delete-button click so\n    the `.panel-summary` line stays in sync. Decide (and note) whether the Delete button also unchecks the\n    line's ⟳ persist checkbox / clears the chain (`syncState` / `stillInSync`).\n  - Pages: `currentPage` + `panelState.pages` + `pageSession`; each page has its own 24-card grid\n    (`loadCurrentPage` → `buildPanelGrid`). The NEXT page's panel 1 is NOT in the DOM until you switch to\n    it, so cross-page propagation must buffer the value (e.g. in page/session state) and apply it when the\n    next page loads.\n  - Suggested implementation order: (1) extend the panel model + persistence with `persistLoc`/`persistAct`\n    flags (collect/restore/export/import/reset), add the ⟳ checkboxes to the Location and Action rows, and\n    wire them to same-page propagation; (2) add the cross-page panel-1 propagation (buffer on page switch,\n    apply on page load); (3) add the Delete buttons (a small × next to each char line, the Location, and the\n    Action Prompt) with the clear behaviors above. Keep character propagation behavior consistent.\n\n### 2026-08-13 — Stop Generation button: improve discoverability (author couldn't find it)\n- **Status:** DONE 2026-08-13 (changelog 2026.08.13.7) — implemented as a single GLOBAL ■ Stop button next\n  to the ⚡ button, always visible, enabled while a Generate All run is active.\n- **Request:** The per-panel ■ Stop Generation button EXISTS and works (24 × `.btn-view.btn-stop` →\n  `haltGenerations()`, verified live 2026-08-13) but is `hidden` unless a ⚡ Generate All Panels On Page run is\n  active (`setStopButtonsVisible`), so the author couldn't see it in normal use. Pick/implement a more\n  discoverable presentation — e.g. always visible (disabled when nothing is running), or a single global\n  ■ Stop in the Generate bar (`#gen-actions`), while keeping it functional during runs.\n- **Notes / current behavior:** hidden-by-default design (changelog 2026.08.13.2 / 2026.08.13.4);\n  `setStopButtonsVisible(visible)` toggles all; `haltGenerations()` sets `stopRequested`, stops in-flight\n  gens, marks boxes `.stopped`. If \"always visible\" is chosen, the touch points are the `hidden` attribute,\n  `setStopButtonsVisible`, and the `.stopped` reset paths.\n\u003c/script>\n\u003cscript type=\"text/plain\" id=\"embeddedAINOTES\">\n# AI-NOTES — Living Architecture Doc for the AI Worker\n\nThis file is the AI worker's persistent memory of how the Yet Another Comic Book Page Generator works,\nso it never has to re-analyze the whole codebase from scratch.\n\n**MAINTENANCE RULE (author-mandated): update this file at the END of every operation.**\nEvery change session must also (existing rules): add a dev-note block to the top-of-file\ncomment in `index.html`, prepend a CHANGELOG entry in `src/CHANGELOG.md`, and update `src/ISSUES.md`\nwhen diagnosing/resolving a bug. **LOG EVERY REQUEST FIRST (author-mandated 2026-08-13): before\nstarting ANY work on an author request, add a date-stamped entry to `src/PENDING.md` — requests the\nauthor has greenlit go into the 🟢 START NOW section, everything awaiting \"go ahead\" into the 🕒\nQUEUED section.** When a feature is implemented, move it to ✅ DONE with the changelog version. Keep\nthose in sync with this doc.\n\n**STANDING DIRECTIVE (author-mandated 2026-08-15): BACK UP TO GITHUB ON EVERY \"PRESS SAVE\" REMINDER.**\nUntil the author says otherwise, whenever a task finishes with the usual \"press Save\" reminder, ALSO\nrun the GitHub backup in the same turn (it uses the saved owner/repo/token via `ghPush()` —\n`openGhBackup()` first to load the inputs, then `ghPush()`, then `ghClose()`) so the shipped code and\nthe GitHub history stay in lockstep. The backup is cheap and push-button-free (AI-only), so just do\nit every time — no need to ask.\n\nNot referenced by any app code — documentation only. Lives in `src/` so it persists across\nsessions (the ONLY durable places are `main.pjs`, `index.html`, and `src/`; everything else,\nincl. `scratch/`, is wiped between sessions). Note: because `src/` ships publicly, this file\nis publicly viewable (like `src/ISSUES.md`); if the author ever needs it fully private it can\nonly live ephemerally or inside `index.html`'s comment block.\n\n---\n\n## 1. Big picture\n\n- A single-page Perchance generator: user fills in panel details (characters, location,\n  action), clicks **⚡ GENERATE ALL PANELS ON PAGE**, and the text-to-image-plugin renders each panel\n  into 1–4 comic-book-style images. Pages, style presets, prompt overrides, and project\n  backup/restore are the major feature areas.\n- **File layout**\n  - `main.pjs` — tiny pjs file: `title`, `generateImage = {import:text-to-image-plugin}`,\n    `characters` list (none/hero/villain/sidekick/civilian), `locations` list\n    (none/city/lab/hideout/rooftop). Loaded before `index.html`; top-level names become\n    globals (`root.characters`, `root.locations`, `root.generateImage`).\n  - `index.html` — the ENTIRE app. Top = giant HTML comment of dev notes (read before\n    editing; newest entries near the top). Then `\u003cstyle>`, then the body markup, then\n    then ONE big IIFE `\u003cscript>` with all logic.\n  - `src/CHANGELOG.md` — version history for Help > About (newest first; the About panel fetches and\n    parses it at runtime via `renderChangelog()`).\n  - `src/user-manual.html` — the shipped USER MANUAL (static standalone HTML, no perchance deps; opens in an\n    in-app overlay via Help → 📖 Open User Manual → `openUserManual()`: fetch → `\u003ciframe#manualFrame>` srcdoc).\n    This is the ONLY way to open it — NEVER `window.open`/anchor to a `src/` asset: (a) a plain relative URL\n    resolves against Perchance's injected `\u003cbase href=\"https://perchance.org/\u003cname>\">` and 404s on\n    perchance.org, and (b) even the absolute `location.origin + '/src/user-manual.html'` is refused by the\n    service worker (\"No src manifest available for this page\" — top-level `src/` navigation is unsupported).\n    See src/ISSUES.md 2026-08-14 (both entries). A snapshot doc — footer notes it may lag Help → About.\n  - `src/PENDING.md` — open feature-request queue (newest first; read before planning new work; implement\n    only when the author says \"go ahead\").\n  - `src/ISSUES.md` — issue log, newest first. **GREP before diagnosing anything.**\n  - `src/AI-NOTES.md` — this file.\n- **Execution order caveat:** the Perchance engine evaluates the whole template (all pjs /\n  square blocks) BEFORE any body `\u003cscript>` runs. The app IIFE therefore runs last.\n\n## 2. Boot / init sequence (bottom of the IIFE)\n\n1. `migrateLibObjects()` (merge legacy charLibrary/locLibrary/actLibrary into `comicGen.libObjects`,\n   then delete the legacy keys), `renderLibrary()`\n2. `initPresets()` — populate `#presetStyle`/`#presetPalette` from `ART_STYLES`/`COLOR_PALETTES`\n3. `updateResetControls()`\n4. `initKeywords()` — globalPos/globalNeg/nsfw listeners + keyword chips\n5. `initMenu()` — `setupMenuCollapse()` wraps each menu panel body in `.menu-collapse-body`;\n   opens the saved active menu group\n6. `applyLayoutMode(savedLayout)` — `body.side-mode` class\n7. `applyMenuVisible(savedMenuVisible)`\n8. `applyPanelsVisible(savedPanelsVisible)`\n9. `initHeaderObserver()` — `refreshHdrOffscreen()` toggles `body.hdr-offscreen` (scroll/resize)\n10. `buildPanelGrid()` — builds all 24 panel cards; internally calls `updatePanelSelects()`,\n    `updatePanelVisibility()`, `restorePanelState()` (restores saved DOM values)\n11. `populatePageSel()`, `updateDeletePageBtn()`, `updateProjectNameDisplay()`,\n    `renderChangelog()`\n12. seed + preview listeners; `restoreSaveState()` (IndexedDB save handle)\n\n## 3. Data & persistence model\n\n**localStorage keys**\n- `comicGen.panelState` — versioned `{version:2, projectName, imageSizeSel/W/H, guidanceScale,\n  previewDelay, previewOn, globalPos, globalNeg, nsfw, currentPage, pages:{N: pageData}}`.\n  pageData = `{name, panelCountSel, panelCountCustom, seed, 1..24: panelEntry}`.\n  panelEntry = `{chars:[{sel,extra}]x3, title, protectSlots:[bool x4], loc, locExtra, action, seed,\n  imgCount, style, promptOverride, extras:[{type, sel, desc}]}` (2026-08-15.1 — `extras` holds arbitrary\n  additional objects of any library type, created via the 🧩 Panel Objects add bar). The ⟳ persist flags\n  (`chars[].persist`, `locPersist`, `actPersist`) were REMOVED 2026-08-16 (changelog 2026.08.16.11) — old\n  saved entries may still carry them but they are ignored. v1 flat data auto-migrates via `ensurePages()`.\n- `comicGen.libObjects` — unified Panel Library Objects store `[{id, type, name, desc}]` where `type`\n  is a LABEL ('Character'/'Location'/'Action' or custom via \"＋ New Type…\") deciding which panel\n  dropdown the object appears in (2026-08-14.7). Replaces the three legacy keys\n  `comicGen.charLibrary`/`locLibrary`/`actLibrary` (migrated + deleted by `migrateLibObjects()` at boot\n  and on import). `comicGen.libTypes` — custom type labels.\n- `comicGen.preset` — `{style, palette}`\n- `comicGen.activeMenu`, `comicGen.layoutMode`, `comicGen.menuVisible`,\n  `comicGen.panelsVisible` — UI prefs ('1'/'0' for the toggles)\n- `comicGen.hidePasswordPref` — '1'/'0': require the (session-only) panels password (2026-08-14.7)\n\n**IndexedDB** `comicGenSaveState` — `{handle, name}` (File System Access handle for 💾 Save…)\n\n**Session-only (in memory, per page)** — NOT persisted, wiped on reload:\n- `pageSession[N] = {images}`; current page's live ref is `panelImages`\n- `panelImages[i][k-1]` = data URL of slot k of panel i\n- `panelPromptOverrides[i] = {pos, neg}` — 📝 Prompt override\n- accordion open/closed state (`.panel-acc[data-collapsed]`), `.stopped`/`.paused` boxes\n- (The ⟳ persist chains `syncState['i-s']`/`'i-loc'`/`'i-act'` and the cross-page carry\n  `carryNext[page]` were REMOVED 2026-08-16 (changelog 2026.08.16.11) — replaced by the per-row ⇤\n  copy-from-previous-panel button `copyFromPrevPanel(i, kind, s)`, which copies the corresponding\n  char/location/action from panel i−1 on demand. No auto-propagation or cross-page carry exists anymore.)\n\n**Save pipeline:** grid `input`/`change` events → `handleGridInput(e)` + `schedulePanelSave()`\n(debounced 250ms) → `collectPanelState()` → localStorage. `collectPageData()` reads the live DOM\nfor the current page. Import/export round-trips `buildExportData(includeProtection)` /\n`applyImportedSettings()`.\n\n## 4. Key module state (top of IIFE)\n\n- `panelBusy[i]` — per-panel re-entrancy guard\n- `inFlightGen` — `Map(pendingPromise → {i,k})` of active generations\n- `pausedByVisibility`, `stopRequested`, `generateAllRunning` — pause/stop flags\n- `currentPage` + `pageSession` — multi-page model\n- `imgObserver` (IntersectionObserver) — evicts/restores `\u003cimg>` srcs\n- `gridHasListeners` — grid listeners attached once\n- `panelImages`, `panelPromptOverrides`, `panelSaveTimer`\n- `mapsPromise` — cached `getMaps()` (charMap/locMap from `root.characters`/`root.locations`)\n\n## 5. DOM structure of a panel card (built by `buildPanelGrid`)\n\nCard: `#panel-card-N.panel-card` (display toggled by `updatePanelVisibility()` based on\n`getPanelCount()`, 1–24).\n\n- **Header row:** `Panel N` title, `#panel-title-N` (display-only, never in prompt),\n  Images select `#panel-img-count-N` (1–4), Style select `#panel-style-N`\n  ([Default (Global)] + ART_STYLES), ⇅ Move `#reorder-btn-N` + hidden picker `#panel-reorder-N`.\n  Below it: `.panel-summary` line (`.ps-char` / `.ps-loc` / `.ps-act`) refreshed by `updatePanelSummary(i)`\n  (reads char/loc selects + action; action ellipsizes when too long).\n- **.panel-imgs grid:** four slots `#imgslot-panel-N-K` (hidden beyond imgCount; the SLOT is\n  hidden, not the box), each containing:\n  - `.slot-reroll` > `.btn-img-reroll` (per-image 🔄 Generate, `generateSinglePanelSlot`)\n  - `.panel-img-box#imgbox-panel-N-K` > `img#img-panel-N-K` (`.rep` = representative ⭐,\n    `.generating`/`.failed`/`.paused`/`.stopped`/`.cleared`/`.protected` states)\n  - `.slot-btns#slotbtns-panel-N-K` INSIDE each `.panel-img-slot` (after `.panel-img-box`) — 5 icon chips:\n    ↗ open / ⬇ save / ✕ clear / 🔓🔒 protect (`.btn-img-protect.active`, text set to '🔒'/'🔓' by\n    `setSlotProtected`) / ⭐ cover (`makeRepresentative`). (Moved back here 2026-08-13.9 from the old\n    🖼 Image Controls accordion, which was removed.)\n- **Action row (.panel-header-btns):** `Show/Hide Menus` (.btn-view.menu-show → `togglePanelMenus(i)`,\n  static label; opens all of the panel's `.panel-acc` if none are open, else collapses them all) →\n  🔍 Focus (.btn-view) → 🔄 Generate (.btn-reroll). (■ Stop is NOT per-panel — it's ONE global button in the\n  Generate bar: `#globalStopBtn` in `.gen-actions/.gen-row`, always visible, enabled during ANY generation.)\n- **Four accordions** (`.panel-acc[data-collapsed=\"1\"]` default; toggle via `togglePanelAcc`):\n  1. **🧩 Panel Objects** (2026-08-15.1; replaced the old 📖 Panel Library sub-accordions) — ONE accordion\n     per panel (`#panel-objects-N`, rendered by `renderPanelObjects(i, mode, force)`, mode 'state'|'dom'):\n     ⚠️ warning (too many objects may confuse the image AI; no limit enforced), column headers, one row\n     per object — Type select (same options as the main menu, incl. \"＋ New Type…\") + Identity select\n     (`#panel-char-select-N-S`/`#panel-loc-select-N`/`#panel-act-lib-N`) + Freeform Description\n     (`#panel-char-extra-N-S`/`#panel-loc-extra-N`/`#panel-act-N`) + ⟳ persist (char/loc/act primary rows\n     only) + red ✕ delete. Primary rows REUSE the old ids so handleGridInput/propagate/restore/collect all\n     still work; empty slots render NO row. Arbitrary extra objects live in `panelEntry.extras` and render\n     as `.po-extra-row` with ids `panel-extra-type/sel/desc-N-IDX` (no ⟳, read by collectPageData).\n     Type routing: `onPanelObjTypeChange(i, kind, el)`/`onPanelExtraTypeChange(i, idx, el)` move a row\n     (Character→first empty char slot else extras, Location→loc slot else extras, Action→action box else\n     extras, custom→extras), clearing the source via deletePanelChar/Loc/Act; `ensurePanelObjectRow(i,kind)`\n     creates a missing target row so ⟳ chains/cross-page carry still land on previously-empty slots.\n     Add bar (`#panel-add-select-N`): \"Create new…\" options → `createLibraryEntry(type)` + `routeObject`\n     (auto-places); \"Add from library…\" → `#panel-add-picker-N` (`#panel-add-id-N`+`#panel-add-desc-N`+Add).\n     Picking a library object auto-fills the row's Freeform Description from `entry.desc`; desc-only rows\n     (loc with \"No Location Selected\") survive re-renders.\n  2. **📝 Prompt** — `.btn-prompt` (toggle `#prompt-editor-N` with `#prompt-pos-N`/`#prompt-neg-N`),\n     `.btn-copy-prompt`\n  3. **⚙ Panel** — `Collapse Menu` (.btn-panel-menu), ⧉ Duplicate, ＋ Add Panel,\n     🗑 Clear Images (`.btn-clear-images`, hidden unless ≥2 images), 🗑 Clear, 🗑 Delete,\n     `.panel-acc-stack` > `#panel-seed-N`\n  4. **💾 Files** — ↗ Open All, ⬇ Save All (.zip), ⬇ Export\n- `setPanelImageButtons(i,k,has)` / `updatePanelAllButtons(i)` keep chip disabled/hidden state\n  in sync after every per-slot change (open/save/protect/star need an image; Clear Images needs\n  ≥2).\n\n## 6. Generation flow (the core)\n\n- **`generateComicPage()`** — ⚡ button. Disables `.btn-generate`, sets `stopRequested=false`,\n  `generateAllRunning=true`, `setStopButtonEnabled(true)` (global ■ Stop `#globalStopBtn`). Loops panels 1..total: status\n  \"…generating panels… (i/N)\"; `await generateSinglePanel(i)` counting\n  generated/skipped/protected/error; breaks on `stopRequested` (user Stop) or\n  `pausedByVisibility` (tab backgrounded). Finally: re-enable button, `generateAllRunning=false`,\n  `syncStopButton()` (disables Stop when nothing is in flight).\n- **`generateSinglePanel(i)`** — guards `panelBusy`; resets `pausedByVisibility`; resets\n  `stopRequested` only when NOT inside a Generate All (`if (!generateAllRunning)`).\n  `buildPanelPrompt(i)` → `{fullPrompt, negativePrompt, hasContent}`.\n  - Empty content + no protected images → clears panel, marks card `.skipped`, returns 'skipped'\n  - Empty content + protected images → keeps them, returns 'protected'\n  - All slots protected → 'protected'\n  - Otherwise loops slots 1..imgCount calling `renderPanelSlot` (skips protected slots),\n    returns 'generated'.\n- **`generateSinglePanelSlot(i,k)`** — per-image reroll; same prompt; single `renderPanelSlot`.\n- **`renderPanelSlot(i,k,...)`** — the one place that actually calls the image service:\n  clears box states → `.generating`; builds opts `{prompt, negativePrompt,\n  resolution: pickSourceResolution(size), guidanceScale: parseInt(1–30), seed: seed+(k-1)\n  if seed ≠ -1}`; `pending = root.generateImage(opts)`; registers in `inFlightGen`;\n  `await withTimeout(pending, 120000)`; **must validate `result.dataUrl`** (the plugin returns\n  non-thenable ERROR STRINGS for invalid options — `if (!result || !result.dataUrl) throw`);\n  upscales if target size ≠ source size; `showPanelImage(i,k,dataUrl)`.\n  - catch: if `pausedByVisibility || stopRequested || card/.box .cleared` → return 'cleared'\n    (silent abort); else `pending.stop()`, mark `.failed`, throw.\n  - finally: remove from `inFlightGen`, remove `.generating`.\n- **Prompt building** — `buildPanelPrompt(i)`: positive = `getPanelKeywords(i).positive`\n  (per-panel Style override, or global) + selected char descs + modifiers + loc desc + locExtra +\n  action, comma-joined. `hasContent` = any char/extra, loc, locExtra, or action. A saved\n  `panelPromptOverrides[i]` (from 📝 Prompt editor) completely replaces pos/neg and defines its\n  own hasContent. Typing in any panel content field clears the override\n  (`handleGridInput` → `clearPanelPromptOverride`); global keyword/preset/NSFW changes clear ALL.\n- **Seeds:** `getPanelSeed(i)` = panel `#panel-seed-N` > global `#seedInput` + (i−1) > random(-1).\n  Slot k uses seed + (k−1).\n- **Size:** `getImageSize()` from File menu; `pickSourceResolution` picks the nearest plugin\n  size (512²/512×768/768×512/768²); `upscaleDataUrl` cover-crops + upscales to target\n  (JPEG q0.92) when different.\n- **guidanceScale is WHOLE-NUMBER ONLY** (1–30) — the plugin rejects fractions with an error\n  tile. Always parseInt/round/clamp.\n\n## 7. Pause / stop mechanics\n\n- `pausedByVisibility`: visibilitychange handler stops all in-flight (`.stop()`), marks boxes\n  `.paused` (\"tab went to background\"), deletes slot images, sets status; `generateComicPage`\n  breaks the loop.\n- **■ Stop button** (global, `#globalStopBtn` next to ⚡, always visible): `syncStopButton()` =\n  `setStopButtonEnabled(inFlightGen.size > 0 || generateAllRunning)` — so it's ACTIVE during ANY generation\n  (⚡ batch, single panel, single-slot reroll), not just Generate All (2026-08-13.9). Called from:\n  `renderPanelSlot` (on `inFlightGen.set` → enable, and in finally → sync), `generateComicPage` finally,\n  `haltGenerations`, `stopAllGenerations`, the visibilitychange handler, and the three clear functions.\n  `haltGenerations()` (exported) sets `stopRequested=true`, stops all in-flight, marks boxes `.stopped`\n  (\"Stopped — generation cancelled.\"), deletes those slot images, sets status. The abort propagates: catch →\n  'cleared' → generateSinglePanel returns early → loop breaks → finally restores UI.\n- `stopAllGenerations()` (used by page-switch/delete/resequence) marks `.paused`, NOT `.stopped`.\n- `'cleared'` card/box class also aborts in-flight renders silently (used by clear/resequence/\n  duplicate/delete paths).\n- The `stopped` class is cleared wherever box states are reset (reroll, clears, reset).\n\n## 8. Menu & layout system\n\n- `.menu-frame` = sticky top bar (top mode) or left column (`body.side-mode`, landscape only).\n  Contains `.menu-scroll` (the accordion groups) + `.gen-actions` (⚡ button + `#statusEl`).\n- `switchMenu(name)` — one `.menu-group` open at a time (File/Edit/Library/Help), choice\n  persisted; sections start collapsed via `collapseGroupPanels`.\n- **Toggles** (all persist independently):\n  - `body.menu-hidden` — hides ONLY `.menu-scroll`; the Generate bar stays visible\n    (`body.menu-hidden .menu-frame {max-height:none}`; side mode: `flex:0 0 auto; width:auto`).\n    Floating `#menuRevealBtn` (☰) appears when header offscreen; bottom-LEFT when menu hidden,\n    bottom-RIGHT when open.\n  - `body.panels-hidden` — hides `.canvas-frame` (all panel cards) via ▧ Hide/Show Panels header\n    button. Generation is UNAFFECTED (writes to `panelImages`; the imgObserver just evicts\n    srcs while hidden and restores on show).\n  - `body.side-mode` — ▤ Menu: Top/Side header button.\n- Header buttons (upper-left): ▦ Storyboard, ☰ Hide/Show Menu, ▤ Menu: Side, ▧ Hide/Show Panels.\n\n## 9. Image handling\n\n- **Eviction/restore:** `imgObserver` (IntersectionObserver, rootMargin 400px) removes\n  off-screen `img.src` (keeps data URL in `panelImages`), restores on re-entry. Memory\n  hardening for mobile. `showPanelImage` is the ONLY correct way to display a new image.\n- **Hover/long-press preview:** fixed `#imgPreview` overlay; desktop hover + mobile long-press\n  (~`#previewDelayInput` ms, cancelled on >12px drag); toggled by `#previewEnabledCheck`;\n  reads final data URL from `panelImages` via `imgbox-panel-N-K` id regex. `previewEnabled()`\n  gates both triggers.\n- **Protect:** per-slot 🔓/🔒 chips; `protectSlots` persisted; dormant-persistent across\n  reloads (images are session-only); `generateSinglePanelSlot` refuses protected slots,\n  `generateSinglePanel` keeps them; clears unprotect. `makeRepresentative` swaps slot 1 + its\n  protect flag (⭐ = representative shown in Storyboard).\n\n## 10. Pages, view modes, library, changelog\n\n- **Pages:** `currentPage`, `panelState.pages`, `pageSession`. switchPage saves old page DOM +\n  session, reloads new page (buildPanelGrid). addPage/deletePage; deleting the LAST panel of\n  the ONLY page → `resetEverything(true)` (confirm-gated). Page selector labels from page\n  names.\n- **View modes:** `#singleOverlay` (🔍 Focus moves the ACTUAL card into `#singleStage`,\n  navigation via list/dropdown/prev-next/arrows/Esc) and `#storyboardOverlay` (▦ button →\n  `.sb-cell` per panel from representative image, placeholders for empty).\n- **Library:** ONE `comicGen.libObjects` store (2026-08-14.7): entries `{id, type, name, desc}` where\n  `type` is a label ('Character'/'Location'/'Action'/custom); panel dropdowns list precreated options\n  (minus \"none\") + optgroup of saved objects matching the dropdown's type + \"No Character Selected\" LAST\n  (chars only). 📚 Library menu shows every object with a per-row Type select (incl. \"＋ New Type…\").\n- **Changelog:** `src/CHANGELOG.md` (newest first, format `## \u003cver> — \u003cdate> — \u003ctitle>` + `- item`\n  bullets). The About panel's async `renderChangelog()` fetches it at runtime and parses it (gracefully\n  empty on failure). Versions `YYYY.MM.DD.R`. Prepending an entry is a CHANGELOG.md change (+ a matching\n  dev-note block in index.html).\n\n## 11. Export / import / save\n\n- `exportSettings()` — versioned JSON (all pages' settings) via `buildExportData(includeProtection)`.\n  JSON-only paths (exportSettings, settingsBlob → saveSettings/saveSettingsAs/confirmImportSave/\n  confirmNewProjectSave) pass `false` → `protectSlots` is STRIPPED from every exported panel entry\n  (image protection is session-only and shouldn't imply anything about exported files); `exportZip()`\n  passes `true` → the zip keeps protections so a backup/restore round-trip preserves them (2026-08-15.1).\n  Import is unchanged (nukes protections then applies).\n- `exportZip()` — settings JSON + every page's session images into one .zip\n  (self-contained STORE writer; DEFLATE via DecompressionStream on import).\n- `importSettingsFromFile()` — `hasActiveProject()` gate → three-choice modal\n  (Save&Import / Continue / Cancel); import \"nukes\" protections + clears all sessions first;\n  `applyImportedSettings` restores settings, libraries (BEFORE restorePanelState so lib-backed\n  selections round-trip), layout, menuVisible/panelsVisible.\n- `saveSettings()` (silent, remembered handle) / `saveSettingsAs()` — File System Access API\n  with download fallback; handle+name in IndexedDB.\n\n## 12. Conventions & gotchas (read before editing)\n\n- Everything is inside the IIFE; only `window.X = X` exports are reachable from inline\n  handlers/evals. Export what a test needs.\n- id suffixes: `El`/`Btn`/`Ctn`/`Input` (e.g. `statusEl`, `rerollBtn`). Use the `hidden`\n  attribute (wins over inline styles). `body` is text-align:center by defaul
