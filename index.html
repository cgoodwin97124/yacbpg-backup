ext-6); }\n.accent-swatch.active { border-color: var(--text); box-shadow:0 0 0 2px var(--accent); }\n.accent-custom { display:inline-flex; align-items:center; gap:4px; margin-left:4px; }\n#themeAccentInput { width:36px; height:26px; padding:0; border:2px solid var(--border); border-radius:6px; background:none; cursor:pointer; }\n\n/* LIGHT-READABILITY: single-class coloured chips lose their colour to normalize.css (`button:not([disabled]) { color: inherit }`),\n   so in light mode they are pinned explicitly here (higher specificity: :root[data-theme] / :root:not([data-theme]) + class). */\n:root[data-theme=\"light\"] .btn-line-del,\n:root[data-theme=\"light\"] .btn-reroll,\n:root[data-theme=\"light\"] .btn-img-clear,\n:root[data-theme=\"light\"] .btn-img-reroll,\n:root[data-theme=\"light\"] .btn-stop-global,\n:root[data-theme=\"light\"] .btn-del-lib,\n:root[data-theme=\"light\"] .btn-danger,\n:root[data-theme=\"light\"] .btn-copy,\n:root[data-theme=\"light\"] .btn-copy-prompt,\n:root[data-theme=\"light\"] .btn-copy-prev:not(:disabled) { color: #fff; }\n:root[data-theme=\"light\"] .btn-reorder:not(.active) { color: var(--text); }\n@media (prefers-color-scheme: light) {\n:root:not([data-theme]) .btn-line-del,\n:root:not([data-theme]) .btn-reroll,\n:root:not([data-theme]) .btn-img-clear,\n:root:not([data-theme]) .btn-img-reroll,\n:root:not([data-theme]) .btn-stop-global,\n:root:not([data-theme]) .btn-del-lib,\n:root:not([data-theme]) .btn-danger,\n:root:not([data-theme]) .btn-copy,\n:root:not([data-theme]) .btn-copy-prompt,\n:root:not([data-theme]) .btn-copy-prev:not(:disabled) { color: #fff; }\n:root:not([data-theme]) .btn-reorder:not(.active) { color: var(--text); }\n}\n\u003c/style>\n\n\u003cdiv class=\"app-header\" id=\"appHeader\">\n  \u003cdiv class=\"header-btns\" style=\"display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-start; max-width:100%;\">\n    \u003cbutton class=\"storyboard-toggle\" onclick=\"openStoryboard()\" title=\"Show all panel images as a comic page/storyboard\">▦ Storyboard\u003c/button>\n    \u003cbutton class=\"menu-toggle\" id=\"menuToggleBtn\" onclick=\"toggleMenu()\" title=\"Show or hide the menu panel\">☰ Hide Menu\u003c/button>\n    \u003cbutton class=\"layout-toggle\" id=\"layoutToggleBtn\" onclick=\"toggleLayout()\" title=\"Move the menu to the top or to the side of the screen\">▤ Menu: Side\u003c/button>\n    \u003cbutton class=\"menu-fs-toggle\" id=\"menuFullscreenBtn\" onclick=\"toggleMenuFullscreen()\" title=\"Show the whole menu in a full-screen overlay\">⛶ Full Screen\u003c/button>\n    \u003cspan class=\"hdr-gen-ctr\" id=\"hdrGenCtr\" hidden>\u003c/span>\n  \u003c/div>\n  \u003cdiv style=\"flex:1 1 auto; min-width:0;\">\n    \u003ch1>Yet Another Comic Book Page Generator\u003c/h1>\n    \u003cdiv class=\"project-name\" id=\"projectNameEl\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cbutton id=\"panelsToggleBtn\" onclick=\"togglePanels()\" title=\"Show or hide all panel cards\">▧ Hide Panels\u003c/button>\n\u003cdiv id=\"pageNav\" hidden>\n  \u003cbutton class=\"page-nav-btn\" onclick=\"pageNavDelta(-1)\" title=\"Previous page\">◀\u003c/button>\n  \u003cdiv class=\"page-nav-pages\" id=\"pageNavPages\">\u003c/div>\n  \u003cbutton class=\"page-nav-btn\" onclick=\"pageNavDelta(1)\" title=\"Next page\">▶\u003c/button>\n\u003c/div>\n\u003cdiv class=\"page-layout\">\n  \u003cdiv class=\"menu-frame\" id=\"menuFrame\">\n    \u003cdiv class=\"menu-scroll\">\n      \u003cdiv class=\"menu-bar\" id=\"menuBar\">\n        \u003cbutton class=\"menu-btn\" data-menu=\"file\" onclick=\"switchMenu('file')\">📄 File\u003c/button>\n        \u003cbutton class=\"menu-btn\" data-menu=\"edit\" onclick=\"switchMenu('edit')\">🎨 Edit\u003c/button>\n        \u003cbutton class=\"menu-btn\" data-menu=\"library\" onclick=\"switchMenu('library')\">📚 Library\u003c/button>\n        \u003cbutton class=\"menu-btn\" data-menu=\"help\" onclick=\"switchMenu('help')\">❓ Help\u003c/button>\n        \u003cbutton class=\"menu-btn menu-action\" id=\"menuGenerateBtn\" onclick=\"generateComicPage()\" title=\"Generate every panel on this page\">⚡ Generate All\u003c/button>\n        \u003cbutton class=\"menu-btn menu-action\" id=\"globalPauseBtn\" onclick=\"pauseGenerations()\" title=\"Pause the run — press ⚡ Generate All to continue where you left off\" disabled>⏸ Pause\u003c/button>\n        \u003cbutton class=\"menu-btn menu-stop\" id=\"globalStopBtn\" onclick=\"haltGenerations()\" title=\"Cancel the running ⚡ Generate All run\" disabled>■ Stop\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"menu-group\" id=\"menuGroup-file\" hidden>\n        \u003cdiv class=\"config-panel\">\n          \u003cdiv class=\"config-header\">\u003ch2>Project\u003c/h2>\u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Project Name (optional):\u003c/label>\n            \u003cinput id=\"projectNameInput\" type=\"text\" placeholder=\"e.g. Neon Nights — Issue 1\" oninput=\"onProjectNameInput()\">\n            \u003cdiv class=\"lib-hint\">Names this project, shows at the top of the page, and is used as the default export/save filename. Stored in your settings backup like everything else.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Storyboard:\u003c/label>\n            \u003cdiv class=\"chip-row\">\n              \u003cbutton class=\"btn-add-lib\" style=\"background:var(--green);color:var(--ink);\" onclick=\"openStoryboard()\" title=\"Temporarily hide the whole UI and show every panel of the current page as a comic-page grid\">▦ Storyboard View\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"lib-hint\">Show every panel of the current page as a comic-page grid (the same view as the ▦ Storyboard button at the top of the page). Click ← Back to page to return.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Backup Project:\u003c/label>\n            \u003cdiv class=\"chip-row\">\n              \u003cbutton class=\"btn-add-lib\" onclick=\"saveSettings()\" title=\"Save settings to the current file without asking (remembers the file you chose with Save as…)\">💾 Save…\u003c/button>\n              \u003cbutton class=\"btn-add-lib\" onclick=\"saveSettingsAs()\" title=\"Pick a path and filename, and confirm before overwriting an existing file\">💾 Save as…\u003c/button>\n              \u003cbutton class=\"btn-add-lib\" style=\"background:var(--green);color:var(--ink);\" onclick=\"exportZip()\" title=\"Download the project (settings + every generated panel image across all pages) as a .zip file\">⬇ Export Project (.zip)\u003c/button>\n              \u003cbutton class=\"btn-add-lib\" style=\"background:var(--purple);color:var(--on-purple);\" onclick=\"document.getElementById('importSettingsInput').click()\" title=\"Restore from a settings .json file, or a full project .zip (settings + images)\">⬆ Import Project (.json / .zip)\u003c/button>\n              \u003cbutton class=\"btn-add-lib\" style=\"background:var(--blue);color:#fff;\" onclick=\"openGhBackup()\" title=\"Push this generator's source (main.pjs, index.html, src, docs) to a GitHub repository as version history\">⬆ Backup to GitHub…\u003c/button>\n              \u003cbutton class=\"btn-add-lib\" style=\"background:var(--accent);color:var(--ink);\" onclick=\"newProject()\" title=\"Start a fresh project — backs up the current one first (optional), resets to defaults, then lets you name the new project\">📄 New Project\u003c/button>\n            \u003c/div>\n            \u003cinput type=\"file\" id=\"importSettingsInput\" accept=\".json,.zip,application/json,application/zip,application/x-zip-compressed,application/octet-stream\" onchange=\"importSettingsFromFile(event)\" hidden>\n            \u003cdiv id=\"backupStatusEl\" class=\"lib-hint\" style=\"margin-top:6px;\">💾 Save… never asks: it silently overwrites the file you chose with Save as… (remembered even after a reload), or downloads to the default name if you haven't chosen one yet. 💾 Save as… lets you choose a new path/filename and confirms before overwriting. \"Export Project (.zip)\" bundles the settings JSON plus every generated panel image (all pages) into one .zip. Importing a .json restores settings only; importing a project .zip also repopulates the images (they stay in memory until you reload, like all generated images). Importing replaces the current project — if you have one in progress you'll be asked whether to save it first.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"config-panel\">\n          \u003cdiv class=\"config-header\">\u003ch2>Page Setup\u003c/h2>\u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Page:\u003c/label>\n            \u003cdiv class=\"chip-row\">\n              \u003cselect id=\"pageSel\" onchange=\"switchPage(parseInt(this.value,10))\" style=\"flex:1 1 110px; margin:0;\">\u003c/select>\n              \u003cbutton class=\"btn-add-lib\" onclick=\"addPage()\" title=\"Create a new empty page\">＋ Add Page\u003c/button>\n              \u003cbutton class=\"btn-clear\" id=\"deletePageBtn\" onclick=\"deletePage()\" title=\"Delete the current page (deleting the only page resets the project to defaults)\" style=\"background:var(--red);\" disabled>🗑 Delete Page\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"lib-hint\">Each page has its own panel count, its own seed, and its own panels. Generate, Focus, and Storyboard always act on the current page. Images are remembered per page in memory until you reload.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\" id=\"pageRenumberGroup\" hidden>\n            \u003clabel>Reorder Pages:\u003c/label>\n            \u003cdiv class=\"page-renumber-row\">\n              \u003cbutton class=\"btn-reorder\" id=\"pageRenumberBtn\" onclick=\"togglePageRenumberPicker()\" title=\"Move this page to a different position in the page order\">⇅ Renumber Page\u003c/button>\n              \u003cselect id=\"pageRenumberSel\" class=\"reorder-select\" hidden onchange=\"onPageRenumberSelect(this)\">\u003c/select>\n            \u003c/div>\n            \u003cdiv class=\"lib-hint\">Moves this page to the position you choose and renumbers the other pages — e.g. with pages 1–5, renumbering page 4 to 2 makes the old pages 2 and 3 become 3 and 4. Every page's panels and settings stay with it.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Page Title (optional):\u003c/label>\n            \u003cinput id=\"pageNameInput\" type=\"text\" placeholder=\"e.g. Cover, Page 1, Climax…\" oninput=\"onPageNameInput()\">\n            \u003cdiv class=\"lib-hint\">Names this page — it shows in the page selector, the page navigator, and the Storyboard view. Each page keeps its own title, and a title travels with its page when pages are reordered.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Page Summary (optional):\u003c/label>\n            \u003ctextarea id=\"pageSummaryInput\" rows=\"2\" placeholder=\"A short summary of what happens on this page…\" oninput=\"onPageSummaryInput()\">\u003c/textarea>\n            \u003cdiv class=\"lib-hint\">Optional notes for this page. Shown in the Storyboard view (and kept with the page when pages are reordered), but not used in any image prompt.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Number of Panels on This Page (1–24) — each page remembers its own:\u003c/label>\n            \u003cselect id=\"panelCount\" onchange=\"onPanelCountChange()\">\n              \u003coption value=\"1\">1 Panel\u003c/option>\n              \u003coption value=\"4\" selected>4 Panels (Standard Page)\u003c/option>\n              \u003coption value=\"6\">6 Panels\u003c/option>\n              \u003coption value=\"12\">12 Panels\u003c/option>\n              \u003coption value=\"24\">24 Panels (Full Storyboard)\u003c/option>\n              \u003coption value=\"custom\">Custom…\u003c/option>\n            \u003c/select>\n            \u003cinput id=\"panelCountCustom\" type=\"number\" min=\"1\" max=\"24\" placeholder=\"Enter a number (1–24)\" oninput=\"updatePanelVisibility()\" hidden>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Seed (optional, for reproducibility):\u003c/label>\n            \u003cinput id=\"seedInput\" type=\"text\" placeholder=\"Leave blank for random\">\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Image Size (max 1920×1080):\u003c/label>\n            \u003cselect id=\"imageSizeSel\" onchange=\"onImageSizeChange()\">\n              \u003coption value=\"512x512\">512 × 512\u003c/option>\n              \u003coption value=\"768x768\" selected>768 × 768 (default)\u003c/option>\n              \u003coption value=\"1024x1024\">1024 × 1024\u003c/option>\n              \u003coption value=\"1920x1080\">1920 × 1080 (16:9)\u003c/option>\n              \u003coption value=\"1080x1920\">1080 × 1920 (9:16)\u003c/option>\n              \u003coption value=\"custom\">Custom…\u003c/option>\n            \u003c/select>\n            \u003cdiv id=\"imageSizeCustom\" hidden>\n              \u003cinput id=\"imgSizeW\" type=\"number\" min=\"64\" max=\"1920\" placeholder=\"Width (max 1920)\">\n              \u003cinput id=\"imgSizeH\" type=\"number\" min=\"64\" max=\"1080\" placeholder=\"Height (max 1080)\">\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Prompt Obedience (guidance scale): \u003cspan id=\"guidanceScaleValue\" class=\"guidance-value g-low\">7\u003c/span>\u003c/label>\n            \u003cinput id=\"guidanceScaleInput\" type=\"range\" min=\"1\" max=\"30\" step=\"1\" value=\"7\" oninput=\"onGuidanceScaleChange()\" class=\"guidance-slider\">\n            \u003cdiv class=\"lib-hint\">How literally the AI follows your prompt. Low (1–4) = loose and free; \u003cb>7 = balanced (default)\u003c/b>; higher = very faithful but with \u003cb>diminishing returns\u003c/b> — past ~15 colors oversaturate and halo / text artifacts appear. Shared by every panel on all pages.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Image Count for All Panels:\u003c/label>\n            \u003cdiv class=\"chip-row\">\n              \u003cselect id=\"bulkImgCountSel\" style=\"flex:1 1 100px; margin:0;\">\n                \u003coption value=\"1\">1\u003c/option>\n                \u003coption value=\"2\">2\u003c/option>\n                \u003coption value=\"3\">3\u003c/option>\n                \u003coption value=\"4\">4\u003c/option>\n              \u003c/select>\n              \u003cbutton class=\"btn-add-lib\" onclick=\"applyAllImageCount()\" title=\"Set every panel's Images selector to this value at once\">Apply to all\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"lib-hint\">Sets the Images selector for every panel (all 24) at once. You can still adjust individual panels afterwards.\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Image Preview Delay (ms):\u003c/label>\n            \u003cinput id=\"previewDelayInput\" type=\"number\" min=\"0\" max=\"5000\" step=\"50\" value=\"350\">\n            \u003cdiv id=\"previewDelayHint\" class=\"lib-hint\">How long to hover over an image (computer) or press-and-hold it (mobile) before the larger preview appears. 0 shows it instantly.\u003c/div>\n            \u003clabel class=\"check-label\" style=\"margin-top:8px;\">\u003cinput type=\"checkbox\" id=\"previewEnabledCheck\" checked> \u003cspan>\u003cb>Enable image preview\u003c/b> — hover (computer) or press-and-hold (mobile) to show a larger version of an image. Uncheck to turn the preview off entirely.\u003c/span>\u003c/label>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"menu-group\" id=\"menuGroup-edit\" hidden>\n        \u003cdiv class=\"config-panel\">\n          \u003cdiv class=\"config-header\">\u003ch2>Art Style &amp; Keywords\u003c/h2>\u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Global Positive Keywords / Art Style:\u003c/label>\n            \u003cinput id=\"globalPos\" type=\"text\" value=\"comic book art, crisp ink lines, vibrant cel shading, high contrast, dramatic shadows\">\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Global Negative Keywords:\u003c/label>\n            \u003cinput id=\"globalNeg\" type=\"text\" value=\"photorealistic, 3d render, blurry, deformed hands, text, speech bubbles, low quality\">\n          \u003c/div>\n          \u003cdiv class=\"input-group\">\n            \u003clabel>Allow NSFW Content:\u003c/label>\n            \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"nsfwCheck\"> \u003cspan>When unchecked, \"nsfw, nudity, explicit\" is added to the negative keywords and \"fully clothed\" to the prompt. Check to let the model follow your prompts without SFW filters.\u003c/span>\u003c/label>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"help-panel preset-panel\">\n          \u003ch3>Art Style &amp; Color Palette Presets\u003c/h3>\n          \u003cp class=\"lib-hint\">Pick a style and a palette — the combo replaces the \u003cb>Global Positive Keywords\u003c/b> field (photo styles also swap the \u003cb>Global Negative Keywords\u003c/b>, since they intentionally allow realism). You can still add your own extra keywords afterwards. Your last choice is remembered across reloads.\u003c/p>\n          \u003cdiv class=\"preset-row\">\n            \u003cdiv class=\"input-group\">\n              \u003clabel for=\"presetStyle\">Art Style:\u003c/label>\n              \u003cselect id=\"presetStyle\" onchange=\"applyPreset()\">\u003c/select>\n            \u003c/div>\n            \u003cdiv class=\"input-group\">\n              \u003clabel for=\"presetPalette\">Color Palette:\u003c/label>\n              \u003cselect id=\"presetPalette\" onchange=\"applyPreset()\">\u003c/select>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"help-panel keyword-panel\">\n          \u003ch3>Full Keyword List\u003c/h3>\n          \u003cp class=\"lib-hint\">Live view of the exact global keywords used by every panel, updated as you type, change presets, or toggle the NSFW flag. Keywords shown with a dashed blue border are auto-added because NSFW is off. Click any chip to copy just that keyword, or use the buttons to copy the whole list.\u003c/p>\n          \u003cdiv class=\"kw-section\">\n            \u003cdiv class=\"kw-header\">\u003cb>Positive Keywords\u003c/b>\u003cbutton class=\"btn-copy\" onclick=\"copyKeywords('pos')\">📋 Copy all\u003c/button>\u003c/div>\n            \u003cdiv class=\"kw-chips\" id=\"kwPosChips\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"kw-section\">\n            \u003cdiv class=\"kw-header\">\u003cb>Negative Keywords\u003c/b>\u003cbutton class=\"btn-copy\" onclick=\"copyKeywords('neg')\">📋 Copy all\u003c/button>\u003c/div>\n            \u003cdiv class=\"kw-chips\" id=\"kwNegChips\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"kw-section\">\n            \u003cdiv class=\"kw-header\">\u003cb id=\"kwFilterMode\" class=\"kw-mode\">SFW mode — filters ON\u003c/b>\u003c/div>\n            \u003cdiv class=\"kw-chips\" id=\"kwFilterChips\">\u003c/div>\n            \u003cdiv id=\"kwFilterNote\" class=\"lib-hint\" style=\"margin-top:8px;\">\u003c/div>\n          \u003c/div>\n          \u003cdiv id=\"kwCopiedEl\" class=\"kw-copied\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"help-panel json-open-panel\">\n          \u003ch3>🧩 Project JSON\u003c/h3>\n          \u003cp class=\"lib-hint\">Open the whole project — every page and panel, your library, the global keywords/settings, the preset and the UI flags — as one JSON document in a full-page editor. \u003cb>Find / Replace\u003c/b> works across the editable text fields (with Regex and a global Replace all). Only the fields you can edit elsewhere in the app are editable — everything else (\u003ccode>version\u003c/code>, \u003ccode>currentPage\u003c/code>, library ids, the document structure) is shown greyed and locked, so a replace can never corrupt it. Generated images are not part of this document (they only travel in the 💾 Export \u003ccode>.zip\u003c/code>).\u003c/p>\n          \u003cbutton class=\"btn-view\" onclick=\"openJsonEditor()\" title=\"Open the project as an editable JSON document\">🧩 Open JSON Editor\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"help-panel reset-panel\">\n          \u003ch3>Reset to Defaults\u003c/h3>\n          \u003cp class=\"lib-hint\">Restores all page settings (keywords, seed, panel count, NSFW flag, presets), clears every panel's selections and images, and returns the page to its factory state. This cannot be undone.\u003c/p>\n          \u003cdiv class=\"reset-controls\">\n            \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"resetActivateCheck\" onchange=\"updateResetControls()\"> \u003cspan>\u003cb>Arm the reset button.\u003c/b> You must check this before you can reset.\u003c/span>\u003c/label>\n            \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"resetDelLibCheck\" onchange=\"updateResetControls()\"> \u003cspan>\u003cb>Also permanently delete my saved library objects\u003c/b> (characters, locations, and action prompts).\u003c/span>\u003c/label>\n          \u003c/div>\n          \u003cbutton class=\"btn-danger\" id=\"resetBtn\" disabled onclick=\"resetEverything()\">🔄 RESET EVERYTHING TO DEFAULT\u003c/button>\n          \u003cdiv id=\"resetStatusEl\" style=\"color:var(--red-text);font-weight:bold;margin-top:8px;min-height:1.2em;\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"config-panel\" id=\"preferencesPanel\">\n          \u003cdiv class=\"config-header\">\u003ch2>Preferences\u003c/h2>\u003c/div>\n          \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"hidePasswordPref\" onchange=\"onHidePasswordPrefChange()\"> \u003cspan>\u003cb>Ask for a password when hiding the panels\u003c/b> — press ▧ Hide Panels and you'll set a one-time password that must be entered to show them again. It resets after every reveal (casual privacy only — not real security).\u003c/span>\u003c/label>\n          \u003cdiv class=\"pref-sub\">Header &amp; menus\u003c/div>\n          \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"prefMenuFullscreen\" onchange=\"onPrefMenuFullscreenChange()\"> \u003cspan>\u003cb>Always open the menus full screen\u003c/b> — every menu section opens as a full-page overlay instead of the compact top/side panel, so you don't have to press \u003cb>⛶ Full Screen\u003c/b> each time. The \u003cb>⛶\u003c/b> button in the header is the same setting: press \u003cb>⤡ Exit Full Screen\u003c/b> there to go back to the compact menu.\u003c/span>\u003c/label>\n          \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"prefGenAlwaysVisible\" onchange=\"onPrefGenAlwaysVisibleChange()\"> \u003cspan>\u003cb>Keep ⚡ Generate All / ⏸ Pause / ■ Stop visible while the menu is hidden\u003c/b> — they move into the top header bar, so you can start, pause or stop a run without showing the menu.\u003c/span>\u003c/label>\n          \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"prefHdrAllViews\" onchange=\"onPrefHdrAllViewsChange()\"> \u003cspan>\u003cb>Keep the header bar visible in the other full-page views too\u003c/b> — Storyboard, Focus, Library, Analysis, the JSON editor and the user manual. Off by default, so those views get the whole screen.\u003c/span>\u003c/label>\n          \u003cdiv class=\"pref-sub\">Theme\u003c/div>\n          \u003clabel class=\"pref-row\">\u003cspan>\u003cb>Color mode\u003c/b> — Light, Dark, or match your device's own setting.\u003c/span>\n            \u003cselect id=\"themeModeSel\" onchange=\"onThemeModeChange()\">\n              \u003coption value=\"system\">Match my device\u003c/option>\n              \u003coption value=\"light\">Light\u003c/option>\n              \u003coption value=\"dark\">Dark\u003c/option>\n            \u003c/select>\n          \u003c/label>\n          \u003cdiv class=\"pref-row\">\u003cspan>\u003cb>Accent color\u003c/b> — the highlight color used for borders, buttons and labels across the app. Pick a preset or mix your own.\u003c/span>\n            \u003cdiv class=\"accent-row\" id=\"accentRow\">\n              \u003cbutton class=\"accent-swatch\" data-accent=\"\" style=\"background:#ffcc00\" title=\"Default (amber)\" onclick=\"onAccentChange('')\">\u003c/button>\n              \u003cbutton class=\"accent-swatch\" data-accent=\"#4d9fff\" style=\"background:#4d9fff\" title=\"Blue\" onclick=\"onAccentChange('#4d9fff')\">\u003c/button>\n              \u003cbutton class=\"accent-swatch\" data-accent=\"#4dff88\" style=\"background:#4dff88\" title=\"Green\" onclick=\"onAccentChange('#4dff88')\">\u003c/button>\n              \u003cbutton class=\"accent-swatch\" data-accent=\"#c8a2ff\" style=\"background:#c8a2ff\" title=\"Purple\" onclick=\"onAccentChange('#c8a2ff')\">\u003c/button>\n              \u003cbutton class=\"accent-swatch\" data-accent=\"#2ad1c4\" style=\"background:#2ad1c4\" title=\"Teal\" onclick=\"onAccentChange('#2ad1c4')\">\u003c/button>\n              \u003cbutton class=\"accent-swatch\" data-accent=\"#ff6fa5\" style=\"background:#ff6fa5\" title=\"Pink\" onclick=\"onAccentChange('#ff6fa5')\">\u003c/button>\n              \u003cbutton class=\"accent-swatch\" data-accent=\"#ff9a3d\" style=\"background:#ff9a3d\" title=\"Orange\" onclick=\"onAccentChange('#ff9a3d')\">\u003c/button>\n              \u003cbutton class=\"accent-swatch\" data-accent=\"#ff4d4d\" style=\"background:#ff4d4d\" title=\"Red\" onclick=\"onAccentChange('#ff4d4d')\">\u003c/button>\n              \u003cspan class=\"accent-custom\">\u003cinput type=\"color\" id=\"themeAccentInput\" title=\"Pick a custom accent color\" oninput=\"onAccentInput()\">\u003cbutton class=\"btn-view\" onclick=\"onAccentChange('')\" title=\"Go back to the default accent\">Reset\u003c/button>\u003c/span>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"menu-group\" id=\"menuGroup-library\" hidden>\n        \u003cdiv class=\"library-section\">\n          \u003cdiv class=\"library-header\">\u003ch2>Library\u003c/h2>\u003c/div>\n          \u003cp class=\"lib-hint\">Reusable characters and locations, saved in your browser and offered in every panel's dropdowns. Use the green \u003cb>+\u003c/b> button next to a section heading to add a new one, or create one right from a panel (＋ New Character… / ＋ New Location…).\u003c/p>\n          \u003cdiv class=\"lib-toolbar\">\n            \u003cbutton class=\"btn-lib-import\" onclick=\"document.getElementById('libImportInput').click()\" title=\"Import saved Characters / Locations (and Actions) from a project file (.json or .zip)\">⬆ Import…\u003c/button>\n            \u003cbutton class=\"btn-lib-analysis\" onclick=\"openAnalysis()\" title=\"Cross-reference your library items against every panel on a page\">📊 Analysis\u003c/button>\n            \u003cbutton class=\"btn-lib-fullscreen\" id=\"libFullscreenBtn\" onclick=\"toggleMenuFullscreen('library')\" title=\"Show the Library in a full-screen overlay\">⛶ Full Screen\u003c/button>\n            \u003cspan class=\"lib-hint\" id=\"libImportHint\">Bring items in from a saved project file (.json or .zip).\u003c/span>\n          \u003c/div>\n          \u003cinput type=\"file\" id=\"libImportInput\" accept=\".json,.zip,application/json,application/zip,application/x-zip-compressed,application/octet-stream\" multiple hidden onchange=\"libraryImportFiles(event)\">\n          \u003cdiv id=\"libObjects\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"menu-group\" id=\"menuGroup-help\" hidden>\n        \u003cdiv class=\"help-panel\">\n          \u003ch3>How to Use\u003c/h3>\n          \u003col>\n            \u003cli>\u003cb>Pick your page size\u003c/b> — open \u003cb>📄 File\u003c/b> and choose how many panels you want (1, 4, 6, 12, or 24). Each menu section's panels start collapsed — click a panel's header (e.g. \"Page Setup\") to expand its options.\u003c/li>\n            \u003cli>\u003cb>Work across pages\u003c/b> — open \u003cb>📄 File → Page Setup → Page:\u003c/b> to add, name, switch, and delete pages. Each page has its own number of panels, its own seed, and its own panels; the app-wide settings (image size, art style, NSFW flag) are shared. Generating and both view modes always act on the current page, and images are remembered per page in memory until you reload.\u003c/li>\n            \u003cli>\u003cb>Set the art style\u003c/b> — open \u003cb>🎨 Edit\u003c/b> for art style &amp; palette presets, hand-edit the global positive/negative keywords, or view and copy the full list in the \u003cb>Keyword List\u003c/b>. To control how literally the AI follows your words, use the \u003cb>Prompt Obedience\u003c/b> slider in \u003cb>📄 File → Page Setup\u003c/b> (1–30; 7 is the balanced default). Low values are loose and free, high values are very faithful but with diminishing returns — past ~15 colors oversaturate and halo / text artifacts appear.\u003c/li>\n            \u003cli>\u003cb>Fill in each panel\u003c/b> — for every panel, choose up to 3 characters, a location, and an optional action like \"kicking the door down\". The \u003ccode>modifier\u003c/code> boxes let you tweak a character's look or mood per panel. Use the \u003cb>Images\u003c/b> selector in each panel's header to render 1–4 images from the same prompt (variations of the same scene), or set the count for \u003ci>all\u003c/i> panels at once via \u003cb>📄 File → Image Count for All Panels\u003c/b>. A panel renders as long as it has \u003ci>any\u003c/i> content — a character, location, or action. Completely empty panels (no prompt beyond the presets) are skipped automatically. The character dropdowns list your saved library characters first, with the \"No Character Selected\" option at the bottom.\u003c/li>\n            \u003cli>\u003cb>Title and reorder your panels\u003c/b> — each panel's title bar has a \u003cb>title box\u003c/b> (right of \"Panel N\", display-only — it isn't added to the prompt). The \u003ccode>⇅ Move\u003c/code> chip opens a 1-to-N picker: choose a position to move that panel there, shifting the panels in between (e.g. moving panel 5 to position 2 makes it Panel 2, and the old 2–4 each move up one). Everything about a panel — title, characters, modifiers, location, action, panel seed, image count, and prompt override — moves with it, and the arrangement survives reloads and is included in your settings backup/import.\u003c/li>\n            \u003cli>\u003cb>Use saved descriptions\u003c/b> — add reusable character or location descriptions in \u003cb>📚 Library\u003c/b>. They save automatically in your browser and appear in every panel's dropdown. A panel uses a saved character only when you explicitly select it in a character slot; it never draws one in automatically. The \u003cb>⛶ Full Screen\u003c/b> button opens the Library in a full-screen overlay — the same live list, so your edits save as you type — which is a lot easier to work with on a phone; leave it with \u003cb>← Back to page\u003c/b> or \u003cb>Esc\u003c/b>. The \u003cb>⬆ Import…\u003c/b> button there pulls saved characters/locations (and actions, if the file has them) out of a project file — a \u003ccode>.json\u003c/code> backup or a \u003ccode>.zip\u003c/code> — so you can reuse them in another project; you pick which items to bring in and can edit them first. The \u003cb>📊 Analysis\u003c/b> button opens a matrix of your library items against the current page's panels — a ✅ marks each item a panel uses, and you can edit that panel's per-item description right in the grid (or \u003cb>＋ Add\u003c/b> an unused item to a panel).\u003c/li>\n            \u003cli>\u003cb>Keep a character consistent\u003c/b> — use the small \u003ccode>⇤\u003c/code> button on a character slot to copy that character + modifier from the panel directly before it (the Location and Panel Action Prompt rows have the same \u003ccode>⇤\u003c/code> copy buttons). Panel 1 has no previous panel, so its buttons are disabled. Already-set items are overwritten by the copy.\u003c/li>\n            \u003cli>\u003cb>Generate\u003c/b> — hit \u003cb>⚡ Generate All\u003c/b> in the menu bar — it sits beside File / Edit / Library / Help and stays visible at the top of the menu (and, if you turn on the matching option in \u003cb>Preferences\u003c/b>, it also stays visible in the top header bar while the menu is hidden). Each panel takes a few seconds (multiply by the number of images set for that panel). Or render just one panel: press \u003cb>Enter\u003c/b> in its \u003ccode>Panel Action Prompt\u003c/code> or its header \u003ccode>Seed\u003c/code> box (use \u003cb>Shift+Enter\u003c/b> to add a new line in the action box), or click its \u003ccode>🔄 Generate\u003c/code> button. Each image also has its own \u003ccode>🔄 Generate\u003c/code> chip above it to regenerate just that image. Each image has its own \u003ccode>✕ Clear this image\u003c/code> chip (images only). When a panel has more than one image, a \u003ccode>🗑 Clear Images\u003c/code> chip appears that removes all of that panel's images at once while keeping its characters, location, and action. The panel's \u003ccode>🗑 Clear\u003c/code> chip removes \u003ci>everything\u003c/i> — all images \u003ci>and\u003c/i> its characters, locations, and descriptions (this also stops an in-progress generation for that panel). To keep a particular image safe from being overwritten, click its \u003ccode>🔓 Protect\u003c/code> chip beneath it — Generate (that image's own chip, the panel's, or \u003ccode>⚡ Generate All\u003c/code>) never touches a protected image; a panel Generate simply keeps the protected images and regenerates the rest. Click \u003ccode>🔒 Protected\u003c/code> again to unprotect. To reuse a panel's setup, click \u003ccode>⧉ Duplicate\u003c/code> — it inserts a full copy (title, characters, modifiers, location, action, panel seed, image count, prompt, protect) right after the original, with no images, and widens the page to show it (up to the 24-panel maximum). When a page already has all 24 panels, Duplicate instead offers to start a new page with a copy of that panel as its first panel.\u003c/li>\n            \u003cli>\u003cb>Work with your images\u003c/b> — each image has \u003ccode>↗ Open\u003c/code> (shows it full-size in a new tab) and \u003ccode>⬇ Save\u003c/code> (downloads it to your device) chips in the row beneath it; both need an image first. Nothing overlays the images. The button row at the bottom of each panel adds \u003ccode>↗ Open All\u003c/code> (opens every image in that panel in new tabs) and \u003ccode>⬇ Save All (.zip)\u003c/code> (downloads all of that panel's images packed into a single \u003ccode>.zip\u003c/code>); these activate once the panel has at least one image. Choose the image size in \u003cb>📄 File\u003c/b>: from 512×512 up to 1920×1080 (16:9) or 1080×1920 (9:16), or a custom size up to 1920×1080. Larger sizes are upscaled from the 768px base generation, so they're a bit softer but still crisp for print/web use. To preview any image at a larger size, hover your pointer over it (computer) or press and hold it (mobile). The preview appears after the delay set in \u003cb>📄 File → Image Preview Delay\u003c/b> (0 shows it instantly), and can be turned off entirely with the \u003cb>Enable image preview\u003c/b> checkbox there. Each image also has a \u003ccode>🔓 Protect\u003c/code> chip (locks it against regeneration), a \u003ccode>⭐ Cover\u003c/code> chip (makes it the panel's representative — it moves to the first slot and gets a \u003ccode>⭐\u003c/code> badge), and an \u003ccode>✕ Clear this image\u003c/code> chip (removes just that image).\u003c/li>\n            \u003cli>\u003cb>Copy a panel's prompt\u003c/b> — use the \u003ccode>📋 Copy Prompt\u003c/code> chip on any panel to copy that panel's exact full prompt (style keywords, characters, modifiers, location, and action) to your clipboard — great for testing or tweaking a prompt in another image tool. If a panel has no content, the chip shows \u003ccode>⚠ No Content\u003c/code> instead. (This reflects any \u003ccode>📝 Prompt\u003c/code> override you've set.)\u003c/li>\n            \u003cli>\u003cb>View / override a panel's prompt\u003c/b> — the \u003ccode>📝 Prompt\u003c/code> chip on any panel opens an inline editor showing that panel's exact prompt, positive and negative, including the preset style keywords. You can view it or edit it right there: once you modify it, the \u003ccode>⚡ GENERATE\u003c/code> / \u003ccode>🔄 Generate\u003c/code> buttons for that panel use your edited text instead of the interface-built prompt. The editor text does \u003cb>not\u003c/b> feed back into the panel's character/location/action fields. If you then change the panel's characters, location, or action — or the global keywords, presets, or NSFW flag — the editor resets to the values drawn from those presets and the interface, discarding your override. (The override survives page reloads until such an interface change.)\u003c/li>\n            \u003cli>\u003cb>Reproduce a page\u003c/b> — set a \u003cb>Seed\u003c/b> in \u003cb>📄 File\u003c/b> (each page has its own); leave it blank for random results. When a seed is set, Panel N uses seed + N, so the whole page regenerates identically. The seed is saved across reloads along with your panel details. For full control, every panel has its own \u003ccode>Seed\u003c/code> box in its header: an empty box shows the value it will use in grey (the page seed + panel number − 1, or \"random\"). Type a number to override the page seed for that panel only; clear it to fall back. When a panel has no seed at all, the first time it generates it picks one and fills it into the box, so re-generating that panel gives you the same image again until you change it.\u003c/li>\n            \u003cli>\u003cb>Back up your project\u003c/b> — give it a name in \u003cb>📄 File → Project\u003c/b> (it shows at the top of the page and becomes the default filename). \u003cb>📄 File → Project → Backup Project\u003c/b> saves everything (project name, page setup, keywords, NSFW flag, all pages' panel details, saved characters/locations, layout) as a \u003ccode>.json\u003c/code> file. \u003ccode>💾 Save…\u003c/code> never asks: it silently overwrites the file you chose with \u003ccode>Save as…\u003c/code> (remembered even after a reload), or downloads to the default name if you haven't chosen one yet; \u003ccode>💾 Save as…\u003c/code> always asks for a path and filename and confirms before overwriting an existing file. Where the browser supports it you can choose any folder on your device; otherwise the file is simply downloaded. \u003ccode>⬆ Import Project\u003c/code> restores a saved file later — even on another device: a \u003ccode>.json\u003c/code> restores the settings, and a project \u003ccode>.zip\u003c/code> restores the settings \u003ci>and\u003c/i> repopulates every generated panel image (all pages) back into the page. Importing replaces the current project entirely (including image protection), so if you have a project in progress it asks first whether to save it: \u003cb>Save\u003c/b> backs the current project up and then imports, \u003cb>Continue\u003c/b> imports without saving, \u003cb>Cancel\u003c/b> aborts. All menu settings also survive page refreshes automatically. Every panel also has an \u003ccode>⬇ Export\u003c/code> chip — it downloads the \u003ci>same single JSON file\u003c/i> containing all panels' settings, so exporting from any panel backs up the whole project. To back up your generated images too, use \u003cb>📄 File → Export Project (.zip)\u003c/b>: it bundles the settings JSON plus every generated panel image (all pages) into one \u003ccode>.zip\u003c/code>. Images only live in the page until you reload, so export them before then.\u003c/li>\n            \u003cli>\u003cb>View modes\u003c/b> — \u003cb>▦ Storyboard\u003c/b> (top of the page) temporarily hides the whole UI and shows every panel's representative image as a comic-page grid — panels with no image yet get a placeholder. The \u003ccode>🔍 Focus\u003c/code> chip on a panel opens \u003cb>single-panel view\u003c/b>: the full page is hidden and just that panel fills the screen, so you can edit it without scrolling. Navigate with the \u003ccode>◀ Prev\u003c/code> / \u003ccode>Next ▶\u003c/code> buttons, the panel dropdown, the panel list on the left (landscape only), or the \u003ccode>↑\u003c/code>/\u003ccode>↓\u003c/code> arrow keys; \u003ccode>Esc\u003c/code> or \u003ccode>← Back to page\u003c/code> returns you. Both views reflect the current number of panels and their titles.\u003c/li>\n            \u003cli>\u003cb>NSFW\u003c/b> — leave unchecked to force SFW output; check it (in \u003cb>🎨 Edit\u003c/b>) to let the model follow your prompts without filters.\u003c/li>\n          \u003c/ol>\n          \u003cp style=\"margin-bottom:0;color:var(--text-6);\">Tip: generated images live only in this page until you reload — if you want to keep one, screenshot it.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"help-panel manual-panel\">\n          \u003ch3>📖 User Manual\u003c/h3>\n          \u003cp class=\"lib-hint\">A full guide to the app — building panels, generating images, persistence, backups, and more.\u003c/p>\n          \u003cbutton class=\"btn-add-lib\" onclick=\"openUserManual()\" title=\"Open the full user manual in a new tab\">📖 Open User Manual\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"help-panel about-panel\">\n          \u003ch3>About / Version History\u003c/h3>\n          \u003cp class=\"lib-hint\">Yet Another Comic Book Page Generator — a Perchance image-comic builder. Current version: \u003cb id=\"aboutVersion\" class=\"about-ver\">\u003c/b>. Each revision below summarizes what changed.\u003c/p>\n          \u003cdiv id=\"changelogCtn\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"gen-actions\">\n      \u003cdiv id=\"statusEl\" class=\"status\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"canvas-frame\" id=\"canvasFrame\">\n    \u003ch2>Panel Modifiers & Canvas\u003c/h2>\n    \u003cdiv id=\"comicGrid\" class=\"comic-grid\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"imgPreview\" class=\"img-preview\" hidden>\u003cimg id=\"imgPreviewImg\" alt=\"\">\u003cdiv id=\"imgPreviewLabel\" class=\"img-preview-label\">\u003c/div>\u003c/div>\n\n\u003cdiv id=\"singleOverlay\" class=\"view-overlay\" hidden>\n  \u003cdiv class=\"view-top\">\n    \u003cbutton class=\"btn-view\" onclick=\"closeSingleView()\" title=\"Return to the full page\">← Back to page\u003c/button>\n    \u003cdiv class=\"single-nav\">\n      \u003cbutton class=\"btn-clear\" onclick=\"singleNav(-1)\" title=\"Previous panel\">◀ Prev\u003c/button>\n      \u003cselect id=\"singlePanelSel\" onchange=\"singleNavTo(this.value)\">\u003c/select>\n      \u003cbutton class=\"btn-clear\" onclick=\"singleNav(1)\" title=\"Next panel\">Next ▶\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"focus-gen\">\n    \u003cbutton class=\"btn-generate\" id=\"focusGenerateBtn\" onclick=\"generateComicPage()\">⚡ Generate All\u003c/button>\n    \u003cbutton class=\"btn-pause-global\" id=\"focusPauseBtn\" onclick=\"pauseGenerations()\" title=\"Pause the run — press ⚡ Generate All to continue where you left off\" disabled>⏸ Pause\u003c/button>\n    \u003cbutton class=\"btn-stop-global\" id=\"focusStopBtn\" onclick=\"haltGenerations()\" title=\"Cancel the running ⚡ Generate All run\" disabled>■ Stop\u003c/button>\n    \u003cdiv class=\"status\" id=\"focusStatusEl\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"single-body\">\n    \u003cdiv class=\"single-list\" id=\"singleList\">\u003c/div>\n    \u003cdiv class=\"single-stage\" id=\"singleStage\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"storyboardOverlay\" class=\"view-overlay\" hidden>\n  \u003cdiv class=\"view-top\">\n    \u003cbutton class=\"btn-view\" onclick=\"closeStoryboard()\" title=\"Return to the full page\">← Back to page\u003c/button>\n    \u003cspan class=\"view-title\" id=\"storyboardTitle\">Storyboard — panel by panel\u003c/span>\n    \u003cdiv class=\"storyboard-nav\" id=\"storyboardNav\" hidden>\n      \u003cbutton class=\"page-nav-btn\" onclick=\"storyboardNavDelta(-1)\" title=\"Previous page\">◀\u003c/button>\n      \u003cdiv class=\"storyboard-nav-pages\" id=\"storyboardNavPages\">\u003c/div>\n      \u003cbutton class=\"page-nav-btn\" onclick=\"storyboardNavDelta(1)\" title=\"Next page\">▶\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"storyboardSummary\" class=\"sb-summary\" hidden>\u003c/div>\n  \u003cdiv id=\"storyboardGrid\" class=\"storyboard-grid\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"manualOverlay\" class=\"manual-overlay\" hidden>\n  \u003cdiv class=\"manual-bar\">\n    \u003cspan class=\"manual-title\">📖 User Manual — Yet Another Comic Book Page Generator\u003c/span>\n    \u003cbutton class=\"btn-view\" onclick=\"closeUserManual()\" title=\"Close the user manual\">✕ Close\u003c/button>\n  \u003c/div>\n  \u003ciframe id=\"manualFrame\" title=\"User Manual\">\u003c/iframe>\n\u003c/div>\n\n\u003cdiv id=\"passwordOverlay\" class=\"password-overlay\" hidden>\n  \u003cdiv class=\"password-box\">\n    \u003cdiv id=\"passwordSetMode\">\n      \u003ch3>Protect your hidden panels\u003c/h3>\n      \u003cp class=\"lib-hint\">Choose a one-time password to reveal them later. It only lasts until the panels are shown again — each hide can set a fresh one.\u003c/p>\n      \u003clabel>Password:\u003c/label>\n      \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"pwSet1\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){event.preventDefault();confirmSetPassword();}\">\u003cbutton class=\"btn-view\" id=\"pwSet1Eye\" onclick=\"togglePwEye('pwSet1','pwSet1Eye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n      \u003clabel>Confirm password:\u003c/label>\n      \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"pwSet2\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){event.preventDefault();confirmSetPassword();}\">\u003cbutton class=\"btn-view\" id=\"pwSet2Eye\" onclick=\"togglePwEye('pwSet2','pwSet2Eye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n      \u003cdiv id=\"pwSetErr\" class=\"pw-err\">\u003c/div>\n      \u003cdiv class=\"pw-btns\">\u003cbutton class=\"btn-view\" onclick=\"confirmSetPassword()\" style=\"background:var(--green);color:var(--ink);\">🔒 Lock &amp; Hide\u003c/button>\u003cbutton class=\"btn-view\" onclick=\"cancelPasswordDialog()\">Cancel\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"passwordEnterMode\" hidden>\n      \u003ch3>Panels are locked\u003c/h3>\n      \u003cp class=\"lib-hint\">Enter the password to show the panels again.\u003c/p>\n      \u003clabel>Password:\u003c/label>\n      \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"pwEnter\" autocomplete=\"off\" onkeydown=\"if(event.key==='Enter'){event.preventDefault();confirmEnterPassword();}\">\u003cbutton class=\"btn-view\" id=\"pwEnterEye\" onclick=\"togglePwEye('pwEnter','pwEnterEye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n      \u003cdiv id=\"pwEnterErr\" class=\"pw-err\">\u003c/div>\n      \u003cdiv class=\"pw-btns\">\u003cbutton class=\"btn-view\" onclick=\"confirmEnterPassword()\" style=\"background:var(--green);color:var(--ink);\">🔓 Unlock &amp; Show\u003c/button>\u003cbutton class=\"btn-view\" onclick=\"cancelPasswordDialog()\">Cancel\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"menuOverlay\" class=\"view-overlay\" hidden>\n  \u003cdiv class=\"view-top\">\n    \u003cbutton class=\"btn-view\" onclick=\"requestCloseMenuFullscreen()\" title=\"Return to the full page\">← Back to page\u003c/button>\n    \u003cspan class=\"view-title\" id=\"menuOverlayTitle\">Menu — full screen\u003c/span>\n  \u003c/div>\n  \u003cdiv id=\"menuOverlayBody\" class=\"menu-fullscreen-body\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"analysisOverlay\" class=\"view-overlay\" hidden>\n  \u003cdiv class=\"view-top\">\n    \u003cdiv style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\">\n      \u003cbutton class=\"btn-view\" onclick=\"closeAnalysis()\" title=\"Return to the full page\">← Back to page\u003c/button>\n      \u003cspan class=\"view-title\">📊 Library Analysis\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"analysis-controls\">\n      \u003clabel for=\"analysisPageSel\">Page:\u003c/label>\n      \u003cselect id=\"analysisPageSel\" onchange=\"analysisSetPage(this.value)\">\u003c/select>\n      \u003cbutton class=\"btn-clear\" onclick=\"analysisSwap()\" title=\"Swap which axis is which\">⇄ Swap rows / columns\u003c/button>\n      \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"analysisEditDesc\" onchange=\"analysisToggleEditDesc(this.checked)\"> Edit global descriptions\u003c/label>\n      \u003cspan class=\"lib-hint\" id=\"analysisHint\" style=\"margin: 0;\">\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"analysis-globalbar\" id=\"analysisGlobalBar\">\n    \u003cspan class=\"agb-title\">Project defaults:\u003c/span>\n    \u003clabel class=\"agb-item\" title=\"Allow NSFW content — unchecked adds SFW filters to every panel prompt\">\u003cinput type=\"checkbox\" id=\"analysisGlobalNsfw\" onchange=\"analysisGlobalNsfwChanged(this.checked)\"> NSFW\u003c/label>\n    \u003cspan class=\"agb-item\">\u003clabel for=\"analysisGlobalStyle\">Style\u003c/label>\n      \u003cselect id=\"analysisGlobalStyle\" onchange=\"analysisGlobalStyleChanged(this.value)\" title=\"Project default art style (Edit → Art Style &amp; Color Palette Presets)\">\u003c/select>\n    \u003c/span>\n    \u003cspan class=\"agb-item\">\u003clabel for=\"analysisGlobalSize\">Size\u003c/label>\n      \u003cselect id=\"analysisGlobalSize\" onchange=\"analysisGlobalSizeChanged(this.value)\" title=\"Project default image size (File → Page Setup)\">\u003c/select>\n      \u003cspan class=\"agb-custom\" id=\"analysisGlobalSizeCustom\" hidden>\n        \u003cinput id=\"analysisGlobalSizeW\" class=\"agb-num\" type=\"number\" min=\"64\" max=\"1920\" placeholder=\"W\" onchange=\"analysisGlobalSizeCustomChanged()\">\n        \u003cinput id=\"analysisGlobalSizeH\" class=\"agb-num\" type=\"number\" min=\"64\" max=\"1080\" placeholder=\"H\" onchange=\"analysisGlobalSizeCustomChanged()\">\n      \u003c/span>\n    \u003c/span>\n    \u003cspan class=\"agb-item\">\u003clabel for=\"analysisGlobalSeed\">Seed\u003c/label>\n      \u003cinput id=\"analysisGlobalSeed\" type=\"text\" placeholder=\"random\" onchange=\"analysisGlobalSeedChanged(this.value)\" title=\"This page's seed — every panel without its own seed uses this (+panel index − 1). Blank = random.\">\n    \u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"analysis-wrap\" id=\"analysisWrap\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"libImportOverlay\" class=\"lib-import-overlay\" hidden>\n  \u003cdiv class=\"lib-import-box\">\n    \u003ch3>⬆ Import Library Items\u003c/h3>\n    \u003cp class=\"lib-hint\" id=\"libImportSourceInfo\" style=\"margin-bottom: 6px;\">\u003c/p>\n    \u003cdiv class=\"lib-import-controls\">\n      \u003cbutton class=\"btn-add-lib\" onclick=\"libImportSelectAll(true)\">Select all\u003c/button>\n      \u003cbutton class=\"btn-add-lib\" onclick=\"libImportSelectAll(false)\">Select none\u003c/button>\n      \u003cspan class=\"lib-hint\" id=\"libImportCount\" style=\"margin: 0;\">\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"lib-import-list\" id=\"libImportList\">\u003c/div>\n    \u003cdiv class=\"lib-import-btns\">\n      \u003cbutton class=\"btn-confirm-save\" onclick=\"confirmLibraryImport()\">Import selected\u003c/button>\n      \u003cbutton class=\"btn-clear\" onclick=\"cancelLibraryImport()\">Cancel\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"importConfirmOverlay\" class=\"import-confirm-overlay\" hidden>\n  \u003cdiv class=\"import-confirm-box\">\n    \u003ch3>⚠️ Importing replaces your current project\u003c/h3>\n    \u003cp>You have a project in progress. Importing will clear \u003cb>everything\u003c/b> — all pages, panel settings, keywords, saved characters/locations, generated images, and image protection.\u003c/p>\n    \u003cp class=\"ic-hint\">Save backs up the current project first (💾 Save…), then imports. Continue imports without saving. Cancel aborts.\u003c/p>\n    \u003cdiv class=\"import-confirm-btns\">\n      \u003cbutton class=\"btn-confirm-save\" onclick=\"confirmImportSave()\" title=\"Back up the current project (same as 💾 Save…), then import\">💾 Save & Import\u003c/button>\n      \u003cbutton onclick=\"confirmImportNoSave()\" title=\"Import without backing up the current project\">Continue\u003c/button>\n      \u003cbutton class=\"btn-clear\" onclick=\"cancelImport()\" title=\"Abort — keep the current project\">Cancel\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"newProjectOverlay\" class=\"import-confirm-overlay\" hidden>\n  \u003cdiv class=\"import-confirm-box\">\n    \u003ch3>⚠️ Starting a new project clears the current one\u003c/h3>\n    \u003cp>You have a project in progress. Starting a new project will clear \u003cb>everything\u003c/b> — all pages, panel settings, keywords, generated images, and image protection. (Your saved characters, locations, and action prompts are kept.)\u003c/p>\n    \u003cp class=\"ic-hint\">Save backs up the current project first (💾 Save…), then starts fresh. Continue starts without saving. Cancel aborts.\u003c/p>\n    \u003cdiv class=\"import-confirm-btns\">\n      \u003cbutton class=\"btn-confirm-save\" onclick=\"confirmNewProjectSave()\" title=\"Back up the current project (same as 💾 Save…), then start a new project\">💾 Save & New\u003c/button>\n      \u003cbutton onclick=\"confirmNewProjectNoSave()\" title=\"Start a new project without backing up the current one\">Continue\u003c/button>\n      \u003cbutton class=\"btn-clear\" onclick=\"cancelNewProject()\" title=\"Abort — keep the current project\">Cancel\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"jsonEditorOverlay\" class=\"view-overlay\" hidden>\n  \u003cdiv class=\"view-top\">\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n      \u003cbutton class=\"btn-view\" onclick=\"closeJsonEditor()\" title=\"Return to the full page (Esc)\">← Back to page\u003c/button>\n      \u003cspan class=\"view-title\">🧩 Project JSON Editor\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"json-toolbar\">\n      \u003cbutton class=\"btn-dl\" id=\"jsonApplyBtn\" onclick=\"jsonEditorApply()\" title=\"Validate the document and apply your edits to the project\" disabled>✔ Apply\u003c/button>\n      \u003cbutton class=\"btn-clear\" onclick=\"jsonEditorReload()\" title=\"Discard your edits and rebuild the document from the live project\">🔄 Reload\u003c/button>\n      \u003cbutton class=\"btn-clear\" id=\"jsonUndoApplyBtn\" onclick=\"jsonEditorUndoApply()\" title=\"Revert the project to exactly how it was before the last Apply\" disabled>↩ Undo last apply\u003c/button>\n      \u003cbutton class=\"btn-clear\" onclick=\"jsonEditorCopy()\" title=\"Copy the whole document to the clipboard\">📋 Copy\u003c/button>\n      \u003cspan class=\"json-status\" id=\"jsonStatusEl\">\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"json-toolbar\">\n    \u003clabel for=\"jsonFindInput\">Find\u003c/label>\n    \u003cinput type=\"text\" id=\"jsonFindInput\" placeholder=\"text inside editable values\" oninput=\"jsonEditorFindChanged()\">\n    \u003clabel for=\"jsonReplaceInput\">Replace with\u003c/label>\n    \u003cinput type=\"text\" id=\"jsonReplaceInput\" placeholder=\"replacement text\">\n    \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"jsonMatchCase\" onchange=\"jsonEditorFindChanged()\"> \u003cspan>Match case\u003c/span>\u003c/label>\n    \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"jsonRegex\" onchange=\"jsonEditorFindChanged()\"> \u003cspan>Regex\u003c/span>\u003c/label>\n    \u003cbutton class=\"btn-clear\" onclick=\"jsonEditorFindNext(1)\" title=\"Find the next match (Enter in the Find box, Shift+Enter for the previous one)\">🔍 Find next\u003c/button>\n    \u003cbutton class=\"btn-clear\" onclick=\"jsonEditorReplaceOne()\" title=\"Replace the highlighted match, then jump to the next one\">⇄ Replace\u003c/button>\n    \u003cbutton class=\"btn-clear\" onclick=\"jsonEditorReplaceAll()\" title=\"Replace every match in the editable values at once\">⇄ Replace all\u003c/button>\n    \u003cspan class=\"json-status\" id=\"jsonFindEl\">\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"json-toolbar\">\n    \u003clabel class=\"check-label\">\u003cinput type=\"checkbox\" id=\"jsonSyntaxCheck\" checked onchange=\"jsonEditorRenderAll()\"> \u003cspan>Syntax highlighting\u003c/span>\u003c/label>\n    \u003cspan class=\"lib-hint\" id=\"jsonHintEl\" style=\"margin:0;\">\u003c/span>\n    \u003cspan class=\"json-problem-nav\">\n      \u003cbutton class=\"btn-clear\" id=\"jsonPrevProblemBtn\" onclick=\"jsonEditorProblem(-1)\" disabled>‹ Prev\u003c/button>\n      \u003cbutton class=\"btn-clear\" id=\"jsonNextProblemBtn\" onclick=\"jsonEditorProblem(1)\" disabled>Next ›\u003c/button>\n    \u003c/span>\n    \u003cspan class=\"json-status\" id=\"jsonProblemEl\">\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"json-editor-wrap\">\n    \u003cdiv class=\"json-gutter\" id=\"jsonGutter\">1\u003c/div>\n    \u003cdiv class=\"json-code\">\n      \u003cpre class=\"json-mirror\" id=\"jsonMirror\" aria-hidden=\"true\">\u003c/pre>\n      \u003ctextarea class=\"json-area\" id=\"jsonArea\" spellcheck=\"false\" wrap=\"off\" autocomplete=\"off\" autocapitalize=\"off\" autocorrect=\"off\" oninput=\"jsonEditorInput()\" onscroll=\"jsonEditorSyncScroll()\">\u003c/textarea>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"ghBackupOverlay\" class=\"password-overlay\" style=\"position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:10001;\" hidden>\n  \u003cdiv class=\"password-box\" style=\"max-width:460px;\">\n    \u003ch3>⬆ Backup to GitHub\u003c/h3>\n    \u003cp class=\"lib-hint\" style=\"margin:0 0 10px;\">Pushes this generator's source — \u003cb>main.pjs\u003c/b>, \u003cb>index.html\u003c/b> (the live page, incl. embedded docs), \u003cb>src/user-manual.html\u003c/b>, and the PENDING / AI-NOTES / CHANGELOG / ISSUES docs — to a GitHub repo as version history. Requires a private repo + a fine-grained Personal Access Token (Contents: read &amp; write, scoped to that repo). Backs up the \u003ci>last-saved\u003c/i> generator — press Save first if you just made changes.\u003c/p>\n    \u003clabel>GitHub username / owner:\u003c/label>\n    \u003cinput type=\"text\" id=\"ghOwnerInput\" placeholder=\"e.g. cgoodwin97124\" autocomplete=\"off\" style=\"width:100%;box-sizing:border-box;\">\n    \u003clabel>Repository name:\u003c/label>\n    \u003cinput type=\"text\" id=\"ghRepoInput\" placeholder=\"e.g. yacbpg-backup\" autocomplete=\"off\" style=\"width:100%;box-sizing:border-box;\">\n    \u003clabel>Personal Access Token (fine-grained):\u003c/label>\n    \u003cdiv class=\"pw-row\">\u003cinput type=\"password\" id=\"ghTokenInput\" autocomplete=\"off\">\u003cbutton class=\"btn-view\" id=\"ghTokenEye\" onclick=\"togglePwEye('ghTokenInput','ghTokenEye')\" title=\"Show/hide\">👁\u003c/button>\u003c/div>\n    \u003cdiv id=\"ghStatusEl\" class=\"pw-err\">\u003c/div>\n    \u003cp class=\"ic-hint\" style=\"margin:0 0 12px;\">🔒 Token is stored only in your browser (localStorage) — never in exports, project backups, or the shipped generator. Last backup: \u003cspan id=\"ghLastBackupEl\">never\u003c/span>\u003c/p>\n    \u003cdiv class=\"pw-btns\">\n      \u003cbutton class=\"btn-view\" onclick=\"ghSaveSettings()\" title=\"Save owner/repo/token in this browser only\">💾 Save settings\u003c/button>\n      \u003cbutton class=\"btn-view\" onclick=\"ghTest()\" title=\"Check the token can see the repo (makes no changes)\">🔍 Test connection\u003c/button>\n      \u003cbutton class=\"btn-view\" onclick=\"ghClose()\">Close\u003c/button>\n    \u003c/div>\n    \u003cp class=\"ic-hint\" style=\"margin:10px 0 0;\">⬆ Backups are run by the AI assistant — just say \"back it up to GitHub\" in the chat and I'll push using the saved token. No push button ships with the generator, so visitors can't trigger commits.\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003c!-- EMBEDDED WORKFLOW DOCS (2026-08-14): PENDING queue + AI-NOTES + CHANGELOG were moved out of src/ into\n     these \u003cscript type=\"text/plain\"> blocks (read via .textContent; inert to the perchance template engine).\n     Reason: the platform's save flow permanently fails on those three src/ file names (\"another_upload_in_progress\")\n     once their first upload wedges, blocking ALL saves while they're present — deleting them is the only cure.\n     AI-NOTES was previously src/AI-NOTES.md; the queue was src/PENDING.md; the changelog was src/CHANGELOG.md;\n     ISSUES.md (src/ISSUES.md) joined the same way later the same day — its FIRST AI write this session wedged it too,\n     proving the trigger is ANY src/ file written by the AI (its sync gets killed by the next hard reload), not the\n     content or the file names. None of these four file names may ever be recreated in src/.\n     (renderChangelog below reads #embeddedChangelog, with a src/ fetch fallback for stale editor copies). -->\n\u003cscript type=\"text/plain\" id=\"embeddedPENDING\">\n# PENDING — Request Queue\n\n**RULE (author-mandated 2026-08-13): EVERY new author request is logged into this file FIRST — before\nany work starts — even when the author says \"go ahead\" immediately.** Greenlit requests go straight into\nthe 🟢 START NOW section; everything awaiting the author's explicit \"go ahead\" goes into the 🕒 QUEUED\nsection. Move entries between sections as their status changes (greenlit → START NOW; implemented →\n✅ DONE, with the changelog version + a matching dev-note block in index.html). A future AI helper\nsession should READ THIS FILE before planning new work.\n\nConvention: date-stamped entry with Status, Request, and implementation Notes (newest first within\neach section).\n\n---\n\n## 🟢 START NOW — author explicitly said \"go ahead\" (implement immediately)\n\n### 2026-09-23 — FEATURE REQUEST (8 items): always-visible header · Preferences under Edit · always-fullscreen menus · Generate All/Pause/Stop as top-level menu items · theme & color scheme · one-click Library · drop the Library's Full Screen button\n- **Status:** IN PROGRESS — author greenlit 2026-09-23. **Quick wins shipped as 2026.09.23.1**\n  (Preferences -> Edit, one-click Library, new versioning scheme). **Header / menu / theme ship next as\n  2026.09.23.2.** The deferred 8b item (a separate app-settings JSON file) gets its OWN ship AFTER\n  header/menu/theme; until then the theme and any future Preferences -> Locale setting live in\n  `comicGen.panelState` so they travel in Save / Export / Import.\n- **Request (author, 2026-09-23, verbatim):** \"Some more changes: * I'd like to have the app title bar and four\n  buttons next to it always visible. * I'd like Preferences to live under Edit rather than File. * I'd like to\n  have the menus always go full screen rather than needing to click the Full Screen button. I'd like to toggle\n  this behavior (full screen or current behavior) under Edit -> Preferences. * I'd like to have \"Generate All\n  Panels On Page\" renamed to Generate All. I'd like to move Generate All, Pause, and Stop, to the menu as top\n  level menu items, in the same size and style (including capitalization) as File, Edit, Library, and Help. The\n  Stop button can keep its color scheme (red button with white text), but Generate and Pause can be in white\n  text with their emojis preceding them as the other menu buttons. I'd like to have an option under Edit ->\n  Preferences whether to keep them visible when the rest of the rest of the menu items are hidden. * User\n  configurable color scheme and theme (light / dark / system if possible) under Preferences. * Currently, when\n  I click the Library menu button I have to click again to open the library proper.  I'd like to not have to\n  make that second click; clicking Library should just have it open. * I think the Full Screen button inside\n  Library is redundant and can be removed.  Keep the top bar Full Screen button though, and it should keep its\n  current functionality. As usual, perform all of the pre-implementation tasks before beginning work. Thank\n  you!\"\n- **AUTHOR'S ANSWERS (2026-09-23, verbatim):**\n  1. \"So far I don't see a need for the header to stay visible in the other full page views, but I may change\n     my mind on that. So let's make this configurable under Preferences. :)\" — header becomes a sticky,\n     always-visible bar (while scrolling + in the full-screen menu), plus a Preferences toggle for \"also keep\n     it visible in the other full-page views\" (default OFF).\n  2. \"Let's keep **Menu: Side** as is for now.\" — leave the Menu: Side toggle and all side-mode behaviour\n     untouched.\n  3. \"Your recommendation is good.\" — ONE shared persisted switch: the Preferences \"open menus full screen\"\n     option and the header Full Screen button are the same state (label flips Full Screen / Exit Full Screen).\n  4. \"Extra buttons inside the same row. Generate/Pause exactly matching the tabs. And I'm seeing white text in\n     amber buttons (see included screenshot); I want Generate and Pause to match this style.\" — Generate All /\n     Pause / Stop go INLINE in `#menuBar` as siblings of the four tab buttons and match them exactly. Two\n     screenshots confirm the tabs render as dark #2a2a2a fill + 2px #ffcc00 border + WHITE bold text (the\n     white is real: the platform's normalize.css `button:not([disabled]) { color: inherit }` out-specifies a\n     single-class button colour, so `.menu-btn`'s declared #ffcc00 never applies — do NOT \"fix\" the tabs).\n  5. \"Your recommendation.\" — while the menu is hidden, Generate All / Pause / Stop appear in the header strip\n     next to the four header buttons (behind a Preferences toggle).\n  6. \"Yes, leave untouched.\" — the Focus view's own Generate/Pause/Stop row is not changed.\n  7. \"Your recommendation.\" — theme = Mode (Light / Dark / System) + a user-pickable accent, built on new CSS\n     custom properties; the default dark theme must stay pixel-identical.\n  8. \"Yes, include it in the project!\" — the theme is stored in `comicGen.panelState` so it travels in\n     Save / Export / Import, and it becomes an editable field in the JSON editor.\n  8b. \"Actually, would it be worth it to create a separate JSON file for saved settings? Any app level\n     settings would live in there and are loaded when the page loads. Let's mark this for a separate\n     post-header/menu/theme code ship, and questions on this one can hold until after header/menu/theme ships,\n     unless it makes more sense to do this work at the same time you do header/menu/theme. I'll default to\n     your recommendation; no need to get my separate decision.\" — DECISION: separate ship AFTER\n     header/menu/theme (the visible work keeps moving, and the settings file then becomes the home for\n     app-level prefs, incl. the Locale item).\n  9. \"Let's keep it, because we're keeping the Full Screen top button for now.\" — **the Library's Full Screen\n     button STAYS** (this supersedes the original bullet that asked to remove it). To handle in the\n     header/menu ship: with menus-always-full-screen that button would otherwise act as a second \"exit full\n     screen\" control — give it a sensible behaviour (its label already flips via\n     `updateMenuFullscreenLabels()`).\n  10. \"Ship the quick wins first, then header/menu/theme. Also, lets have the versioning go YYYY.MM.DD.S, for\n     year/month/day/day's serial release number. A new day's work should start the day's release number at 1\n     and increment it for each release (single digits up to 10, unless you think 01, 02, 03, etc. would be\n     better; I'll default to your recommendation here). Additionally, regarding date/time, I'm in Pacific Time\n     (currently Pacific Standard Time, switching to Pacific Daylight Time when the US customarily switches).\n     This suggests adding a Preferences -> Locale item, which would live in the settings defaults (see item 8,\n     above).\" — versioning becomes YYYY.MM.DD.S with S = 1, 2, 3... (NO zero padding: S is read by a human and\n     compared as a whole number; first release under the new scheme = 2026.09.23.1). Dates/times in the docs\n     use Pacific Time. The Preferences -> Locale item is DEFERRED to the settings-file ship.\n- **PLAN:** ship 1 (2026.09.23.1) = (2) Preferences -> Edit, (6) one-click Library, (10) versioning + docs.\n  (The Library Full Screen button stays, so item 7 now needs no work.) ship 2 (2026.09.23.2) = (1)/(5) sticky\n  always-visible header + its Preferences toggle, (3) menus full-screen by default behind one shared switch,\n  (4) Generate All / Pause / Stop as inline menu-bar items + the \"keep visible when the menu is hidden\"\n  toggle, (7)/(8) theme (Light / Dark / System + accent) on CSS variables, included in the project and the\n  JSON editor.\n- **SHIP 1 DONE (2026.09.23.1):** the Preferences panel moved from the end of File to the end of Edit\n  (`#preferencesPanel`); `switchMenu()` now expands the Library group so 📚 Library opens straight away; the\n  Library's ⛶ Full Screen button stays (item 7 dropped); the `YYYY.MM.DD.S` + Pacific-time conventions were\n  written into the index.html dev-notes and AI-NOTES §12. Verified live at 866x604 (File = Project + Page Setup,\n  Edit = Art Style / Presets / Keyword List / Project JSON / Reset / Preferences, Library opens with its list\n  visible and no second click, zero window errors).\n- **SHIP 2 DONE (2026.09.23.2):** (1)/(5) `.app-header` is now sticky (`position:sticky; top:0; z-index:9000`)\n  with `syncHdrHeight()` publishing its height as `--hdr-h` so `.menu-frame` parks under it; new Preferences\n  toggle `comicGen.hdrAllViews` (`applyHdrAllViews()`) makes the header a fixed strip on the OTHER full-page\n  views too (`body.hdr-all-views`, per answer 1, default OFF). (3) menus open full-screen by DEFAULT via\n  `comicGen.menuFullscreen` (default ON); `syncMenuMode()` moves the real `#menuFrame` into `#menuOverlay`\n  whenever the pref is on and the menu is visible, `applyMenuFullscreenPref(on, section)` is the single setter\n  the prefs checkbox, the header ⛶ button and the Library ⛶ button all use, `updateMenuFullscreenLabels()`\n  reads the PREF (not `isMenuFullscreen()`), and `requestCloseMenuFullscreen()` = `applyMenuVisible(false)` for\n  the overlay's `← Back to page` + Esc. `body.menu-fullscreen .app-header` is `position:fixed; z-index:10005`\n  so the header sits ABOVE the overlay, and overlays get `padding-top: calc(var(--hdr-h) + 14px)`; the old\n  `body.menu-fullscreen .gen-actions { display:none }` was REMOVED so the status line stays visible. (4)\n  ⚡ Generate All / ⏸ Pause / ■ Stop are now `\u003cbutton class=\"menu-btn …\">` siblings of the four tabs INSIDE\n  `#menuBar` (ids `#menuGenerateBtn` / `#globalPauseBtn` / `#globalStopBtn`); `.menu-btn.menu-action` is a\n  TWO-CLASS `color:#fff` (needed to beat normalize's `button:not([disabled]) { color: inherit }`) and\n  `.menu-stop` is red+white; the new `comicGen.genAlwaysVisible` pref + `placeGenButtons()` move the three into\n  `#hdrGenCtr` in the header strip when the menu is hidden. The Focus view's own row was left untouched\n  (answer 6). All three new prefs (`comicGen.menuFullscreen`, `comicGen.genAlwaysVisible`, `comicGen.hdrAllViews`)\n  are persisted, and included in `buildExportData()` / `applyImportedSettings()` / the JSON editor's\n  `JSON_OPEN_FLAGS` + apply path. Verified live at 866x604 and 390x844 (7 menu buttons, header pinned at\n  top:0 while scrolling, `--hdr-h` 94→181 when the gen buttons move into the header, zero window errors).\n- **BACKUP NOTE (2026-09-23, 17:52 UTC):** ship 2 was pushed to `cgoodwin97124/yacbpg-backup` (7 files).\n  IMPORTANT: `ghPush()` reads `index.html` from the PUBLIC generator page (`location.href`), which serves the\n  last SAVED version — at backup time that page was still the pre-2026.09.23.1 build (changelog head\n  2026.08.16.24, 906692 bytes), so the repo's `index.html` does NOT contain ship 1 or ship 2 yet, while\n  PENDING.md / CHANGELOG.md / AI-NOTES.md / ISSUES.md / src/user-manual.html (read from the live DOM) DO.\n  FIX: after the author presses **Save**, re-run `openGhBackup(); await ghPush(); ghClose();` so the repo's\n  index.html catches up. When verifying, check the repo's index.html for `menuGenerateBtn` + `2026.09.23.2`.\n- **BACKUP NOTE RESOLVED (2026-09-23, 18:06 UTC):** the author pressed Save and the re-push succeeded — the\n  served (2026-09-23):** the AI may pause work mid-task and ask the author for input\n  (especially visual checks) whenever it reaches a genuine decision point — logged as its own directive entry\n  in the QUEUED section and in the index.html dev-notes.\n- **RECON (2026-09-23):**\n  - **1. Header / \"title bar + four buttons\".** `index.html:1880` `\u003cdiv class=\"app-header\">` = a flex row whose\n    LEFT side is `.header-btns` with exactly four buttons — `▦ Storyboard` (`openStoryboard()`), `☰ Hide Menu`\n    (`#menuToggleBtn`, `toggleMenu()`), `▤ Menu: Side` (`#layoutToggleBtn`, `toggleLayout()`), `⛶ Full Screen`\n    (`#menuFullscreenBtn`, `toggleMenuFullscreen()`) — and whose RIGHT side is `\u003ch1>` + `#projectNameEl`\n    (`.project-name`). CSS `index.html:1440-1441` (plain flex, no `position`). The header is currently NOT\n    sticky, so it scrolls out of view on a long page; `▧ Hide Panels` (`#panelsToggleBtn`,\n    `position:fixed; bottom:16px; left:16px`) and `#pageNav` (fixed, bottom-centre) are separate body-level\n    elements and are NOT part of the four. Note the OLD `body.hdr-offscreen` machinery + the floating\n    `#menuRevealBtn` were removed on 2026-09-20 (changelog 2026.08.16.21), so nothing re-shows the header\n    controls once they scroll away — the class and `refreshHdrOffscreen()`/`initHeaderObserver()` no longer\n    exist in code (only in old dev notes). In SIDE mode (`.menu-frame` `position:sticky; top:10px`) and TOP\n    mode (`top:0`) the menu frame is sticky, the header is not.\n  - **2. Menu-section visibility.** `body.menu-hidden .menu-frame { display:none }` (index.html:1450); every\n    other full-page view (`#singleOverlay`, `#storyboardOverlay`, `#analysisOverlay`, `#menuOverlay`,\n    `#jsonEditorOverlay`, `#manualOverlay`) is `position:fixed; inset:0; z-index:10000` (`.view-overlay`\n    index.html:1592) so it COVERS the header entirely. `#menuOverlay` (the full-screen menu) additionally\n    adopts the real `#menuFrame` element into `#menuOverlayBody` (`openMenuFullscreen()`, index.html:5171) and\n    sets `body.menu-fullscreen`; CSS at 1843-1846 restyles the frame to fill the overlay and hides\n    `.gen-actions`.\n  - **3. Preferences** currently = one `config-panel` at the END of `#menuGroup-file` (index.html:2022-2025),\n    header `\u003ch2>Preferences\u003c/h2>`, holding exactly one control: `#hidePasswordPref` (persisted\n    `comicGen.hidePasswordPref`, `onHidePasswordPrefChange()`). New Preferences options therefore need a home\n    in `#menuGroup-edit` (which today holds Art Style & Keywords, the preset panel, the keyword list and Reset\n    to Defaults).\n  - **4. Generate All / Pause / Stop.** Markup `index.html:2141` — `.gen-actions` (the LAST child of\n    `#menuFrame`, CSS 1485, `border-top:2px solid #ffcc00`) > `.gen-row` (flex, 1552) > [`.btn-generate`\n    `⚡ GENERATE ALL PANELS\u003cbr>ON PAGE ⚡` → `generateComicPage()`; `.btn-pause-global` `#globalPauseBtn`\n    `⏸ Pause` → `pauseGenerations()` (disabled unless a run is in progress); `.btn-stop-global`\n    `#globalStopBtn` `■ Stop` → `haltGenerations()` (red `#ff4d4d` / white, uppercase)] + `#statusEl.status`.\n    The Focus view has its OWN `.focus-gen` row (`#focusPauseBtn`/`#focusStopBtn`/`#focusStatusEl`) mirroring\n    these — leave that alone unless told otherwise. `body.menu-fullscreen .gen-actions { display:none }`\n    (1846, changelog 2026.08.16.22) is the rule that must be revisited once the buttons move into the menu bar.\n  - **5. Menu bar.** `#menuBar` (index.html:1897-1902) = four `\u003cbutton class=\"menu-btn\" data-menu=…>` —\n    `📄 File`, `🎨 Edit`, `📚 Library`, `❓ Help` — each `switchMenu(name)`. CSS `.menu-bar` (1822: flex, wrap,\n    gap 6px) and `.menu-btn` (1823-1825: `flex:1 1 76px; background:#2a2a2a; color:#ffcc00; border:2px solid\n    #ffcc00; padding:9px 4px; font-weight:bold; font-size:0.82rem`, `.active` = amber fill). i.e. the four\n    existing buttons are AMBER text (not white), and in  from that loop + the `.btn-lib-fullscreen` CSS + the Help text that advertises it\n    (`#menuGroup-help` item 5, index.html:2116) and the user manual (src/user-manual.html §9).\n  - **9. Theme / color scheme.** There are NO CSS custom properties anywhere (`:root` / `--name` = 0 matches):\n    the —187 KB `\u003cstyle>` (index.html:1418-1856) hardcodes **376 hex colors across 68 distinct values** +\n    20 `rgba(...)` shadows. The recurring roles: accent amber `#ffcc00` (44 uses — borders, labels, menu-btn,\n    panel-card borders), white text `#fff` (27) / on-accent dark `#111` (19) / `#000` (12), green `#4dff88`\n    (27 — project name, storyboard chip, page nav, kw-mode), surfaces `#2a2a2a` (13), `#1a1a1a` (11 body bg),\n    `#333` (14) inputs, `#444` (19) borders/hovers, `#3a3a3a` (7), `#222` (5), greys `#555/#666/#888/#bbb/#ddd`\n    (9/6/6/6/6), danger red `#ff4d4d` (14) / `#ff3333` (7) hover, blue `#4d9fff` (12), purple `#c8a2ff` (8),\n    amber variants `#ffcc66` (9) / `#ffd95e` / `#ffb84d` (6) / `#ff8a4d`. A theme therefore means introducing\n    CSS variables for those roles and swapping —376 literals (plus the rgba shadows) — a mechanical but\n    wide-reaching refactor that must keep every screen visually identical in the default (dark) theme.\n  - **10. Persistence plumbing** available for new prefs: `comicGen.*` localStorage keys written directly, and\n    per-setting load/save helpers next to each control (e.g. `hidePasswordPref`). Anything the author wants in\n    the File→Export document must be added to `collectPanelState()`/`applyImportedSettings()` AND classified in\n    the JSON editor's `jsonFieldClass` (see AI-NOTES §13).\n- **QUESTIONS FOR THE AUTHOR (asked 2026-09-23, awaiting answers):**\n  1. **\"Always visible\" header — which situations?** My reading: make `.app-header` STICKY so the title + the\n     four buttons stay on screen while you scroll (today they scroll away on a long page), AND keep them\n     visible while the full-screen m
