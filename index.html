              \u003cbutton class=\"btn-reroll\" id=\"panel-gen-btn-${i}\" onclick=\"panelGenerateAction(${i})\" title=\"Generate this panel's images. With several panels selected, this generates every selected panel.\">🔄 Generate\u003c/button>\n              \u003cbutton class=\"btn-add-lib\" id=\"panel-genfrom-btn-${i}\" onclick=\"panelGenerateFromHereAction(${i})\" title=\"Generate this panel and every panel after it on this page. With several panels selected, this starts from the first selected panel.\">⚡ Generate All From Here\u003c/button>\n              \u003cbutton class=\"btn-dup\" id=\"panel-dup-btn-${i}\" onclick=\"panelDuplicateAction(${i})\" title=\"Insert a copy of this panel right after it — all of its data and prompt, but no images. With several panels selected, this duplicates the whole selection.\">⧉ Duplicate\u003c/button>\n              \u003cbutton class=\"btn-add-panel\" id=\"panel-add-btn-${i}\" onclick=\"panelAddAction(${i})\" title=\"Insert a new empty panel right after this one — later panels move down and are renumbered. With several panels selected, this adds one new empty panel per selected panel after the last of them.\">＋ Add Panel\u003c/button>\n              \u003cbutton class=\"btn-clear btn-clear-images\" id=\"panel-clear-imgs-btn-${i}\" onclick=\"panelClearImagesAction(${i})\" title=\"Remove all of this panel's images at once (keeps its characters, location, and action). With several panels selected, this clears the images of every selected panel.\" hidden>🗑 Clear Images\u003c/button>\n              \u003cbutton class=\"btn-clear\" id=\"panel-clear-btn-${i}\" onclick=\"panelClearAction(${i})\" title=\"Remove ALL of this panel's images, characters, locations, and descriptions (also stops an in-progress generation). With several panels selected, this clears every selected panel.\">🗑 Clear\u003c/button>\n              \u003cbutton class=\"btn-del-panel\" id=\"panel-del-btn-${i}\" onclick=\"panelDeleteAction(${i})\" style=\"background:var(--red);color:#fff;\" title=\"Delete this panel — later panels move up and are renumbered (its images and protection go too). With several panels selected, this deletes every selected panel, optionally pulling panels up from the following pages to keep this page full.\">🗑 Delete\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"panel-acc\" data-collapsed=\"1\">\n            \u003cdiv class=\"panel-acc-toggle\" onclick=\"togglePanelAcc(this)\" title=\"Open, download, or export this panel's images and settings\">💾 Files\u003c/div>\n            \u003cdiv class=\"panel-acc-body\">\n              \u003cbutton class=\"btn-open-all btn-view\" onclick=\"openPanelAll(${i})\" title=\"Open all of this panel's images in new tabs\" disabled>↗ Open All\u003c/button>\n              \u003cbutton class=\"btn-save-all btn-dl\" onclick=\"savePanelAll(${i})\" title=\"Download all of this panel's images as a single .zip\" disabled>⬇ Save All (.zip)\u003c/button>\n              \u003cbutton class=\"btn-export\" onclick=\"exportSettings()\" title=\"Download all panels' settings into one JSON file\">⬇ Export\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>`);\n      renderPanelObjects(i, 'state');\n      observePanelCard(document.getElementById('panel-card-' + i));\n    }\n    updatePanelSelects();\n    updatePanelVisibility();\n    restorePanelState();\n    updatePanelVisibility();\n    updatePanelSeedPlaceholders();\n    updatePanelHeaderLabels();\n    updateSeedChipStates();\n    updateCopyPrevChipStates();\n    updateSelectionUI();\n    updatePasteUI();\n    if (!gridHasListeners) {\n      gridHasListeners = true;\n      grid.addEventListener('input', e => { handleGridInput(e); schedulePanelSave(); });\n      grid.addEventListener('change', e => { handleGridInput(e); schedulePanelSave(); });\n    }\n    if (singleResume) {\n      const total = getPanelCount();\n      if (total >= 1) openSingleView(Math.min(singleResume, total));\n      else closeSingleView();\n    }\n  }\n\n  function updatePanelSelects() {\n    for (let i = 1; i \u003c= 24; i++) {\n      for (let s = 1; s \u003c= 3; s++) {\n        const cs = document.getElementById('panel-char-select-' + i + '-' + s);\n        if (!cs) continue;\n        const curC = cs.value;\n        cs.innerHTML = optionsHtml(CHAR_OPTIONS.filter(o => o[0] !== 'none')) + libraryOptions('char', 'Character') + '\u003coption value=\"__new_char__\">＋ New Character…\u003c/option>' + '\u003coption value=\"none\" selected>No Character Selected\u003c/option>';\n        if ([...cs.options].some(o => o.value === curC)) cs.value = curC;\n      }\n      const ls = document.getElementById('panel-loc-select-' + i);\n      if (!ls) continue;\n      const curL = ls.value;\n      ls.innerHTML = optionsHtml(LOC_OPTIONS) + libraryOptions('loc', 'Location') + '\u003coption value=\"__new_loc__\">＋ New Location…\u003c/option>';\n      if ([...ls.options].some(o => o.value === curL)) ls.value = curL;\n      const styleSel = document.getElementById('panel-style-' + i);\n      if (styleSel) {\n        const curS = styleSel.value;\n        styleSel.innerHTML = '\u003coption value=\"\">[Default (Global)]\u003c/option>' + Object.entries(ART_STYLES).map(([id, s]) => `\u003coption value=\"${id}\">${s.label}\u003c/option>`).join(\"\");\n        if ([...styleSel.options].some(o => o.value === curS)) styleSel.value = curS;\n      }\n    }\n    refreshAllPanelLineDescs();\n  }\n\n  function resolveDesc(selValue, builtinMap) {\n    if (!selValue) return \"\";\n    if (selValue.startsWith('lib:')) {\n      const id = selValue.split(':')[2];\n      const entry = loadLibraryObjects().find(e => e.id === id);\n      return entry ? entry.desc : \"\";\n    }\n    return builtinMap[selValue] || \"\";\n  }\n\n  function getPanelCount() {\n    const sel = document.getElementById('panelCount');\n    if (sel.value === 'custom') {\n      const n = parseInt(document.getElementById up';\n  let changelogFullLoaded = false;\n  let changelogFullLoading = false;\n\n  function ghRepoInfo() {\n    let owner = GH_FALLBACK_OWNER;\n    let repo = GH_FALLBACK_REPO;\n    try {\n      const o = (localStorage.getItem('comicGen.githubOwner') || '').trim();\n      const r = (localStorage.getItem('comicGen.githubRepo') || '').trim();\n      if (o) owner = o;\n      if (r) repo = r;\n    } catch (e) {}\n    return { owner: owner, repo: repo };\n  }\n\n  function changelogFetchTargets() {\n    const info = ghRepoInfo();\n    const owner = encodeURIComponent(info.owner);\n    const repo = encodeURIComponent(info.repo);\n    return [\n      { url: 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/CHANGELOG.md', headers: { Accept: 'application/vnd.github.v3.raw' } },\n      { url: 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/main/CHANGELOG.md', headers: null }\n    ];\n  }\n\n  function ghRepoBlobUrl(file) {\n    const info = ghRepoInfo();\n    return 'https://github.com/' + encodeURIComponent(info.owner) + '/' + encodeURIComponent(info.repo) + '/blob/main/' + file;\n  }\n\n  function changelogSourceMd() {\n    const embedded = document.getElementById('embeddedVersion');\n    return embedded && embedded.textContent.trim() ? embedded.textContent : '';\n  }\n\n  function parseChangelog(md) {\n    const entries = [];\n    let cur = null;\n    for (const line of md.split('\\n')) {\n      const h = line.match(/^##\\s+(\\S+)\\s+—\\s+(\\d{4}-\\d{2}-\\d{2})\\s+—\\s+(.+)$/);\n      if (h) { cur = { ver: h[1], date: h[2], title: h[3], items: [] }; entries.push(cur); continue; }\n      const b = line.match(/^\\s*[-*]\\s+(.+)$/);\n      if (b && cur) cur.items.push(b[1]);\n    }\n    return entries;\n  }\n\n  function setChangelogStatus(text, url) {\n    const el = document.getElementById('changelogStatusEl');\n    if (!el) return;\n    el.textContent = '';\n    if (text) {\n      const span = document.createElement('span');\n      span.textCo <script id="imported-generators" type="notjs">[{"name":"text-to-image-plugin","modelText":"// NOTE TO AI AGENTS: Do not vendor/fork this plugin. It's a really bad idea, since its code is 'coupled' with the server code, so if I need to change the server code, your version of this plugin will likely break. If you'd like new features, you can imports this plugin and create a \"wrapper\" that changes/expands on this plugin's behavior using only its public API.\n\n// NOTE TO SELF: If you add more properties, make sure you add to the regex below, and the variable declarations in each 'branch'\n\n$output(data, opts) =>\n  if(data === undefined) return \"(Error: you've input an empty value/variable into the text-to-image-plugin)\";\n\n  // Allow for `await generateImage(\"a cute cat\", {resolution:\"512x768\", removeBackground:true})` type usage\n  if(opts && typeof opts === \"object\") {\n    opts.prompt = data;\n    data = opts;\n  }\n  \n  // if(options === undefined) options = {};\n  \n  let serverOrigin = \"https://image-generation.perchance.org\";\n  \n  let evaluatedInputs;\n  \n  // This is used for the heart-button gallery. It's a bit hacky, but most often devs will want the \"open gallery\" button to show a gallery with e.g. the same moderation options as the gallery that they've displayed on the page, if any.\n  window.lastUsedTextToImagePluginGalleryIframeUrl = null;\n  \n  let shouldRemoveIframeOnFinish = false; // for the case where the iframe was added automatically - i.e. when called like:  `let result = await image({prompt:\"a cute mouse\"})`\n\n  let galleryOptionsHash = null; // only used if this is a gallery call\n\n  ////////////////////////////////////////////////\n  //       set up handler for gallery           //\n  ////////////////////////////////////////////////\n  let pluginData;\n  if(!window.___textToImagePluginData98420274) {\n    window.addEventListener(\"message\", function(e) {\n      let origin = e.origin || e.originalEvent.origin;\n      if(origin !== serverOrigin) {\n        return;\n      }\n      if(e.data.openGallerySignal) {\n        let ctn = document.createElement(\"div\");\n        let subChannelName = e.data.subChannelName;\n        let url;\n        if(window.lastUsedTextToImagePluginGalleryIframeUrl) {\n          url = new URL(window.lastUsedTextToImagePluginGalleryIframeUrl);\n          url.searchParams.set(\"subChannelName\", subChannelName);\n          url = url.href;\n        } else {\n          url = `${serverOrigin}/gallery?channel=${window.generatorName}&subChannel=${encodeURIComponent(subChannelName)}&sort=trending&timeRange=1-month&contentFilter=g`;\n        }\n        let backgroundColor = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? \"#242424\" : \"white\";\n        ctn.innerHTML = `\u003cdiv onclick=\"this.remove()\" style=\"backdrop-filter:brightness(0.3);position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;\">\u003cdiv style=\"position:fixed;top:5vh;bottom:5vh;left:5vh;right:5vh;background:${backgroundColor};border-radius:3px;\">\u003ciframe src=\"${url}\" style=\"border:0;width:100%;height:100%;\">\u003c/iframe>\u003c/div>\u003c/div>`;\n        document.body.appendChild(ctn.firstElementChild);\n      }\n      if(e.data.savedImageToGallerySignal) {\n        document.querySelectorAll(\".text-to-image-plugin-gallery\").forEach(el => {\n          let targetOrigin = serverOrigin;\n          try { if(el.contentWindow) el.contentWindow.postMessage({doRefreshIfSortingByRecent:true}, targetOrigin); } catch(e) {} // embed may have been detached (2026-08-24: null contentWindow threw the generic error toast)\n          \n          // the code below is commented out because it doesn't work for the case where the user has switched the sort to recent (since, counter-intuitively, iframe's window.location can change, while iframe.src stays as the original value - I'm assuming this is due to cross-origin security stuff)\n          // if(el.src.includes(\"sort=recent\")) {\n          //   // refresh galleries that are sorted by recent if the user makes a submission\n          //   let url = new URL(el.src);\n          //   url.searchParams.set(\"cacheBust\", Math.random().toString());\n          //   el.src = \"\"; // we do this instead of el.src=el.src because that doesn't work if the URL has a hash in it, and I might need to add data in the hash later\n          //   setTimeout(() =>el.src=url.href, 700); // we need to wait a bit for the iframe to actually initiate a reload/refresh before setting the src again\n          // }\n        });\n      }\n      if(e.data.documentHeightChanged) {\n        document.querySelectorAll(\".text-to-image-plugin-gallery\").forEach(el => {\n          if(el.dataset.adaptiveHeight === \"yes\") {\n            el.style.height = (e.data.newHeight+1)+\"px\";\n            console.debug(\"Updated gallery height\", e.data.newHeight);\n          }\n        });\n      }\n      if(e.data.customButtonClickEvent) {\n        if(e.data.isButton2) {\n          let handlerFn = pluginData.galleryCustomButton2ClickHandlers[e.data.galleryInstanceId];\n          if(handlerFn) handlerFn(e.data.onClickHandlerData);\n        } else {\n          let handlerFn = pluginData.galleryCustomButtonClickHandlers[e.data.galleryInstanceId];\n          if(handlerFn) handlerFn(e.data.onClickHandlerData);\n        }\n      }\n    });\n    window.___textToImagePluginData98420274 = {\n      galleryCustomButtonClickHandlers: {},\n      galleryCustomButton2ClickHandlers: {},\n    };\n  }\n  pluginData = window.___textToImagePluginData98420274;\n  \n  if(data.gallery) {\n    let sort = data.sort ? data.sort.evaluateItem : \"recent\";\n    if(sort === \"best\") sort = \"top\"; // alias\n    \n    let contentFilter = data.contentFilter ? data.contentFilter.evaluateItem.toLowerCase() : \"g\";\n    if(contentFilter === \"pg-13\") contentFilter = \"pg13\";\n    if(contentFilter !== \"pg13\" && contentFilter !== \"g\") contentFilter = \"g\";\n    \n    let bannedUsers = data.bannedUsers ? data.bannedUsers.selectAll.map(item => item.toString()) : [];\n    \n    // let bannedPromptPhrases = data.bannedPromptPhrases ? data.bannedPromptPhrases.selectAll.map(item => item.getRawListText.replace(\"/\\\\^\", \"/^\")) : [];\n    let bannedPromptPhrases = [];\n    if(data.bannedPromptPhrases) {\n      if(Array.isArray(data.bannedPromptPhrases)) {\n        bannedPromptPhrases = data.bannedPromptPhrases.map(item => item.toString());\n      } else {\n        bannedPromptPhrases = data.bannedPromptPhrases.selectAll.map(item => item.getRawListText.replace(\"/\\\\^\", \"/^\"));\n      }\n    }\n\n    // let bannedNegativePromptPhrases = data.bannedNegativePromptPhrases ? data.bannedNegativePromptPhrases.selectAll.map(item => item.getRawListText.replace(\"/\\\\^\", \"/^\")) : [];\n    let bannedNegativePromptPhrases = [];\n    if(data.bannedNegativePromptPhrases) {\n      if(Array.isArray(data.bannedNegativePromptPhrases)) {\n        bannedNegativePromptPhrases = data.bannedNegativePromptPhrases.map(item => item.toString());\n      } else {\n        bannedNegativePromptPhrases = data.bannedNegativePromptPhrases.selectAll.map(item => item.getRawListText.replace(\"/\\\\^\", \"/^\"));\n      }\n    }\n\n    let defaultSubChannelNames = [];\n    if(data.defaultGalleryNames) {\n      if(typeof data.defaultGalleryNames === \"string\") {\n        defaultSubChannelNames = data.defaultGalleryNames.split(\",\").map(name => name.trim()).filter(name => name && /^[a-z0-9\\-]+$/.test(name));\n      } else {\n        defaultSubChannelNames = data.defaultGalleryNames.selectAll.map(item => item+\"\");\n      }\n    }\n    \n    let timeRange = data.timeRange ? data.timeRange.evaluateItem : (sort === \"recent\" ? \"all-time\" : \"1-month\");\n    let hideIfScoreIsBelow = data.hideIfScoreIsBelow !== undefined ? Number(data.hideIfScoreIsBelow.evaluateItem) : -1000000000;\n    if(isNaN(hideIfScoreIsBelow)) hideIfScoreIsBelow = -1000000000;\n    \n    let galleryOptions = {sort, timeRange, hideIfScoreIsBelow, contentFilter, subChannel:\"public\"}; // this is also used for checking if gallery options have been udpated (see below)\n    if(data.forceColorScheme) galleryOptions.forceColorScheme = data.forceColorScheme;\n\n    const galleryInstanceId = \"galleryInstanceId\"+(Math.random().toString()+Math.random().toString()).replaceAll(\".\", \"\");\n    \n    let customButtonEmoji = null;\n    let shouldShowCustomButton = false;\n    let customButtonOptions = data.customButton || data.customButton1;\n    if(customButtonOptions) {\n      shouldShowCustomButton = true;\n      if(customButtonOptions.onClick) pluginData.galleryCustomButtonClickHandlers[galleryInstanceId] = customButtonOptions.onClick;\n      if(customButtonOptions.emoji) customButtonEmoji = customButtonOptions.emoji.evaluateItem;\n    }\n\n    let customButton2Emoji = null;\n    let shouldShowCustomButton2 = false;\n    if(data.customButton2) {\n      shouldShowCustomButton2 = true;\n      if(data.customButton2.onClick) pluginData.galleryCustomButton2ClickHandlers[galleryInstanceId] = data.customButton2.onClick;\n      if(data.customButton2.emoji) customButton2Emoji = data.customButton2.emoji.evaluateItem;\n    }\n    \n    let hashData = {galleryInstanceId, shouldShowCustomButton, customButtonEmoji, shouldShowCustomButton2, customButton2Emoji, bannedUsers, bannedPromptPhrases, bannedNegativePromptPhrases, injectedStyles:{}, defaultSubChannelNames};\n    if(data.style) {\n      let style = data.style.evaluateItem.trim();\n      if(style.includes(\"background:\")) {\n        hashData.injectedStyles.background = (style.match(/(?:^|;) *background:(.+?)(?:;|$)/) || [])[1];\n      } else if(style.includes(\"background-color:\")) {\n        hashData.injectedStyles.background = (style.match(/(?:^|;) *background-color:(.+?)(?:;|$)/) || [])[1];\n      }\n    }\n    \n    let otherUrlParams = {channel:window.generatorName};\n    let iframe lse;\n  \n  if(data.prompt === undefined) {\n    d.prompt = data.evaluateItem.toString(); // they passed in some text directly like [image(\"a carrot\")]\n  } else {\n    d.prompt = data.prompt.evaluateItem.toString();\n  }\n  // Apply some covenience fixes to the prompt, even though the plugin user should ideally fix this on their end:\n  d.prompt = d.prompt.replace(/\u003cspan [^>]+______tippy-tooltip-[^>]+>(.+?)\u003c\\/span>/, \"$1\");\n  \n  // parse values from prompts like: `this is the prompt text (size:::400) (resolution:::512x768) (guidanceScale:::10)`\n  if(d.prompt.includes(\":::\")) {\n    let matches = [...d.prompt.matchAll(/\\((seed|size|style|resolution|width|height|guidanceScale|saveTitle|saveDescription)\\:\\:\\:/g)];\n    // console.debug(\"matches:\", matches);\n    const numericProps = [\"seed\", \"width\", \"height\", \"guidanceScale\", \"width\", \"height\", \"size\"];\n    for(let match of matches) {\n      let re = new RegExp(`\\\\(${match[1]}\\\\:\\\\:\\\\:(.+?)\\\\).*?(?:\\\\:\\\\:\\\\:|$)`, \"m\");\n      let value = (d.prompt.match(re) || [])[1]\n      let key = match[1];\n      if(value !== undefined) {\n        d[key] = numericProps.includes(key) ? Number(value) : value;\n        d.prompt = d.prompt.replace(`(${key}:::${value})`, \"\");\n      }\n    }\n    d.prompt = d.prompt.trim();\n  }\n  if(!window.___t2i__parseNegativePrompt) {\n    window.___t2i__parseNegativePrompt = function(str) {\n      const prefix = '(negativePrompt:::';\n      const start = str.indexOf(prefix);\n      if (start === -1) return null;\n      let depth = 0;\n      let result = '';\n      for(let i = start + prefix.length; i \u003c str.length; i++) {\n        if(str[i] === '(') {\n          depth++;\n        } else if (str[i] === ')') {\n          if(depth === 0) {\n            break;\n          }\n          depth--;\n        }\n        result += str[i];\n      }\n      return result;\n    };\n  }\n  if(d.prompt.includes(\"(negativePrompt:::\")) {\n    let res
